<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <title>Octo — PNDS 章鱼指挥家吉祥物</title>

  <!-- ═══════════════ defs ═══════════════ -->
  <defs>
    <!-- 几何连梁八分音符（黑） -->
    <g id="note">
      <circle cx="0" cy="0" r="12"/>
      <circle cx="36" cy="-7" r="12"/>
      <rect x="8" y="-56" width="8" height="56"/>
      <rect x="44" y="-63" width="8" height="56"/>
      <polygon points="8,-56 52,-63 52,-47 8,-40"/>
    </g>
    <!-- 十字碎片 -->
    <g id="plus">
      <rect x="-20" y="-5" width="40" height="10"/>
      <rect x="-5" y="-20" width="10" height="40"/>
    </g>
    <!-- 嘴部裁剪 -->
    <clipPath id="mouthClip">
      <path d="M 392 486 Q 452 502 514 484 Q 518 526 470 542 Q 452 546 434 542 Q 388 526 392 486 Z"/>
    </clipPath>
  </defs>

  <!-- ═══════════════ 画布 ═══════════════ -->
  <rect width="900" height="900" fill="#fff1c9"/>
  <rect x="18" y="18" width="864" height="864" fill="none" stroke="#000" stroke-width="8"/>

  <!-- ═══════════════ 背景碎片 ═══════════════ -->
  <g fill="#000">
    <use href="#plus" transform="translate(108 156)"/>
    <use href="#plus" transform="translate(648 86) scale(0.8)"/>
    <circle cx="256" cy="112" r="8"/>
    <polygon points="140,766 162,802 118,802"/>
    <use href="#note" transform="translate(800 800) rotate(8) scale(0.9)"/>
  </g>
  <rect x="754" y="106" width="24" height="24" fill="#7fd8ce" stroke="#000" stroke-width="5" transform="rotate(18 766 118)"/>
  <rect x="45" y="415" width="26" height="26" fill="#ffd966" stroke="#000" stroke-width="5" transform="rotate(12 58 428)"/>
  <circle cx="836" cy="424" r="13" fill="#ff9ec4" stroke="#000" stroke-width="5"/>

  <!-- ═══════════════ 角色整体（微倾斜 2.5°，贴纸感） ═══════════════ -->
  <g transform="rotate(-2.5 450 480)">

    <!-- ── 硬投影层：纯黑剪影，整体偏移 ── -->
    <g transform="translate(16 16)">
      <path d="M 283 528 L 283 402 C 283 258 357 184 450 184 C 543 184 617 258 617 402 L 617 528 C 560 548 340 548 283 528 Z" fill="#000"/>
      <g fill="none" stroke="#000" stroke-width="62" stroke-linecap="round">
        <path d="M 585 502 C 636 470 658 424 666 368"/>
        <path d="M 608 514 C 664 522 700 542 720 578"/>
        <path d="M 505 526 C 520 570 520 604 520 660"/>
        <path d="M 400 524 C 396 578 366 606 330 608 C 300 610 282 592 288 570"/>
        <path d="M 300 514 C 244 530 208 552 190 586"/>
        <path d="M 318 498 C 266 472 240 434 236 390"/>
      </g>
      <rect x="714" y="584" width="88" height="132" rx="10"/>
      <rect x="468" y="646" width="104" height="104"/>
      <rect x="92" y="590" width="116" height="116"/>
    </g>

    <!-- ── 声音引擎块（黄）：PNDS 驱动的 sound engine ── -->
    <g>
      <rect x="92" y="590" width="116" height="116" fill="#ffd966" stroke="#000" stroke-width="9"/>
      <circle cx="150" cy="622" r="9" fill="none" stroke="#000" stroke-width="6"/>
      <circle cx="150" cy="666" r="27" fill="none" stroke="#000" stroke-width="8"/>
      <circle cx="150" cy="666" r="10"/>
      <path d="M 66 630 Q 56 646 66 662" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
      <path d="M 46 622 Q 32 646 46 670" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- ── 扫码加入块（粉）：QR ── -->
    <g>
      <rect x="468" y="646" width="104" height="104" fill="#ff9ec4" stroke="#000" stroke-width="9"/>
      <g fill="none" stroke="#000" stroke-width="6">
        <rect x="478" y="656" width="24" height="24"/>
        <rect x="538" y="656" width="24" height="24"/>
        <rect x="478" y="716" width="24" height="24"/>
      </g>
      <g fill="#000">
        <rect x="485" y="663" width="10" height="10"/>
        <rect x="545" y="663" width="10" height="10"/>
        <rect x="485" y="723" width="10" height="10"/>
        <rect x="514" y="698" width="8" height="8"/>
        <rect x="530" y="672" width="8" height="8"/>
        <rect x="536" y="722" width="8" height="8"/>
      </g>
    </g>

    <!-- ── 演奏者块（青）：手机 ── -->
    <g>
      <rect x="714" y="584" width="88" height="132" rx="10" fill="#7fd8ce" stroke="#000" stroke-width="9"/>
      <rect x="728" y="602" width="60" height="84" fill="#fffbe0" stroke="#000" stroke-width="5"/>
      <use href="#note" transform="translate(746 662) scale(0.42)" fill="#000"/>
      <circle cx="758" cy="703" r="6.5" fill="#000"/>
    </g>

    <!-- ── 腕足（电路走线式）：黑描边层 ── -->
    <g fill="none" stroke="#000" stroke-width="62" stroke-linecap="round">
      <path d="M 585 502 C 636 470 658 424 666 368"/>
      <path d="M 608 514 C 664 522 700 542 720 578"/>
      <path d="M 505 526 C 520 570 520 604 520 660"/>
      <path d="M 400 524 C 396 578 366 606 330 608 C 300 610 282 592 288 570"/>
      <path d="M 300 514 C 244 530 208 552 190 586"/>
      <path d="M 318 498 C 266 472 240 434 236 390"/>
    </g>
    <!-- ── 腕足：橙色主体层 ── -->
    <g fill="none" stroke="#ff5722" stroke-width="44" stroke-linecap="round">
      <path d="M 585 502 C 636 470 658 424 666 368"/>
      <path d="M 608 514 C 664 522 700 542 720 578"/>
      <path d="M 505 526 C 520 570 520 604 520 660"/>
      <path d="M 400 524 C 396 578 366 606 330 608 C 300 610 282 592 288 570"/>
      <path d="M 300 514 C 244 530 208 552 190 586"/>
      <path d="M 318 498 C 266 472 240 434 236 390"/>
    </g>
    <!-- 卷腕上的吸盘（奶白小点） -->
    <g fill="#fffbe0">
      <circle cx="360" cy="604" r="6.5"/>
      <circle cx="334" cy="607" r="6.5"/>
      <circle cx="304" cy="596" r="6.5"/>
    </g>

    <!-- ── 指挥棒 + 挥动弧线 + 音符 ── -->
    <g stroke="#000" stroke-linecap="round" fill="none">
      <line x1="652" y1="388" x2="748" y2="232" stroke-width="11"/>
      <path d="M 700 316 Q 714 308 721 293" stroke-width="7"/>
      <path d="M 722 262 Q 734 254 740 240" stroke-width="7"/>
    </g>
    <use href="#note" transform="translate(748 200) rotate(12) scale(1.25)" fill="#000"/>
    <!-- 左手举起的音符 -->
    <use href="#note" transform="translate(190 378) rotate(-14) scale(1.55)" fill="#000"/>

    <!-- ── 头 ── -->
    <path d="M 283 528 L 283 402 C 283 258 357 184 450 184 C 543 184 617 258 617 402 L 617 528 C 560 548 340 548 283 528 Z"
          fill="#ff5722" stroke="#000" stroke-width="9"/>

    <!-- ── 脸板（奶白几何面板） ── -->
    <path d="M 306 370 L 594 370 L 610 448 L 574 530 L 326 530 L 290 448 Z"
          fill="#fffbe0" stroke="#000" stroke-width="7"/>

    <!-- 眉毛（黑条，一挑一压） -->
    <rect x="350" y="346" width="86" height="16" fill="#000" transform="rotate(-10 393 354)"/>
    <rect x="472" y="336" width="94" height="16" fill="#000" transform="rotate(14 519 344)"/>

    <!-- Googly eyes -->
    <circle cx="398" cy="438" r="46" fill="#fff" stroke="#000" stroke-width="8"/>
    <circle cx="514" cy="432" r="54" fill="#fff" stroke="#000" stroke-width="8"/>
    <circle cx="412" cy="430" r="17" fill="#000"/>
    <circle cx="530" cy="420" r="20" fill="#000"/>
    <rect x="404" y="418" width="12" height="12" fill="#fff"/>
    <rect x="520" y="406" width="14" height="14" fill="#fff"/>

    <!-- 嘴：张嘴大笑 + 白牙 + 红舌 -->
    <path d="M 392 486 Q 452 502 514 484 Q 518 526 470 542 Q 452 546 434 542 Q 388 526 392 486 Z" fill="#000"/>
    <g clip-path="url(#mouthClip)">
      <rect x="416" y="490" width="20" height="16" fill="#fff"/>
      <rect x="445" y="492" width="20" height="16" fill="#fff"/>
      <rect x="474" y="489" width="20" height="16" fill="#fff"/>
      <ellipse cx="453" cy="534" rx="30" ry="13" fill="#c2103c"/>
    </g>

    <!-- 腮红方块 -->
    <rect x="312" y="478" width="36" height="22" fill="#c2103c" transform="rotate(-8 330 489)"/>
    <rect x="556" y="470" width="36" height="22" fill="#c2103c" transform="rotate(8 574 481)"/>
  </g>
</svg>
