name: 'Release PNDS'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-tauri:
    permissions:
      contents: write
    # V1 scope: macOS Apple Silicon only (see docs/PNDS_APP_REQUIREMENTS.md §2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the Node 24 series to match the bundled sidecar runtime
      # (scripts/fetch-node.sh); lts/* drifts to newer majors over time.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # src-tauri/binaries, Frameworks, plugins, and resources/synthdefs are
      # gitignored (~100MB Node runtime + SuperCollider extraction); these
      # scripts provision them fresh on every release build.
      - name: Fetch Node sidecar
        run: npm run node:fetch

      - name: Fetch scsynth binary and compile master synthdef
        run: npm run scsynth:fetch

      - name: Build and release
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'PNDS ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## PNDS ${{ github.ref_name || inputs.version }}

            ### What's New in V1.1
            - **Bundled Node.js 24.18.1** — projects run without any Node install on the host Mac
            - **Discrete multichannel output** (1–64 channels) in Internal mode, verified with the built-in 16-channel tone-test project; a channel-poor device degrades gracefully (e.g. `16ch → 2ch`) and the app shows exactly what is lost
            - **Device capability UI** — output device and channel counts are queried at the project sample rate before launch
            - **Fullscreen & window animation** — native fullscreen with whole-window fade, monitor resizes without reloading or reconnecting
            - **Retry** — the error page truly restarts the session (with proper cleanup of the failed attempt); Back/Close returns to Welcome

            ### Installation Instructions
            - **macOS (Apple Silicon)**: Download the `.dmg` file and drag PNDS to the Applications folder
            - V1 builds are ad-hoc signed (no Apple notarization). On first launch macOS will block the app: right-click PNDS → **Open**, or **System Settings → Privacy & Security → Open Anyway**.

            ### Auto-Updates
            Existing users will receive automatic update notifications.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name || inputs.version }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: '--bundles app,dmg'
