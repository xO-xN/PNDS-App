name: 'Release PNDS'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-tauri:
    permissions:
      contents: write
    # V1 scope: macOS Apple Silicon only (see docs/developer/app-behavior.md 平台与交付范围)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the Node 24 series to match the bundled sidecar runtime
      # (scripts/fetch-node.sh); lts/* drifts to newer majors over time.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # src-tauri/binaries, Frameworks, plugins, and resources/synthdefs are
      # gitignored (~100MB Node runtime + SuperCollider extraction); these
      # scripts provision them fresh on every release build. The built-in
      # utility tools (unpacked under resources/utilities) are fetched,
      # checksum-verified, and unpacked automatically by the build's
      # beforeBuildCommand (npm run utilities:fetch).
      - name: Fetch Node sidecar
        run: npm run node:fetch

      - name: Fetch scsynth binary and compile master synthdef
        run: npm run scsynth:fetch

      - name: Build and release
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'PNDS ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## PNDS ${{ github.ref_name || inputs.version }}

            ### What's New in V1.3.1 — the Help center in English, a performer-first Welcome & the Brutal octopus

            **The documentation speaks your language**
            - The entire Help corpus — the User Tutorial, the Creator Guide and the Reference Manual, all 13 documents — now exists in English as well as Chinese. Terminology follows a locked glossary (Digital Score, .pnds bundle, performance, performer, monitor), and cross-document links stay inside your language's tree — one click never drops you into the other language.
            - The Help center follows the App's resolved language: English UI, English documentation. Switch the app language while the Help window is open and it hot-swaps in place — the documents and the standing search rebuild on the new language without reopening the window; a failed switch shows the error and Retry asks again.
            - Search results are never a language mix — the index is built only from the tree you are reading. Translation trouble is loud, not silent: a missing document is an explicit error, never a quiet fallback to the other language, and the build itself fails if the two language trees drift apart.

            **A Welcome that starts where the show starts**
            - The welcome page now carries three tips: open a project from the left sidebar (the performer's main path), hold ⌘ to drive the App with the keyboard, and see Help for the full documentation. The "add a new project" suggestion is gone — importing lives in the sidebar where it always worked.
            - Product naming is consistent now: English copy calls the product only "PNDS"; Chinese keeps the full product name.

            **Brutal gains an octopus**
            - The Brutal sidebar has its mascot: an octopus holding a synth keyboard, seated exactly on the audio settings card — its shelf line lands on the card's top edge, with the hands and part of the face dipping inside. It rides along when the card's height changes (audio mode, device rows, volume) and never intercepts a click; the project list keeps clear of the art — cards page above it with their transparent look intact in every theme, and the + import project button waits at the list's tail as a solid Brutal button (the translucent chip elsewhere).
            - Known note: squaring the Help window's corners to match the main window under Brutal was explored this cycle and rejected — a standard titled window cannot safely take the main window's see-through structure at runtime. The decision is recorded in the developer docs; Brutal keeps its squared main window as before.

            **Smaller fixes**
            - The Utilities folder counts each built-in tool once — moving between a dev and a release build no longer lists every tool twice (tool identity now rides the registry id, and stale copies self-heal on the next launch).
            - ⌘← / ⌘→ folder switching wraps around at the ends like the segment arrows — with three views, the old stop at the edge read as stuck.

            ### What's New in V1.3.0 — addresses on the menu, language-following tools & the offline Help center

            **Performer & Conductor addresses, always on the menu**
            - The Window menu permanently carries the selected project's two complete addresses (the chosen LAN IP joined with the performer and monitor ports). One click copies one address — the toast names what landed in the clipboard — ready to paste into a chat for the performers. The segment follows project selection and the LAN choice live; with no project selected the items wait as disabled labels, never a made-up address.

            **A language bridge for tools & templates**
            - The App now pushes its resolved language to monitor pages through a new `pnds:locale` message and a `?lang=` first-frame parameter — the same one-way, best-effort, latest-value-wins contract as the theme bridge, and just as optional: a page that never listens is untouched.
            - All three built-in utilities follow the app language now — Local Network Diagnostics v0.3.0, Multichannel Signal Generator v1.2.0, and **Telematic Network Diagnostics v0.2.0 joins the Utilities folder** as the third built-in tool. PNDS-Template ships the reference implementation, so new projects follow the language by default.

            **Help menu & the offline Help center**
            - A new top-level Help menu: **Search Help ⌘?** (⇧⌘/ — the same physical chord) plus direct entries to the User Tutorial, the Creator Guide and the Reference Manual.
            - The Help center is a window of its own: live search over the entire documentation corpus — ranked hits showing document, section and snippet; a click opens the page, scrolls to the hit section and keeps the matched terms highlighted; a sidebar browses every document by book. Cross-document links navigate inside the window (external links open in your browser), and the window follows the app's language and theme live. It is fully offline — the documentation ships inside the app.
            - The UI copy is bilingual; the documentation corpus itself is Chinese in this release (the English translation is planned for a follow-up).

            **No more flashes**
            - Opening a project cross-fades from the loading screen to the monitor once the page is actually ready (with a timeout backstop); reloading the monitor does the same.
            - The very first visible frame is already themed: cold start no longer flashes the light default before your saved theme lands, and theme-following monitor pages render correctly on their first frame (`?theme=`).

            **Other fixes**
            - The snug select no longer clips its label's right edge; settings polish and a smoother project-switch fade (user reports).
            - The Help center's documents read in the standard system typeface, and links inside the documentation stay inside the Help center instead of navigating the window away (user report).

            ### What's New in V1.2.3 — browse freely mid-show & four themes

            **Selecting is free while a show runs**
            - Clicking any project card while a session runs — or ⌘1..9, ⌘O, a Finder drop, a double-clicked `.pnds` — now selects and checks that project and never touches the running one. The old "loading this will close the current server" dialog is gone; switching is confirmed at the moment you start, not when you browse.
            - The running project keeps its accent bar and its folder's "in use" dot no matter what is selected; the white selection pill slides independently.
            - Each card shows its own check result: a small spinner while checking, a red marker (hover for the reason) when dependencies or a port conflict fail — so a broken next project is visible before you close the current one.

            **Starting another project over a live session**
            - The settings card follows the selected card: any other card shows its own start config (synth mode / OSC / output device) with a **Load** button; the running card keeps **Close / Change** and the live volume slider (adjusting volume means going back to the running card).
            - **Load — or Enter — over a live session asks once** ("Start …? This will first close the running project …"), then stops the old project and starts the new one in a single flow. If the previous project died with an error, the next one starts directly.
            - ⌘W closing the running project keeps a different selected card selected — and immediately loadable.
            - Checking another project can no longer harm the running one: the backend preflight spares the live session's Node and scsynth processes and treats ports held only by the session as free (a third-party holder still reports a conflict).

            **Keyboard, views & the monitor**
            - ⌘↑/⌘↓ now stay in the current folder view instead of jumping back into the selected project's folder; a selection absent from the view enters from the matching end.
            - The monitor title always names the running project — custom display names included — and the monitor page plus the Share link always target the running session's address; selecting another project can never retarget or reload the live monitor.

            **Themes (Settings → Appearance)**
            - Four complete color themes: **Lavender** (light, default), **Sand** (medium depth), **Stage** (dark) and **Brutal** — a Neo-brutalism take with squared window corners, Archivo type, a solid cream sidebar and an amber accent. The choice persists across launches.
            - **Projects can follow the App theme** (optional, new contract): the App pushes the current theme's palette to the monitor page on load, on theme switches and on window regains; a project that listens recolors with the App, one that doesn't is untouched. Both built-in utilities now follow it — bundled as Local Network Diagnostics v0.2.0 and Multichannel Signal Generator v1.1.0 — and the PNDS Template ships the reference implementation for creators.
            - Known note: the macOS 26 "liquid glass" theme was explored this cycle and dropped — the transparency pipeline did not hold up on target systems. A stored preference for it (or for the old "Midnight" name) safely falls back.

            **Other fixes**
            - The default webview right-click menu is suppressed in every frame; the volume slider's cursor stays an arrow; the ⌘-peeked sidebar no longer retracts under a resting pointer.

            ### What's New in V1.2.2 — folders as a switch & a fully tuned sidebar

            **Folders are a switch now**
            - **The folder switch** — folders live in a segmented control at the top of the sidebar: the track fills the row, segment widths follow their names, and a white pill slides between them. Home lists ungrouped projects; every folder is one click (or one key) away. The old breadcrumb drill-in is gone.
            - **Right-click to manage** — new / rename / delete live on the segment's context menu (rename shares ⌘R); the built-in Utilities folder stays pinned last and protected. The switch caps at 3 folders and 30 projects per folder, with the reason shown when disabled; folder names can never collide — repeat creations pick " 2", " 3"… and a clashing rename refuses.
            - **Real tab semantics** — the segments are a tablist with a roving tabindex (one Tab reaches the switch); ←/→ on a focused segment cycles views.
            - **Filing by drag** — drop a project on a folder segment to file it, on the Home segment to return it; the pill fades out during the drag and back in at the landing.

            **One Cmd-arrow grid**
            - **⌘← / ⌘→ switch folder views** — clamped at both ends (Home is not left, the last folder is not right), through the same entry as a segment click. **⌘↑ / ⌘↓** keep walking the visible order, so the four Cmd arrows navigate folder × project as one grid. (⌘←/⌘→ briefly adjusted volume during the beta; that role is gone — ⌘M keeps mute, the slider keeps fine control.)

            **Project list, polished**
            - **The selection is a sliding pill** — the white highlight glides between cards instead of crossfading per card, and snaps into place (never slides from stale geometry) when a folder switch replaced the list.
            - **Tail import** — the "+" import entry moved to the end of the list; the sidebar header is copy-only.
            - **The running project reads at a glance** — an accent bar on its card from the moment the session starts; an idle selection stays a plain white card.
            - **Fade bands with equal rights** — static 20px fades at both ends of the list; a keyboard-selected card scrolls clear of them exactly like a clicked one, with minimal movement.
            - **Independent scrolling** — the project list scrolls on its own again, and cards keep full height inside the scroller. Cards left the Tab order: the switch is the one stop.

            **The settings audio pair**
            - **Click-to-mute speaker** — click to mute (the restore value is remembered), click again to restore; dragging to 0 reads as muted and leaving 0 releases it. Mute is session-only — every show starts at the known default 80%.
            - **Redrawn volume slider** — thin groove, accent fill, white knob; disabled honestly (external/none mode, no session, >2-channel fixed gain), and it never steals your cursor — the arrow stays an arrow.
            - **⌘M mutes** — the menu accelerator claims the key from macOS's hide; emergency silence works under any dialog.

            **Interaction consistency**
            - One arrow cursor everywhere, one shared accent focus ring (keyboard-only), press feedback on every control (cards darken, buttons micro-shrink), and `prefers-reduced-motion` swaps the new animations for instant transitions.

            **Reliability**
            - The session reports ready only after the master startup stage actually confirms; the monitor can no longer steal keyboard focus when it loads; occlusion and switch catch-ups no longer stall loading or the ⌘ layer.

            ### What's New in V1.2.0 — settings, ports & the creator distribution loop
            - **Settings panel (⌘,)** — language, ports with occupant identity and one-click release, developer tools, and About in one scrolling page.
            - **`.pnds` bundles** — Pack Project turns a directory project into a single-file bundle; double-click or drop to install and run. Trust-confirmation dialogs are gone — adding a project goes straight to preflight.
            - **Compile SynthDef** — one click compiles `supercollider/source/*.scd` enforcing the naming contract; failures surface sclang output verbatim.
            - **Global sample-rate preference** — the app-hosted scsynth always boots at the app-level rate (Settings → Audio).
            - **Logging** — frontend events land in the app log file; rotation grew to ~2 MB so a full performance cycle survives.

            ### What's New in V1.1.2 — the performer-ready sidebar
            - **Performance folders (set lists)** — group projects into one-level folders; click to drill in with a breadcrumb, an "in use" dot marks the folder holding the running project. Dropping a project on a folder files it in; dropping a member on the breadcrumb returns it to the ungrouped list; folders sort by dragging.
            - **⌘ number selection** — hold Cmd to reveal ⌘1..⌘9 badges over the visible projects and pick one by number; a folder view numbers only that folder's members. While a session runs, holding Cmd also peeks the sidebar out over the monitor.
            - **⌘↓ / ⌘↑ next & previous project** — walk the visible list like a set list ("next song"): clamped at both ends, and if the current project lives in a folder you left, the move drills back into it first. While a session runs, switching goes through the same confirmation as clicking a card.
            - **Rebuilt drag & drop** — drag anywhere on a card: the card lifts as a floating clone, the list yields a gap at the drop slot, and the drop lands at the midpoint-judged position.
            - **Custom display names** — ⌘R (or Edit → Rename Project) renames a selected project or the open folder in place; Enter commits, Esc cancels, empty falls back to the folder name. Names persist across launches.
            - **Safer close & quit** — Esc opens a confirmation before closing the running project; ⌘Q now confirms before quitting while a session is live. In every confirmation dialog Enter activates the primary (dark) action and Esc cancels.
            - **Keyboard focus fix** — the monitor page could take keyboard focus when it loaded, killing the ⌘ shortcuts and Esc on the first project opened after launch until the next click; the host now reclaims focus on every monitor load.
            - **Built-in Utilities folder** — two utility projects (Local Network Diagnostics, Multichannel Signal Generator) ship inside the app and appear in a default Utilities folder on first launch; the folder itself can't be renamed or deleted.
            - **Refreshed starting page** — the hint is plain copy now; adding a project lives in the sidebar's Projects header "+".

            ### What's New in V1.1.1
            - **Window shortcuts** — new View menu: Zoom In (⌘=), Zoom Out (⌘-), Actual Size (⌘0), and Reload Monitor (⌘⇧R), with browser-style monitor zoom (50–200%, ±10% steps, session-only)
            - **One close flow for ⌘W and the red light** — confirm before stopping a live session, then fade-hide; the app keeps running in the Dock
            - **16px corners everywhere** — window, sidebar, and dialogs share one corner radius; no white leak at the corners on black-background projects
            - **New app icon** — regenerated from the full-bleed logo master

            ### What's New in V1.1
            - **Bundled Node.js 24.18.1** — projects run without any Node install on the host Mac
            - **Discrete multichannel output** (1–64 channels) in Internal mode, verified with the built-in 16-channel tone-test project; a channel-poor device degrades gracefully (e.g. `16ch → 2ch`) and the app shows exactly what is lost
            - **Device capability UI** — output device and channel counts are queried at the project sample rate before launch
            - **Fullscreen & window animation** — native fullscreen with whole-window fade, monitor resizes without reloading or reconnecting
            - **Retry** — the error page truly restarts the session (with proper cleanup of the failed attempt); Back/Close returns to Welcome

            ### Installation Instructions
            - **macOS (Apple Silicon)**: Download the `.dmg` file and drag PNDS to the Applications folder
            - V1 builds are ad-hoc signed (no Apple notarization). On first launch macOS will block the app: right-click PNDS → **Open**, or **System Settings → Privacy & Security → Open Anyway**.

            ### Auto-Updates
            Existing users will receive automatic update notifications.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name || inputs.version }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: '--bundles app,dmg'
