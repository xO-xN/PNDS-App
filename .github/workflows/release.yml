name: 'Release PNDS'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-tauri:
    permissions:
      contents: write
    # macOS dual-lane (see docs/developer/app-behavior.md 平台与交付范围):
    # the arm64 mainline plus an x86_64 lane for Intel Macs, cross-compiled
    # on this arm64 runner. Both lanes bundle the same Node 24 sidecar
    # series and share the base config's min macOS 13.5 floor (v1.4.3,
    # #116); the x86_64 config swaps only the scsynth slice. Both lanes
    # build sequentially in this one job:
    # the second tauri-action step finds the draft release the first created
    # (lookup by tag) and merges its platform entry into the existing
    # latest.json — tauri-action re-reads that asset and keeps the other
    # platforms' entries, so arm64 updates never regress.
    runs-on: macos-latest
    env:
      # One derivation of the tag both lanes' tagName/releaseName share —
      # a lane mismatch there would create two releases instead of one
      # merged draft. (RELEASE_BODY below repeats the expression inline;
      # job-level env values cannot reference each other.)
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      # Shared by both lanes' tauri-action steps; whichever lane creates the
      # draft release writes it (the other finds the existing draft by tag).
      # NOTE: the body's chars count against GitHub's 21000-char max
      # expression length (the embedded ${{ }} makes the block one
      # expression) — keep at most the last two versions' notes in it and
      # point older ones at the releases page (learned shipping v1.5.0).
      RELEASE_BODY: |
        ## PNDS ${{ inputs.version || github.ref_name }}

        **One baseline for every Mac — Apple Silicon and Intel alike, macOS 13.5+**
        - This release ships two installers — the `_aarch64.dmg` for Apple Silicon Macs (M-series) and the `_x64.dmg` for Intel Macs — both requiring macOS 13.5 (Ventura) or newer. Pick the one that matches your Mac; the auto-updater already picks its lane on its own.

        ### What's New in V1.5.2 — performance stability and preparation fixes

        **Loading and window recovery**
        - Returning from another desktop no longer replays an expired loading animation. The App still waits for the current performance and monitor page to be ready before revealing the score.
        - Main and projection windows share guarded state recovery: late responses cannot rewind a newer restore or live update. A failed projection restore shows standby instead of leaving a hidden window.
        - Cover-title fitting now has one lifecycle for measurement, reveal and cleanup, preserving the existing layout while discarding obsolete work after navigation.

        **Project selection and pending settings**
        - Rapidly selecting projects, including A → B → A, keeps the latest selection's audio mode and OSC configuration. Late preflight results cannot replace it, and Load waits until its configuration is prepared.
        - Cancelling the HTTPS compatibility confirmation preserves pending settings and the Change action. Runtime state refreshes keep pending audio changes until a confirmed restart begins.
        - Preference saves report actual failures while allowing later saves to proceed; theme and language still apply immediately.

        **HTTPS and performance DNS preparation**
        - Saving a domain revalidates the certificate summary in the open Settings panel. Unsaved or failed settings no longer display a misleading certificate-ready status.
        - Certificate import and clear operations are mutually exclusive from the first file picker through validation. Cancellation and errors release the controls, preserve known certificate facts, and support retry; reopening Settings waits for dispatched writes to finish.
        - A failed DNS mapping verification immediately attempts revocation. Failed cleanup remains owned for later Stop/teardown retries, and retired mappings cannot be installed again by late requests. Mapping faults keep the performance running.

        **Development workflow**
        - Editing documentation or standalone prototypes no longer reloads the App's development monitor; App source files retain normal hot updates.

        ### What's New in V1.5.1 — the trusted stage: HTTPS entry, performance DNS, a fourth built-in tool

        **A trusted HTTPS entry for the phones**
        - Settings gains a certificate section for the host: configure the site's certificate and key, and a validation pipeline checks them into protected storage with readiness checks that run before the gateway ever starts — a misconfigured entry fails loudly at the desk, never as a certificate warning on a phone mid-show.
        - Scanning the QR code now lands performers on the entry over trusted HTTPS — the join page and the conductor's real-time controls ride the same secure path, so strict browsers and venue networks no longer break the handshake with certificate warnings.
        - The gateway recovers on its own terms: a certificate handover means ownership (a takeover never fights a stale holder), restarts are explicit, and every work switch is generation-isolated — loading another project cannot break the entry that is currently serving phones.

        **Performance DNS — names, not bare addresses**
        - An optional background DNS service (dnsd) maps the performance's domain names on the LAN: register it once from Settings (wired through macOS's SMAppService), and each session's mappings live and die with the work that declared them, while ordinary queries simply forward upstream.
        - Hardened on real hardware: negative answers now carry a short SOA, fake-ip upstream answers are rejected, and a status-write race is closed.

        **A frozen performer URL contract**
        - Works may declare their own full performer URL — `supportsPerformerUrl`, a tolerant boolean, plus the `PNDS_PERFORMER_URL` environment variable — and the App's QR/entry URL contract is now frozen end to end.

        **The Utilities shelf grows to four**
        - Mobile Sensor Meter joins the built-in utilities (v0.3.1) — the phone-as-sensor instrument, its motion, camera and microphone pages riding the App's trusted entry. Local Network Diagnostics and Telematic Network Diagnostics move to v0.6.1, Multichannel Signal Generator to v1.2.1.

        **The LAN address now behaves**
        - The Node section's LAN address selector auto-picks the machine's first address when nothing is chosen and remembers your choice across launches; an address the current interfaces no longer list is replaced at the next refresh — a session never starts bound to a dead interface — and a Load button gated only by a missing address now says so right under the button instead of sitting gray and mute.

        ### Earlier releases
        The V1.5.0–V1.1 notes live on the [releases page](https://github.com/xO-xN/PNDS-App/releases).

        ### Auto-Updates
        Existing users receive update notices (the starting page's one-line notice and the manual check's toast); since V1.4.3 the App itself no longer installs updates — grab the dmg from the Releases page it points you to.

        **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Pins the CI's own Node (frontend build) to the sidecar series the
      # App bundles (scripts/fetch-node.sh); lts/* drifts to newer majors
      # over time. The sidecars themselves are fetched per lane below.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # The x86_64 lane cross-compiles on this arm64 runner.
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # src-tauri/binaries, Frameworks, plugins, and resources/synthdefs are
      # gitignored (~100MB Node runtime + SuperCollider extraction); these
      # scripts provision them fresh on every release build. The built-in
      # utility tools (unpacked under resources/utilities) are fetched,
      # checksum-verified, and unpacked automatically by the build's
      # beforeBuildCommand (npm run utilities:fetch).
      - name: Fetch Node sidecars (both lanes)
        run: |
          npm run node:fetch
          PNDS_TARGET=x86_64-apple-darwin npm run node:fetch

      # One run writes both scsynth slices (the dmg is universal); each lane
      # bundles its own slice via its tauri config.
      - name: Fetch scsynth binary and compile master synthdef
        run: npm run scsynth:fetch

      # #174's dnsd is an externalBin sidecar like node, but nothing else
      # provisions it — build both darwin slices from the workspace (the
      # x86_64 target comes with the toolchain step above) or tauri-build
      # dies on `resource path binaries/pnds-dnsd-<triple> doesn't exist`
      # (the first v1.5.1 release attempt failed exactly there; v1.5.0
      # predated the sidecar, so CI never needed this step before).
      - name: Build dnsd sidecars (both lanes)
        run: npm run dnsd:build:all

      # Lane 1 — arm64 mainline: native build, base tauri.conf.json (Node 24
      # sidecar, scsynth aarch64 slice, min macOS 13.5). Creates the draft
      # release; uploadUpdaterJson writes latest.json with the darwin-aarch64
      # entries.
      - name: Build and release (arm64)
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'PNDS ${{ env.RELEASE_TAG }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: '--bundles app,dmg'

      # Lane 2 — Intel: cross-compiled with --target, tauri.x86_64.conf.json
      # swaps only the scsynth slice for x86_64 — Node sidecar, license and
      # the 13.5 floor all come from the base config (v1.4.3, #117).
      # Finds the draft release from lane 1 by tag, adds its dmg/.app.tar.gz
      # assets, and uploadUpdaterJson merges the darwin-x86_64 entries into
      # the existing latest.json (arm64 entries are preserved).
      - name: Build and release (x86_64)
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'PNDS ${{ env.RELEASE_TAG }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: '--target x86_64-apple-darwin --config src-tauri/tauri.x86_64.conf.json --bundles app,dmg'
