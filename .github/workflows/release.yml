name: 'Release PNDS'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (e.g., v1.7.0-beta.1, v1.7.0-rc.1, v1.7.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    # macOS dual-lane (see docs/developer/app-behavior.md 平台与交付范围):
    # the arm64 mainline plus an x86_64 lane for Intel Macs, cross-compiled
    # on this arm64 runner. Both lanes bundle the same Node 24 sidecar
    # series and share the base config's min macOS 13.5 floor (v1.4.3,
    # #116); the x86_64 config swaps only the scsynth slice. Both lanes
    # build sequentially in this one job:
    # the second tauri-action step finds the draft release the first created
    # (lookup by tag) and merges its platform entry into the existing
    # latest.json — tauri-action re-reads that asset and keeps the other
    # platforms' entries, so arm64 updates never regress.
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      # Override rust-toolchain.toml's floating stable selection for every command.
      RUSTUP_TOOLCHAIN: '1.97.0'
      # Treat dispatch input as data; checkout resolves only the exact tag.
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      # Public OAuth metadata compiled into both macOS build lanes.
      PNDS_GITHUB_CLIENT_ID: ${{ vars.PNDS_GITHUB_CLIENT_ID }}
      PNDS_GITHUB_APP_SLUG: ${{ vars.PNDS_GITHUB_APP_SLUG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify tagged source
        run: |
          head_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$head_commit" = "$tag_commit"

      # Pins the CI's own Node (frontend build) to the sidecar series the
      # App bundles (scripts/fetch-node.sh); lts/* drifts to newer majors
      # over time. The sidecars themselves are fetched per lane below.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Validate release metadata
        id: metadata
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"

      - name: Read version release notes
        id: notes
        env:
          NOTES_PATH: ${{ steps.metadata.outputs.notes_path }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { randomUUID } from 'node:crypto'
          const body = readFileSync(process.env.NOTES_PATH, 'utf8')
          const delimiter = randomUUID()
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${body}\n${delimiter}\n`)
          NODE

      # tauri-action reuses a draft without refreshing its metadata. A retry
      # may continue only when that draft already describes this exact release.
      - name: Validate existing release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          NOTES_PATH: ${{ steps.metadata.outputs.notes_path }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
            jq --slurp --exit-status --arg tag "$RELEASE_TAG" \
              --argjson prerelease "$RELEASE_PRERELEASE" --rawfile notes "$NOTES_PATH" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 0 then true
              elif length != 1 then error("Multiple releases use the requested tag; refusing to rebuild.")
              else .[0] |
                if .draft != true then error("An already published release cannot be rebuilt or changed to a draft.")
                elif .name != ("PNDS " + $tag) then error("Existing draft name differs from this release; refusing to reuse it.")
                elif .prerelease != $prerelease then error("Existing draft prerelease flag differs from this release; refusing to reuse it.")
                elif ((.body // "") | sub("[\r\n]+$"; "")) != ($notes | sub("[\r\n]+$"; "")) then
                  error("Existing draft notes differ from the tagged notes file; refusing to reuse it.")
                else true end
              end'

      # tauri-build 2.6.2 assumes the pre-1.100 Cargo OUT_DIR layout.
      # Keep the locally verified toolchain until the build helper is upgraded.
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          # The x86_64 lane cross-compiles on this arm64 runner.
          targets: x86_64-apple-darwin

      - name: Verify release Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version | grep -E '^rustc 1[.]97[.]0 '
          cargo --version | grep -E '^cargo 1[.]97[.]0 '
          cargo fmt --version
          cargo clippy --version
          rustup target list --installed | grep -Fx x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # src-tauri/binaries, Frameworks, plugins, and resources/synthdefs are
      # gitignored (~100MB Node runtime + SuperCollider extraction); these
      # scripts provision them fresh on every release build. The built-in
      # utility tools (unpacked under resources/utilities) are fetched,
      # checksum-verified, and unpacked automatically by the build's
      # beforeBuildCommand (npm run utilities:fetch).
      - name: Fetch Node sidecars (both lanes)
        run: |
          npm run node:fetch
          PNDS_TARGET=x86_64-apple-darwin npm run node:fetch

      # One run writes both scsynth slices (the dmg is universal); each lane
      # bundles its own slice via its tauri config.
      - name: Fetch scsynth binary and compile master synthdef
        run: npm run scsynth:fetch

      # #174's dnsd is an externalBin sidecar like node, but nothing else
      # provisions it — build both darwin slices from the workspace (the
      # x86_64 target comes with the toolchain step above) or tauri-build
      # dies on `resource path binaries/pnds-dnsd-<triple> doesn't exist`
      # (the first v1.5.1 release attempt failed exactly there; v1.5.0
      # predated the sidecar, so CI never needed this step before).
      - name: Build dnsd sidecars (both lanes)
        run: npm run dnsd:build:all

      # The CLI shares the App crate's static service. Stage frontend/resources
      # before compiling that library, then ship the exact target through each
      # lane's macOS.files mapping without an externalBin bootstrap cycle.
      - name: Build static CLI (both lanes)
        run: |
          npm run build
          npm run libraries:fetch
          npm run utilities:fetch
          npm run cli:build:all

      - name: Run all quality checks
        run: npm run check:all

      - name: Verify checks preserved the tagged source
        run: |
          node scripts/release-metadata.mjs "$RELEASE_TAG"
          git diff --exit-code HEAD

      # Lane 1 — arm64 mainline: native build, base tauri.conf.json (Node 24
      # sidecar, scsynth aarch64 slice, min macOS 13.5). Creates the draft
      # release; uploadUpdaterJson writes latest.json with the darwin-aarch64
      # entries.
      - name: Build and release (arm64)
        id: arm64
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.metadata.outputs.tag }}
          releaseName: 'PNDS ${{ steps.metadata.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ fromJSON(steps.metadata.outputs.prerelease) }}
          uploadUpdaterJson: true
          args: '--bundles app,dmg'

      # Lane 2 — Intel: cross-compiled with --target, tauri.x86_64.conf.json
      # swaps only the scsynth slice for x86_64 — Node sidecar, license and
      # the 13.5 floor all come from the base config (v1.4.3, #117).
      # Finds the draft release from lane 1 by tag, adds its dmg/.app.tar.gz
      # assets, and uploadUpdaterJson merges the darwin-x86_64 entries into
      # the existing latest.json (arm64 entries are preserved).
      - name: Build and release (x86_64)
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.metadata.outputs.tag }}
          releaseName: 'PNDS ${{ steps.metadata.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ fromJSON(steps.metadata.outputs.prerelease) }}
          uploadUpdaterJson: true
          args: '--target x86_64-apple-darwin --config src-tauri/tauri.x86_64.conf.json --bundles app,dmg'

      # tauri-action has no make_latest input. This edits only a draft and does
      # not publish it; prerelease drafts must never select the stable endpoint.
      - name: Keep prerelease draft out of Latest
        if: steps.metadata.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.arm64.outputs.releaseId }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')" = true
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F prerelease=true -f make_latest=false --silent
