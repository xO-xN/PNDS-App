<!doctype html>
<!-- THROWAWAY UI PROTOTYPE. Folder dot/bar selector inside the PNDS performance shell.
     A: align the role row to project title text; B: enlarge the row to 16px and align card edges.
     C preserves the App baseline; E enlarges identity and groups folder name with a manual dot/bar selector.
     A/B/D remain historical URLs. No production App changes in this revision.
     ?variant=C|E&lang=zh-CN|en&scene=launch|host-name|host-idle|host-live|client-idle|client-wait|client-live|client-lost
     Real PNDS theme tokens; synthetic data. Only the last explicitly selected role uses a dedicated prototype localStorage key. No network, media, Tauri or App preference access.
     2026-11-03 revision: first launch defaults to Host; subsequent launches remember the selected role, with idle runtime. Exclusive roles, URL + recent,
     generic performer content embedded in PNDS. 2026-11-03 revision: compact text dropdown, explicit role selection while idle; active performance locks the other role.
     Strings sources: locales/prototype-performance-roles.zh-CN.json and .en.json; embedded below for file:// use. -->

        height: 6px;

          if (state.currentProjectName === 'runes-pnds')
            return `<section class="client-score"><header class="score-header"><h1>runes-pnds</h1><span class="pill">${t(state.status === 'offline' ? 'disconnected' : state.status === 'unknown' ? 'openedUnknown' : 'joined')}</span></header><div class="score-panel authored-score"><p>listen</p><div aria-hidden="true" class="score-staff"></div><p>hold one note through a slow breath</p></div></section>`
          return `<section class="client-score">${state.status === 'offline' ? `<div class="banner">${t('disconnected')} · ${t('disconnectHelp')}</div>` : state.status === 'unknown' ? `<div class="banner">${t('unknownHelp')}</div>` : ''}<header class="score-header"><div><h1>${esc(state.currentProjectName)}</h1><p class="caption" style="margin-block-start:7px">${t('scoreSubtitle')}</p></div>${state.status === 'unknown' ? '' : `<span class="pill">${t('seat')} 03</span>`}</header><div class="score-panel"><div class="row between"><h2>${t('handpose')}</h2><span class="pill">${t(state.camera ? 'cameraOn' : 'cameraOff')}</span></div><div class="sensor-grid"><div class="hand-stage ${state.camera ? 'active' : ''}">${hand()}<span class="caption">${t(state.camera ? 'sampleReady' : 'privacyHint')}</span></div><div class="stack"><div class="row between"><span class="caption">${t('sampleState')}</span><strong>${t(state.camera ? 'sampleReady' : 'sampleNone')}</strong></div><div class="line"></div><p class="caption">${t('clientDesc')}</p>${button('camera', icon('camera') + ' ' + t(state.camera ? 'cameraStop' : 'cameraEnable'), 'quiet', state.status === 'offline' ? 'disabled' : '')}</div></div></div><div class="sensor-rest"><div>${t('mic')}<span class="caption">${t('notEnabled')}</span></div><div>${t('motion')}<span class="caption">${t('notEnabled')}</span></div></div></section>`
        }
        return welcome()
      }
      function footer() {
        const active = state.role
        return `${active ? button(active === 'host' ? (live() ? 'stop' : 'load') : 'leave', icon(active === 'client' || live() ? 'stop' : 'play') + ' ' + t(active === 'host' ? (live() ? 'stop' : 'load') : 'leave'), 'primary transport row', !active || (active === 'client' && !live()) || (active === 'host' && !state.hostNodeName) ? 'disabled' : '') : ''}${active ? button('refresh', icon('refresh'), 'bar-button refresh-control', `${(active === 'client' ? !canRefresh() : !live()) ? 'disabled ' : ''}aria-label="${t('refresh')}"`) : ''}${active === 'host' ? `${button('settings', icon('audio') + t('audio'), 'bar-button')}${button('network', icon('network') + t('network'), 'bar-button')}` : ''}<span class="role-caption">${active ? roleLabel(active) : t('chooseHeading')}</span><span class="bar-spacer"></span>${button('settings', icon('settings'), 'bar-button', `aria-label="${t('settings')}"`)}${button('creation', t('creation'), 'mode-button')}`
      }
      function canRefresh() {
        return (
          state.role === 'client' &&
          ['online', 'unknown', 'offline'].includes(state.status)
        )
      }
      function updateRefreshButton() {
        const control = document.querySelector('.refresh-control')
        if (!control || state.role !== 'client') return
        const armed = state.refreshPhase === 'armed'
        control.classList.toggle('refresh-armed', armed)
        control.disabled = !canRefresh()
        control.innerHTML =
          icon('refresh') +
          (armed
            ? `<span class="refresh-label">${t('refreshAgain')}</span>`
            : '')
        control.setAttribute(
          'aria-label',
          armed ? `${t('refreshAgain')}. ${t('refreshHelp')}` : t('refresh')
        )
        control.setAttribute('aria-pressed', String(armed))
        control.title = t('refreshHelp')
      }
      function cancelRefresh() {
        if (state.refreshPhase !== 'armed') return
        state.refreshPhase = 'idle'
        updateRefreshButton()
        updateReviewState()
      }
      function refreshClient() {
        if (!canRefresh()) return
        if (state.refreshPhase !== 'armed') {
          state.refreshPhase = 'armed'
          updateRefreshButton()
          updateReviewState()
          return
        }
        const previous = state.status
        clearTimers()
        state.refreshPhase = 'loading'
        state.camera = false
        state.status = 'opening'
        render()
        phaseTimer = setTimeout(() => {
          if (state.refreshOutcome === 'changed' || previous === 'offline') {
            state.status =
              state.refreshOutcome === 'changed' ? 'changed' : 'unreachable'
            state.refreshPhase = 'idle'
            render()
            return
          }
          state.status = 'pending'
          render()
          phaseTimer = setTimeout(() => {
            state.status = previous
            state.refreshPhase = 'idle'
            render()
          }, 600)
        }, 500)
      }
      function render() {
        const roleFocus = state.roleMenuOpen
          ? document.activeElement
              .closest('.role-navigation')
              ?.contains(document.activeElement)
            ? document.activeElement.dataset.action
            : null
          : null
        T = catalogs[state.language]
        document.documentElement.lang = state.language
        document.documentElement.dataset.colorTheme = state.theme
        document.documentElement.dataset.variant = state.variant
        const revised = ['C', 'D', 'E'].includes(state.variant)
        document.documentElement.dataset.layout = revised
          ? 'revised'
          : 'baseline'
        document.documentElement.dataset.role = state.role || 'entry'
        document.title = t('title')
        document
          .getElementById('sidebar')
          .setAttribute('aria-label', t('sidebarLabel'))
        document
          .querySelector('.review-bar')
          .setAttribute('aria-label', t('reviewControls'))
        const header = document.getElementById('sidebar-header')
        header.hidden = !revised
        header.innerHTML = revised ? roleNavigation() : ''
        document.getElementById('sidebar-content').innerHTML =
          (revised ? '' : roleNavigation()) +
          (state.role
            ? state.role === 'host'
              ? hostSidebar()
              : clientSidebar()
            : '')
        const browser = document.getElementById('sidebar-browser')
        browser.hidden = state.role !== 'host' || !state.hostNodeName
        browser.innerHTML = browser.hidden
          ? ''
          : state.variant === 'E'
            ? folderStepper()
            : sidebarBrowser()
        document.getElementById('sidebar-foot').hidden = revised
        document.getElementById('sidebar-foot').textContent =
          state.role === 'host'
            ? live()
              ? t('hostRunning')
              : t(state.toolsView ? 'utilityCount' : 'projectCount').replace(
                  '{count}',
                  visibleProjects().length
                )
            : state.role === 'client'
              ? t(live() ? 'connection' : 'notConnected')
              : t('role')
        document.getElementById('workspace').innerHTML = workspace()
        document.getElementById('bottom-bar').innerHTML = footer()
        renderReview()
        updateRoleMenu()
        updateRefreshButton()
        fitReviewBar()
        updatePeek()
        syncUrl()
        if (roleFocus)
          document
            .querySelector(`.role-navigation [data-action="${roleFocus}"]`)
            ?.focus({ preventScroll: true })
      }
      function renderReview() {
        const scenes = [
          ['launch', 'sceneLaunch'],
          ['host-name', 'sceneHostName'],
          ['host-idle', 'sceneHostIdle'],
          ['host-live', 'sceneHostLive'],
          ['host-auto-ports', 'sceneHostPorts'],
          ['host-port-conflict', 'sceneHostConflict'],
          ['client-idle', 'sceneClientIdle'],
          ['client-opening', 'sceneClientOpening'],
          ['client-wait', 'sceneClientWait'],
          ['client-live', 'sceneClientLive'],
          ['client-lost', 'sceneClientLost'],
          ['client-unknown', 'sceneClientUnknown'],
          ['client-changed', 'sceneClientChanged'],
          ['client-ended', 'sceneClientEnded'],
          ['client-host-changed', 'sceneHostChanged'],
          ['client-incompatible', 'sceneIncompatible'],
          ['client-project-incompatible', 'sceneProjectIncompatible'],
          ['client-refresh-changed', 'sceneClientRefreshChanged'],
          ['client-unreachable', 'sceneClientUnreachable'],
        ]
        const current = state.launchMode ? 'launch' : currentScene()
        document.getElementById('review-controls').innerHTML =
          `<span class="caption" style="color:inherit">1.7.0-beta.2 ${t('review')}</span><div class="variant-switcher">${button('variant-prev', icon('back'), '', `aria-label="${t('previousVariant')}"`)}<span class="variant-name">${t('variant' + state.variant)}</span>${button('variant-next', icon('next'), '', `aria-label="${t('nextVariant')}"`)}</div><label>${t('sceneLabel')}<select id="scene-select">${scenes.map(([value, key]) => `<option value="${value}" ${value === current ? 'selected' : ''}>${t(key)}</option>`).join('')}</select></label><label>${t('themeLabel')}<select id="theme-select">${['pond', 'sand', 'stage', 'brutal'].map(theme => `<option value="${theme}" ${theme === state.theme ? 'selected' : ''}>${theme[0].toUpperCase() + theme.slice(1)}</option>`).join('')}</select></label><label>${t('languageLabel')}<select id="language-select"><option value="zh-CN" ${state.language === 'zh-CN' ? 'selected' : ''}>简体中文</option><option value="en" ${state.language === 'en' ? 'selected' : ''}>English</option></select></label><label><input type="checkbox" id="pin-sidebar" ${state.pin ? 'checked' : ''}>${t('pin')}</label>${button('restart', t('restart'))}${button('first-launch', t('firstLaunch'))}`
        document.getElementById('review-description').textContent =
          t('variantHelp' + state.variant) + ' ' + t('prototypeHelp')
        updateReviewState()
      }
      function updateReviewState() {
        document.getElementById('review-state').textContent =
          `${t('memoryState')}: ${!state.roleMemoryAvailable ? t('memoryUnavailable') : state.rememberedRole ? roleLabel(state.rememberedRole) : t('memoryDefault')} / ${t('layoutState')}: ${state.variant} / ${t('roleState')}: ${state.role ? roleLabel(state.role) : t('unselected')} / ${t('runtimeState')}: ${t(state.status)} / ${t('cameraState')}: ${t(state.camera ? 'cameraOn' : 'cameraOff')} / ${t('reviewStateSwitch')}: ${t(state.roleMenuOpen ? 'roleMenuOpen' : 'roleMenuClosed')} / ${t('reviewRefresh')}: ${t({ idle: 'refreshIdle', armed: 'refreshArmed', loading: 'refreshLoadingState' }[state.refreshPhase])}${state.variant === 'E' && state.role === 'host' && state.hostNodeName ? ` / ${t('folderState')}: ${t(folderOptions.find(folder => folder.id === selectedFolder()).label)}` : ''}`
        fitReviewBar()
      }
      function fitReviewBar() {
        const height = document.querySelector('.review-bar').offsetHeight
        document.documentElement.style.setProperty(
          '--review-space',
          `${height + 36}px`
        )
      }
      window.addEventListener('resize', fitReviewBar)
      function updatePeek() {
        const sidebar = document.getElementById('sidebar')
        const hidden =
          live() &&
          !state.pin &&
          !state.peek &&
          !state.roleMenuOpen &&
          !sidebar.contains(document.activeElement)
        sidebar.classList.toggle('sidebar-hidden', hidden)
        sidebar.inert = hidden
      }
      function notice(key) {
        clearTimeout(toastTimer)
        const toast = document.getElementById('toast')
        toast.textContent = t(key)
        toast.hidden = false
        toastTimer = setTimeout(() => (toast.hidden = true), 4000)
      }
      function chooseRole(role) {
        if (!['host', 'client'].includes(role) || live()) return
        clearTimers()
        state.refreshPhase = 'idle'
        state.role = role
        rememberRole(role)
        state.launchMode = true
        state.preview = null
        state.roleMenuOpen = false
        state.status = 'idle'
        state.camera = false
        render()
      }
      function join(allowDifferentHost = false) {
        const input = document.getElementById('address')
        let value = input ? input.value : state.url
        try {
          const parsed = new URL(value)
          if (
            !['http:', 'https:'].includes(parsed.protocol) ||
            parsed.username ||
            parsed.password
          )
            throw new Error()
          value = parsed.href
        } catch {
          if (input) {
            input.setCustomValidity(t('invalidAddress'))
            input.reportValidity()
          }
          return
        }
        state.refreshPhase = 'idle'
        state.refreshOutcome = 'same'
        state.url = value
        const known = observedHosts.get(value)
        const actualId = known ? known.id : 'demo-' + value
        const actualName = known ? known.name : 'Demo-Host'
        if (
          state.expectedHostId &&
          state.expectedHostId !== actualId &&
          !allowDifferentHost
        ) {
          clearTimers()
          state.pendingHostId = actualId
          state.pendingHostName = actualName
          state.status = 'identity-changed'
          state.camera = false
          render()
          return
        }
        state.currentHostName = actualName
        state.currentHostId = actualId
        state.expectedHostId = actualId
        state.camera = false
        state.status = 'opening'
        clearTimers()
        render()
        phaseTimer = setTimeout(() => {
          state.status = 'pending'
          render()
          phaseTimer = setTimeout(() => {
            state.status = 'online'
            const previous = state.recent.find(
              item => item.id === state.currentHostId
            )
            if (previous) {
              previous.name = state.currentHostName
              previous.url = value
            } else
              state.recent.unshift({
                id: state.currentHostId,
                name: state.currentHostName,
                url: value,
              })
            render()
          }, 800)
        }, 500)
      }
      document.addEventListener('submit', event => {
        if (event.target.id === 'host-node-form') {
          event.preventDefault()
          const input = document.getElementById('host-node-input')
          const name = input.value.trim()
          if (!name) {
            input.setCustomValidity(t('nodeNameRequired'))
            input.reportValidity()
            return
          }
          state.hostNodeName = name
          state.nodeNameDraft = name
          render()
          return
        }

        if (event.target.id === 'join-form') {
          event.preventDefault()
          join()
        }
      })
      document.addEventListener('input', event => {
        if (event.target.id === 'address') {
          event.target.setCustomValidity('')
          state.url = event.target.value
        }
        if (event.target.id === 'host-node-input') {
          event.target.setCustomValidity('')
          state.nodeNameDraft = event.target.value
        }
      })
      document.addEventListener('click', event => {
        if (!event.target.closest('.role-navigation')) closeRoleMenu()
        if (!event.target.closest('.refresh-control')) cancelRefresh()
        const target = event.target.closest('[data-action]')
        if (!target || target.disabled) return
        const [action, arg] = target.dataset.action.split(':')
        switch (action) {
          case 'variant-prev':
            cycleVariant(-1)
            break
          case 'variant-next':
            cycleVariant(1)
            break
          case 'folder':
            selectFolder(arg)
            break
          case 'back-folder':
            state.toolsView = false
            render()
            document
              .querySelector('[data-action="utilities"]')
              ?.focus({ preventScroll: true })
            break
          case 'role':
            chooseRole(arg)
            break
          case 'roleswitch':
            if (state.roleMenuOpen) closeRoleMenu(true)
            else openRoleMenu()
            break
          case 'role-select':
            selectMenuRole(arg)
            break
          case 'project':
            if (
              state.status === 'port-conflict' &&
              Number(arg) !== state.project
            ) {
              state.status = 'idle'
              state.hostLegacyConflict = false
            }
            state.project = Number(arg)
            render()
            break
          case 'load':
            if (!state.hostNodeName) return
            if (state.hostLegacyConflict) {
              state.status = 'port-conflict'
              render()
              notice('hostConflictStill')
              break
            }
            state.runningProject = state.project
            state.status = 'running'
            render()
            break
          case 'stop':
            clearTimers()
            state.status = 'idle'
            render()
            break
          case 'leave':
            clearTimers()
            state.refreshPhase = 'idle'
            state.refreshOutcome = 'same'
            state.status = 'idle'
            state.camera = false
            state.expectedHostId = null
            render()
            break
          case 'join-new':
            state.currentProjectName = state.nextProjectName
            join()
            break
          case 'join-again':
            join()
            break
          case 'join-other-host':
            join(true)
            break
          case 'camera':
            state.camera = !state.camera
            render()
            break
          case 'reconnect':
            join()
            break
          case 'recent':
            state.url = state.recent[Number(arg)].url
            state.expectedHostId = state.recent[Number(arg)].id
            state.expectedHostName = state.recent[Number(arg)].name
            render()
            document.getElementById('address').focus()
            break
          case 'forget':
            state.recent.splice(Number(arg), 1)
            render()
            break
          case 'copy':
            notice('copied')
            document.getElementById('toast').textContent += ' ' + hostAddress()
            break
          case 'refresh':
            if (state.role === 'client') refreshClient()
            else render()
            break
          case 'restart':
            launchApp()
            render()
            break
          case 'first-launch':
            try {
              localStorage.removeItem(roleMemoryKey)
              launchApp()
            } catch {
              state.roleMemoryAvailable = false
            }
            render()
            break
          case 'creation':
            notice('creationHint')
            break
          case 'import':
            notice('importHint')
            break
          case 'utilities':
            state.toolsView = !state.toolsView
            render()
            document
              .querySelector('[data-action="utilities"]')
              ?.focus({ preventScroll: true })
            break
          case 'port-details':
            state.networkDetails = !state.networkDetails
            render()
            if (event.detail === 0)
              document
                .querySelector('[data-action="port-details"]')
                .focus({ preventScroll: true })
            break
          case 'network':
            if (state.role === 'host' && state.status === 'running') {
              state.networkDetails = !state.networkDetails
              state.peek = true
              render()
            } else notice('settingsHint')
            break
          case 'check-project':
            notice('projectStillIncompatible')
            break
          case 'retry-connection':
            notice('unreachableHelp')
            break
          case 'select-another':
            state.status = 'idle'
            render()
            break
          case 'settings':
            notice('settingsHint')
            break
        }
      })
      document.addEventListener('change', event => {
        if (event.target.id === 'folder-select') {
          state.folder = event.target.value
          state.toolsView = false
          render()
          document
            .getElementById('folder-select')
            ?.focus({ preventScroll: true })
        }
        if (event.target.id === 'scene-select') {
          applyScene(event.target.value)
          const p = new URLSearchParams(location.search)
          p.set('scene', event.target.value)
          try {
            history.replaceState(null, '', location.pathname + '?' + p)
          } catch {}
          render()
          document.getElementById('sidebar-content').scrollTop = 0
        }
        if (event.target.id === 'language-select') {
          state.language = event.target.value
          render()
        }
        if (event.target.id === 'theme-select') {
          state.theme = event.target.value
          render()
        }
        if (event.target.id === 'pin-sidebar') {
          state.pin = event.target.checked
          updatePeek()
        }
      })
      document.addEventListener('pointerdown', event => {
        if (!event.target.closest('.role-navigation')) closeRoleMenu()
        if (!event.target.closest('.refresh-control')) cancelRefresh()
      })
      document.addEventListener('focusin', event => {
        if (!event.target.closest('.role-navigation')) closeRoleMenu()
        updatePeek()
      })
      document.getElementById('edge').addEventListener('mouseenter', () => {
        state.peek = true
        clearTimeout(hideTimer)
        updatePeek()
      })
      document.getElementById('sidebar').addEventListener('mouseenter', () => {
        state.peek = true
        clearTimeout(hideTimer)
        updatePeek()
      })
      document.getElementById('sidebar').addEventListener('mouseleave', () => {
        hideTimer = setTimeout(() => {
          state.peek = false
          updatePeek()
        }, 200)
      })
      document.addEventListener('keydown', event => {
        if (event.target.closest('.folder-stepper')) {
          if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
            event.preventDefault()
            event.stopPropagation()
            const tabs = [...document.querySelectorAll('.folder-step')]
            const index = tabs.indexOf(document.activeElement)
            const forward =
              getComputedStyle(event.target).direction === 'rtl' ? -1 : 1
            const next =
              event.key === 'Home'
                ? 0
                : event.key === 'End'
                  ? tabs.length - 1
                  : (index +
                      (event.key === 'ArrowRight' ? forward : -forward) +
                      tabs.length) %
                    tabs.length
            tabs.forEach((tab, i) => {
              tab.tabIndex = i === next ? 0 : -1
            })
            tabs[next].focus({ preventScroll: true })
          }
          return
        }
        if (
          ['ArrowLeft', 'ArrowRight'].includes(event.key) &&
          !event.target.closest(
            'input, textarea, select, [contenteditable="true"], [role="menu"]'
          )
        ) {
          event.preventDefault()
          cycleVariant(event.key === 'ArrowRight' ? 1 : -1)
          return
        }
        if (event.target.closest('.role-navigation')) {
          if (event.key === 'Escape') {
            event.preventDefault()
            closeRoleMenu(true)
            return
          }
          if (event.key === 'Tab') closeRoleMenu(true)
          if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) {
            event.preventDefault()
            if (!state.roleMenuOpen)
              openRoleMenu(event.key === 'ArrowUp' || event.key === 'End')
            else {
              const items = [...document.querySelectorAll('.role-menu-item')]
              const index = items.indexOf(document.activeElement)
              const next =
                event.key === 'Home'
                  ? 0
                  : event.key === 'End'
                    ? items.length - 1
                    : (index +
                        (event.key === 'ArrowDown' ? 1 : -1) +
                        items.length) %
                      items.length
              items[next].focus({ preventScroll: true })
            }
            return
          }
        }
        if (event.key === 'Meta') {
          state.peek = true
          updatePeek()
        }
        if (event.key === 'Escape') {
          closeRoleMenu(true)
          cancelRefresh()
        }
      })
      document.addEventListener('keyup', event => {
        if (event.key === 'Meta') {
          state.peek = false
          updatePeek()
        }
      })
      window.addEventListener('blur', () => {
        state.peek = false
        closeRoleMenu()
        cancelRefresh()
        updatePeek()
      })
      render()
    </script>
  </body>
</html>
