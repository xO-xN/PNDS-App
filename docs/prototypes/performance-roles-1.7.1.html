      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition: none !important;
          animation: none !important;
          scroll-behavior: auto !important;
        }
      }

      .role-switch {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: 100%;
        height: 40px;
        margin-block: 0 18px;
        border: 1px solid var(--pnds-performance-control-line);
        border-radius: 8px;
        background: var(--pnds-performance-raised);
        color: var(--pnds-desktop-glass-ink);
        --slant: 44px;
        padding: 0;
        font-weight: 600;
      }
      .role-switch:hover {
        background: var(--pnds-performance-raised) !important;
      }
      .role-switch::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--pnds-desktop-glass-action);
        clip-path: polygon(
          calc(100% + var(--slant)) 0,
          calc(100% + var(--slant) * 2) 0,
          calc(100% + var(--slant) * 2) 100%,
          100% 100%
        );
        transition: clip-path 300ms cubic-bezier(0.22, 0.8, 0.25, 1);
      }
      .role-switch[data-phase='idle']:not([data-hover-paused='true']):is(
          :hover,
          :focus-visible
        )::before {
        clip-path: polygon(
          calc(100% - 8px) 0,
          calc(100% + var(--slant) * 2) 0,
          calc(100% + var(--slant) * 2) 100%,
          calc(100% - 8px - var(--slant)) 100%
        );
      }
      .role-switch[data-phase='armed']::before {
        clip-path: polygon(
          calc(50% - 12px) 0,
          calc(100% + var(--slant) * 2) 0,
          calc(100% + var(--slant) * 2) 100%,
          calc(50% - 12px - var(--slant)) 100%
        );
      }
      .role-switch[data-phase='settling']::before {
        clip-path: polygon(
          0 0,
          calc(100% + var(--slant) * 2) 0,
          calc(100% + var(--slant) * 2) 100%,
          calc(0px - var(--slant)) 100%
        );
      }
      .role-switch span {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        padding-inline: 8px;
        font-size: 12px;
        transition:
          opacity 150ms,
          transform 200ms;
      }
      .role-next,
      .role-feedback {
        opacity: 0;
        transform: translateX(10px);
      }
      .role-switch[data-phase='idle']:not([data-hover-paused='true']):is(
          :hover,
          :focus-visible
        )
        .role-current {
        opacity: 0;
        transform: translateX(-10px);
      }
      .role-switch[data-phase='idle']:not([data-hover-paused='true']):is(
          :hover,
          :focus-visible
        )
        .role-next {
        opacity: 1;
        transform: translateX(-8px);
      }
      .role-switch:not([data-phase='idle']) .role-current,
      .role-switch:not([data-phase='idle']) .role-next {
        opacity: 0;
      }
      .role-switch:not([data-phase='idle']) .role-feedback {
        opacity: 1;
        transform: none;
      }
      .role-switch[data-phase='blocked'] {
        color: var(--pnds-danger);
      }
      .role-switch[data-phase='blocked'] .role-feedback {
        font-size: 11px;
      }
      .host-name-label {
        margin-block: 0 12px;
        overflow-wrap: anywhere;
      }
      [data-color-theme='brutal'] .role-switch {
        border-radius: 0;
      }

      .connection-notice {
        max-width: 500px;
        width: 100%;
        margin: auto;
      }
      .connection-notice h1 {
        margin-block: 20px 14px;
      }
      .connection-notice > p {
        color: var(--pnds-text-secondary);
        font-size: 13px;
      }
      .connection-notice .details {
        grid-template-columns: max-content minmax(0, 1fr);
      }
      .connection-notice dd {
        overflow-wrap: anywhere;
      }
      .notice-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-block-start: 24px;
      }
      .authored-score {
        padding-block: 60px;
        text-align: center;
      }
      .authored-score p {
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      .score-staff {
        height: 70px;
        margin: 35px 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 13px,
          var(--pnds-performance-line) 13px 14px
        );
      }

    <script>
      const catalogs = {
        'zh-CN': JSON.parse(
          document.getElementById('prototype-strings-zh-CN').textContent

        en: JSON.parse(

      }
      let T =
        catalogs[
          new URLSearchParams(location.search).get('lang') === 'en'

        ]
      const t = key => T[key] || key
      const esc = value =>
        String(value).replace(
          /[&<>"']/g,
          ch =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[ch]
        )
      const icons = {
        host: '<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/>',

        chevron: '<path d="m8 10 4 4 4-4"/>',
        back: '<path d="m14 6-6 6 6 6"/>',
        next: '<path d="m10 6 6 6-6 6"/>',
        play: '<path d="m8 5 11 7-11 7z"/>',
        stop: '<rect x="6" y="6" width="12" height="12" rx="1"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',

        refresh:

        audio:

          '<path d="M3 8a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0M9 16a4 4 0 0 1 6 0"/><circle cx="12" cy="20" r=".8"/>',
        settings:
          '<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',
        camera:
          '<rect x="2" y="6" width="15" height="13" rx="3"/><path d="m17 10 5-3v11l-5-3"/>',
        wait: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      }
      const icon = name =>
        `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${icons[name] || icons.music}</svg></span>`

        `<button type="button" data-action="${action}" class="${cls}" ${extra}>${label}</button>`
      const roleLabel = role => t(role)
      const projects = ['Mobile Sensor Meter', 'runes-pnds', 'Blank project']
      const urls = ['http://192.168.8.20:7340/', 'http://192.168.8.35:7340/']
      const observedHosts = new Map([
        [urls[0], { id: 'concert', name: 'Concert-MacBook' }],
        [urls[1], { id: 'stage', name: 'Stage-Mac-mini' }],
        [
          'http://192.168.8.42:7340/',
          { id: 'concert', name: 'Concert-MacBook' },
        ],
        [
          'http://192.168.8.20:7341/',
          { id: 'concert', name: 'Concert-MacBook' },
        ],
      ])
      const urlParams = new URLSearchParams(location.search)
      const state = {
        variant: 'A',
        language: urlParams.get('lang') === 'en' ? 'en' : 'zh-CN',
        theme: ['pond', 'sand', 'stage', 'brutal'].includes(
          urlParams.get('theme')

          ? urlParams.get('theme')
          : 'pond',

        preview: null,
        status: 'idle',

          { id: 'concert', name: 'Concert-MacBook', url: urls[0] },

        pin: true,
        switchPhase: 'idle',
        refreshPhase: 'idle',
        refreshOutcome: 'same',
        hostEntryPort: 7340,
        performerPort: 6868,
        monitorPort: 6869,
        hostPortsSwitched: false,
        hostLegacyConflict: false,
        networkDetails: false,

      }
      let phaseTimer = null,
        toastTimer = null,
        hideTimer = null,
        switchTimer = null
      const live = () =>
        state.role === 'host'
          ? state.status === 'running'
          : ['opening', 'pending', 'online', 'unknown', 'offline'].includes(
              state.status

      const clearTimers = () => {
        clearTimeout(phaseTimer)
        phaseTimer = null
        clearTimeout(switchTimer)
        switchTimer = null
      }
      function applyScene(scene) {
        const keepCamera =
          state.role === 'client' &&
          ['online', 'unknown', 'offline'].includes(state.status) &&
          ['client-live', 'client-lost', 'client-unknown'].includes(scene)
        const camera = keepCamera ? state.camera : false
        clearTimers()
        state.role = null
        state.preview = null
        state.status = 'idle'
        state.camera = camera
        state.switchPhase = 'idle'
        state.refreshPhase = 'idle'
        state.refreshOutcome = 'same'
        state.hostEntryPort = 7340
        state.performerPort = 6868
        state.monitorPort = 6869
        state.hostPortsSwitched = false
        state.hostLegacyConflict = false
        state.networkDetails = false
        state.hoverPaused = false
        state.peek = false
        if (!keepCamera) {
          state.currentProjectName = 'Mobile Sensor Meter'
          state.currentHostName = 'Concert-MacBook'
          state.currentHostId = 'concert'
          state.expectedHostId = null
          observedHosts.set(urls[0], { id: 'concert', name: 'Concert-MacBook' })
        }
        if (scene === 'client-host-changed') {
          state.url = urls[0]
          state.expectedHostId = 'concert'
          state.expectedHostName = 'Concert-MacBook'
          state.pendingHostName = 'Rehearsal-MacBook'
          state.pendingHostId = 'replacement'
          observedHosts.set(urls[0], {
            id: 'replacement',
            name: 'Rehearsal-MacBook',
          })
        }
        if (scene.startsWith('host-')) {
          state.role = 'host'
          state.hostNodeName =
            scene === 'host-name' ? '' : state.hostNodeName || 'Concert-MacBook'
          state.nodeNameDraft = state.hostNodeName
          state.status = ['host-live', 'host-auto-ports'].includes(scene)
            ? 'running'
            : 'idle'
          if (scene === 'host-auto-ports') {
            state.hostPortsSwitched = true
            state.hostEntryPort = 7341
            state.performerPort = 52341
            state.monitorPort = 52342
          }
          if (scene === 'host-port-conflict') {
            state.hostLegacyConflict = true
            state.status = 'port-conflict'
          }
        }
        if (scene.startsWith('client-')) {
          state.role = 'client'
          state.status =
            {
              'client-opening': 'opening',
              'client-wait': 'pending',
              'client-live': 'online',
              'client-lost': 'offline',
              'client-unknown': 'unknown',
              'client-changed': 'changed',
              'client-ended': 'ended',
              'client-host-changed': 'identity-changed',
              'client-incompatible': 'incompatible',
              'client-project-incompatible': 'project-incompatible',
              'client-unreachable': 'unreachable',
              'client-refresh-changed': 'online',
            }[scene] || 'idle'
          if (scene === 'client-refresh-changed')
            state.refreshOutcome = 'changed'
        }
      }
      applyScene(urlParams.get('scene') || 'entry')
      function currentScene() {
        if (!state.role) return 'entry'
        if (state.role === 'host')
          return state.status === 'port-conflict'
            ? 'host-port-conflict'
            : live()
              ? state.hostPortsSwitched
                ? 'host-auto-ports'
                : 'host-live'
              : state.hostNodeName
                ? 'host-idle'
                : 'host-name'
        return {
          idle: 'client-idle',
          opening: 'client-opening',
          pending: 'client-wait',
          online:
            state.refreshOutcome === 'changed'
              ? 'client-refresh-changed'
              : 'client-live',
          offline: 'client-lost',
          unknown: 'client-unknown',
          changed: 'client-changed',
          ended: 'client-ended',
          'identity-changed': 'client-host-changed',
          incompatible: 'client-incompatible',
          'project-incompatible': 'client-project-incompatible',
          unreachable: 'client-unreachable',
        }[state.status]
      }
      function syncUrl() {
        const p = new URLSearchParams(location.search)
        p.set('variant', state.variant)
        p.set('theme', state.theme)
        p.set('scene', currentScene())
        p.set('lang', state.language)
        try {
          history.replaceState(null, '', location.pathname + '?' + p)
        } catch {
          /* file:// browsers may disallow history changes; UI still works. */
        }
      }
      function roleCards() {
        return `<div class="side-heading"><h2>${t('chooseHeading')}</h2><p>${t('chooseHelp')}</p></div><div class="role-choices">${['host', 'client'].map(role => button('role:' + role, `${icon(role)}<span><span class="role-title">${roleLabel(role)}</span><p>${t(role + 'Desc')}</p></span>`, 'role-card')).join('')}</div>`
      }
      function roleNavigation() {
        if (!state.role) return roleCards()
        const target = state.role === 'host' ? 'client' : 'host'
        return button(
          'roleswitch',
          `<span class="role-current">${roleLabel(state.role)}</span><span class="role-next" aria-hidden="true">${t('switchHover').replace('{role}', roleLabel(target))}</span><span class="role-feedback" aria-live="polite"></span>`,
          'role-switch',
          `data-phase="${state.switchPhase}" data-hover-paused="${state.hoverPaused}" aria-label="${t('switchHover').replace('{role}', roleLabel(target))}" aria-pressed="${state.switchPhase === 'armed'}"`
        )
      }
      function updateRoleSwitch() {
        const control = document.querySelector('.role-switch')
        if (!control) return
        control.dataset.phase = state.switchPhase
        control.dataset.hoverPaused = String(state.hoverPaused)
        const key = {
          armed: 'switchAgain',
          blocked: 'switchBlocked',
          settling: 'switching',
        }[state.switchPhase]
        control.querySelector('.role-feedback').textContent = key ? t(key) : ''
        const target = state.role === 'host' ? 'client' : 'host'
        control.setAttribute(
          'aria-label',
          key ? t(key) : t('switchHover').replace('{role}', roleLabel(target))
        )
        control.setAttribute(
          'aria-pressed',
          String(state.switchPhase === 'armed')
        )
      }
      function cancelRoleSwitch() {
        if (!['armed', 'blocked'].includes(state.switchPhase)) return
        state.switchPhase = 'idle'
        updateRoleSwitch()
        updateReviewState()
        updatePeek()
      }
      function switchRole(keyboard) {
        if (state.switchPhase === 'settling') return
        if (live()) {
          state.switchPhase = 'blocked'
          updateRoleSwitch()
          updateReviewState()
          updatePeek()
          return
        }
        if (state.switchPhase !== 'armed') {
          state.switchPhase = 'armed'
          updateRoleSwitch()
          updateReviewState()
          updatePeek()
          return
        }
        state.switchPhase = 'settling'
        updateRoleSwitch()
        updateReviewState()
        const target = state.role === 'host' ? 'client' : 'host'
        switchTimer = setTimeout(
          () => {
            state.role = target
            state.status = 'idle'
            state.refreshPhase = 'idle'
            state.refreshOutcome = 'same'
            state.expectedHostId = null
            state.switchPhase = 'idle'
            state.hoverPaused = true
            state.camera = false
            render()
            if (keyboard) document.querySelector('.role-switch').focus()
          },
          matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300
        )
      }
      function hostAddress() {
        return `http://192.168.8.20:${state.hostEntryPort}/`
      }
      function hostSidebar() {
        if (!state.hostNodeName)
          return `<form id="host-node-form"><div class="side-heading"><h2>${t('nodeNameSetup')}</h2><p>${t('nodeNameHelp')}</p></div><label class="field-label" for="host-node-input">${t('nodeNameLabel')}</label><input id="host-node-input" class="address" required value="${esc(state.nodeNameDraft)}" placeholder="${t('nodeNamePlaceholder')}" autocomplete="off"><p class="field-help">${t('nodeNameRequired')}</p><button class="primary wide" type="submit">${t('nodeNameSave')}</button></form>`

          title = 'projectIncompatibleTitle'
          help = 'projectIncompatibleHelp'
          details = `<dl class="details"><dt>${t('projectIssue')}</dt><dd>${t('projectIssueReason')}</dd></dl>`
          action = button('check-project', t('retryCompatibility'), 'primary')
        } else if (status === 'unreachable') {
          title = 'unreachableTitle'
          help = 'unreachableHelp'
          action = button('retry-connection', t('retry'), 'primary')
        } else {
          title = 'incompatibleTitle'
          help = 'incompatibleHelp'
        }
        return `<section class="connection-notice"><span class="pill">${esc(state.currentHostName)}</span><h1>${t(title)}</h1><p>${t(help)}</p>${details}<div class="notice-actions">${action}${button('leave', t('backConnections'), 'quiet')}</div></section>`
      }
      function workspace() {
        const el = document.getElementById('workspace')
        el.className = 'workspace'
        if (
          state.role === 'client' &&
          [
            'changed',
            'ended',
            'identity-changed',
            'incompatible',
            'project-incompatible',
            'unreachable',
          ].includes(state.status)
        )
          return clientNotice()
        if (state.role === 'host' && state.status === 'port-conflict')
          return `<section class="connection-notice"><span class="pill">${esc(state.hostNodeName)}</span><h1>${t('hostConflictTitle')}</h1><p>${t('hostConflictHelp')}</p><dl class="details"><dt>${t('performerService')}</dt><dd>6868</dd><dt>${t('monitorService')}</dt><dd>6869</dd></dl><div class="notice-actions">${button('load', t('retry'), 'primary')}${button('select-another', t('selectAnother'), 'quiet')}</div></section>`
        if (state.role === 'host' && !state.hostNodeName) return welcome()
        if (state.role === 'host' && state.status === 'idle')
          return `<section class="intro"><div class="cover">${hand()}</div><span class="caption">${t('projectIntro')}</span><h1>${projects[state.project]}</h1><p>${t(state.project === 0 ? 'projectDesc' : 'hostWelcomeHelp')}</p><p class="caption" style="margin-block-start:22px">${t('projectHint')}</p></section>`
        if (state.role === 'host' && state.status === 'running') {
          el.className = 'workspace full-score'
          return `<div class="score-host"><header class="score-header"><h1>${projects[state.runningProject]}</h1><span class="pill live"><i class="dot"></i>${t('hostRunning')}</span></header><div class="monitor-lines">${[1, 2, 3].map((n, i) => `<div class="monitor-row"><span>${t('seat')} 0${n}</span><div class="meter" style="--level:${[44, 72, 56][i]}%"><i></i></div><span class="caption">${t('online')}</span></div>`).join('')}</div></div>`
        }
        if (
          state.role === 'client' &&
          (state.status === 'opening' || state.status === 'pending')
        )
          return `<section class="connecting">${icon('wait')}<h1>${t(state.refreshPhase === 'loading' ? 'refreshLoading' : state.status === 'opening' ? 'opening' : 'waitingTitle')}</h1><p>${t(state.status === 'opening' ? 'openingHelp' : 'waitingHelp')}</p></section>`
        if (
          state.role === 'client' &&
          (state.status === 'online' ||
            state.status === 'offline' ||
            state.status === 'unknown')
        ) {
          el.className = 'workspace full-score client-view'
          if (state.currentProjectName === 'runes-pnds')
            return `<section class="client-score"><header class="score-header"><h1>runes-pnds</h1><span class="pill">${t(state.status === 'offline' ? 'disconnected' : state.status === 'unknown' ? 'openedUnknown' : 'joined')}</span></header><div class="score-panel authored-score"><p>listen</p><div aria-hidden="true" class="score-staff"></div><p>hold one note through a slow breath</p></div></section>`
          return `<section class="client-score">${state.status === 'offline' ? `<div class="banner">${t('disconnected')} · ${t('disconnectHelp')}</div>` : state.status === 'unknown' ? `<div class="banner">${t('unknownHelp')}</div>` : ''}<header class="score-header"><div><h1>${esc(state.currentProjectName)}</h1><p class="caption" style="margin-block-start:7px">${t('scoreSubtitle')}</p></div>${state.status === 'unknown' ? '' : `<span class="pill">${t('seat')} 03</span>`}</header><div class="score-panel"><div class="row between"><h2>${t('handpose')}</h2><span class="pill">${t(state.camera ? 'cameraOn' : 'cameraOff')}</span></div><div class="sensor-grid"><div class="hand-stage ${state.camera ? 'active' : ''}">${hand()}<span class="caption">${t(state.camera ? 'sampleReady' : 'privacyHint')}</span></div><div class="stack"><div class="row between"><span class="caption">${t('sampleState')}</span><strong>${t(state.camera ? 'sampleReady' : 'sampleNone')}</strong></div><div class="line"></div><p class="caption">${t('clientDesc')}</p>${button('camera', icon('camera') + ' ' + t(state.camera ? 'cameraStop' : 'cameraEnable'), 'quiet', state.status === 'offline' ? 'disabled' : '')}</div></div></div><div class="sensor-rest"><div>${t('mic')}<span class="caption">${t('notEnabled')}</span></div><div>${t('motion')}<span class="caption">${t('notEnabled')}</span></div></div></section>`
        }
        return welcome()
      }
      function footer() {
        const active = state.role
        return `${active ? button(active === 'host' ? (live() ? 'stop' : 'load') : 'leave', icon(active === 'client' || live() ? 'stop' : 'play') + ' ' + t(active === 'host' ? (live() ? 'stop' : 'load') : 'leave'), 'primary transport row', !active || (active === 'client' && !live()) || (active === 'host' && !state.hostNodeName) ? 'disabled' : '') : ''}${active ? button('refresh', icon('refresh'), 'bar-button refresh-control', `${(active === 'client' ? !canRefresh() : !live()) ? 'disabled ' : ''}aria-label="${t('refresh')}"`) : ''}${active === 'host' ? `${button('settings', icon('audio') + t('audio'), 'bar-button')}${button('network', icon('network') + t('network'), 'bar-button')}` : ''}<span class="role-caption">${active ? roleLabel(active) : t('chooseHeading')}</span><span class="bar-spacer"></span>${button('settings', icon('settings'), 'bar-button', `aria-label="${t('settings')}"`)}${button('creation', t('creation'), 'mode-button')}`
      }
      function canRefresh() {
        return (
          state.role === 'client' &&
          ['online', 'unknown', 'offline'].includes(state.status)
        )
      }
      function updateRefreshButton() {
        const control = document.querySelector('.refresh-control')
        if (!control || state.role !== 'client') return
        const armed = state.refreshPhase === 'armed'
        control.classList.toggle('refresh-armed', armed)
        control.disabled = !canRefresh()
        control.innerHTML =
          icon('refresh') +
          (armed
            ? `<span class="refresh-label">${t('refreshAgain')}</span>`
            : '')
        control.setAttribute(
          'aria-label',
          armed ? `${t('refreshAgain')}. ${t('refreshHelp')}` : t('refresh')
        )
        control.setAttribute('aria-pressed', String(armed))
        control.title = t('refreshHelp')
      }
      function cancelRefresh() {
        if (state.refreshPhase !== 'armed') return
        state.refreshPhase = 'idle'
        updateRefreshButton()
        updateReviewState()
      }
      function refreshClient() {
        if (!canRefresh()) return
        if (state.refreshPhase !== 'armed') {
          state.refreshPhase = 'armed'
          updateRefreshButton()
          updateReviewState()
          return
        }
        const previous = state.status
        clearTimers()
        state.refreshPhase = 'loading'
        state.camera = false
        state.status = 'opening'
        render()
        phaseTimer = setTimeout(() => {
          if (state.refreshOutcome === 'changed' || previous === 'offline') {
            state.status =
              state.refreshOutcome === 'changed' ? 'changed' : 'unreachable'
            state.refreshPhase = 'idle'
            render()
            return
          }
          state.status = 'pending'
          render()
          phaseTimer = setTimeout(() => {
            state.status = previous
            state.refreshPhase = 'idle'
            render()
          }, 600)
        }, 500)
      }
      function render() {
        T = catalogs[state.language]
        document.documentElement.lang = state.language
        document.documentElement.dataset.colorTheme = state.theme
        document.documentElement.dataset.variant = state.variant
        document.title = t('title')
        document
          .getElementById('sidebar')
          .setAttribute('aria-label', t('sidebarLabel'))
        document
          .querySelector('.review-bar')
          .setAttribute('aria-label', t('reviewControls'))
        document.getElementById('sidebar-content').innerHTML =
          roleNavigation() +
          (state.role
            ? state.role === 'host'
              ? hostSidebar()
              : clientSidebar()
            : '')
        document.getElementById('sidebar-foot').textContent =
          state.role === 'host'
            ? t(live() ? 'hostRunning' : 'count')
            : state.role === 'client'
              ? t(live() ? 'connection' : 'notConnected')
              : t('role')
        document.getElementById('workspace').innerHTML = workspace()
        document.getElementById('bottom-bar').innerHTML = footer()
        renderReview()
        updateRoleSwitch()
        updateRefreshButton()
        fitReviewBar()
        updatePeek()
        syncUrl()
      }
      function renderReview() {
        const scenes = [
          ['entry', 'sceneEntry'],
          ['host-name', 'sceneHostName'],
          ['host-idle', 'sceneHostIdle'],
          ['host-live', 'sceneHostLive'],
          ['host-auto-ports', 'sceneHostPorts'],
          ['host-port-conflict', 'sceneHostConflict'],
          ['client-idle', 'sceneClientIdle'],
          ['client-opening', 'sceneClientOpening'],
          ['client-wait', 'sceneClientWait'],
          ['client-live', 'sceneClientLive'],
          ['client-lost', 'sceneClientLost'],
          ['client-unknown', 'sceneClientUnknown'],
          ['client-changed', 'sceneClientChanged'],
          ['client-ended', 'sceneClientEnded'],
          ['client-host-changed', 'sceneHostChanged'],
          ['client-incompatible', 'sceneIncompatible'],
          ['client-project-incompatible', 'sceneProjectIncompatible'],
          ['client-refresh-changed', 'sceneClientRefreshChanged'],
          ['client-unreachable', 'sceneClientUnreachable'],
        ]
        const current = currentScene()
        document.getElementById('review-controls').innerHTML =
          `<span class="caption" style="color:inherit">1.7.0-beta.2 ${t('review')}</span><span class="variant-name">${t('variantA')}</span><label>${t('sceneLabel')}<select id="scene-select">${scenes.map(([value, key]) => `<option value="${value}" ${value === current ? 'selected' : ''}>${t(key)}</option>`).join('')}</select></label><label>${t('themeLabel')}<select id="theme-select">${['pond', 'sand', 'stage', 'brutal'].map(theme => `<option value="${theme}" ${theme === state.theme ? 'selected' : ''}>${theme[0].toUpperCase() + theme.slice(1)}</option>`).join('')}</select></label><label>${t('languageLabel')}<select id="language-select"><option value="zh-CN" ${state.language === 'zh-CN' ? 'selected' : ''}>简体中文</option><option value="en" ${state.language === 'en' ? 'selected' : ''}>English</option></select></label><label><input type="checkbox" id="pin-sidebar" ${state.pin ? 'checked' : ''}>${t('pin')}</label>${button('restart', t('restart'))}`
        document.getElementById('review-description').textContent =
          t('variantHelp' + state.variant) + ' ' + t('prototypeHelp')
        updateReviewState()
      }
      function updateReviewState() {
        document.getElementById('review-state').textContent =
          `${t('roleState')}: ${state.role ? roleLabel(state.role) : t('unselected')} / ${t('runtimeState')}: ${t(state.status)} / ${t('cameraState')}: ${t(state.camera ? 'cameraOn' : 'cameraOff')} / ${t('reviewStateSwitch')}: ${t({ idle: 'switchIdle', armed: 'switchArmed', blocked: 'switchBlockedState', settling: 'switchSettling' }[state.switchPhase])} / ${t('reviewRefresh')}: ${t({ idle: 'refreshIdle', armed: 'refreshArmed', loading: 'refreshLoadingState' }[state.refreshPhase])}`
        fitReviewBar()
      }
      function fitReviewBar() {
        const height = document.querySelector('.review-bar').offsetHeight
        document.documentElement.style.setProperty(
          '--review-space',
          `${height + 36}px`
        )
      }
      window.addEventListener('resize', fitReviewBar)
      function updatePeek() {
        const sidebar = document.getElementById('sidebar')
        const hidden =
          live() &&
          !state.pin &&
          !state.peek &&
          !['armed', 'blocked', 'settling'].includes(state.switchPhase)
        sidebar.classList.toggle('sidebar-hidden', hidden)
        sidebar.inert = hidden
      }
      function notice(key) {
        clearTimeout(toastTimer)
        const toast = document.getElementById('toast')
        toast.textContent = t(key)
        toast.hidden = false
        toastTimer = setTimeout(() => (toast.hidden = true), 4000)
      }
      function chooseRole(role) {
        if (live()) return
        clearTimers()
        state.refreshPhase = 'idle'
        state.role = role
        state.preview = null
        state.switchPhase = 'idle'
        state.hoverPaused = false
        state.status = 'idle'
        state.camera = false
        render()
      }
      function join(allowDifferentHost = false) {
        const input = document.getElementById('address')
        let value = input ? input.value : state.url
        try {
          const parsed = new URL(value)
          if (
            !['http:', 'https:'].includes(parsed.protocol) ||
            parsed.username ||
            parsed.password
          )
            throw new Error()
          value = parsed.href
        } catch {
          if (input) {
            input.setCustomValidity(t('invalidAddress'))
            input.reportValidity()
          }
          return
        }
        state.refreshPhase = 'idle'
        state.refreshOutcome = 'same'
        state.url = value
        const known = observedHosts.get(value)
        const actualId = known ? known.id : 'demo-' + value
        const actualName = known ? known.name : 'Demo-Host'
        if (
          state.expectedHostId &&
          state.expectedHostId !== actualId &&
          !allowDifferentHost
        ) {
          clearTimers()
          state.pendingHostId = actualId
          state.pendingHostName = actualName
          state.status = 'identity-changed'
          state.camera = false
          render()
          return
        }
        state.currentHostName = actualName
        state.currentHostId = actualId
        state.expectedHostId = actualId
        state.camera = false
        state.status = 'opening'
        clearTimers()
        render()
        phaseTimer = setTimeout(() => {
          state.status = 'pending'
          render()
          phaseTimer = setTimeout(() => {
            state.status = 'online'
            const previous = state.recent.find(
              item => item.id === state.currentHostId
            )
            if (previous) {
              previous.name = state.currentHostName
              previous.url = value
            } else
              state.recent.unshift({
                id: state.currentHostId,
                name: state.currentHostName,
                url: value,
              })
            render()
          }, 800)
        }, 500)
      }
      document.addEventListener('submit', event => {
        if (event.target.id === 'host-node-form') {
          event.preventDefault()
          const input = document.getElementById('host-node-input')
          const name = input.value.trim()
          if (!name) {
            input.setCustomValidity(t('nodeNameRequired'))
            input.reportValidity()
            return
          }
          state.hostNodeName = name
          state.nodeNameDraft = name
          render()
          return
        }

        if (event.target.id === 'join-form') {
          event.preventDefault()
          join()
        }
      })
      document.addEventListener('input', event => {
        if (event.target.id === 'address') {
          event.target.setCustomValidity('')
          state.url = event.target.value
        }
        if (event.target.id === 'host-node-input') {
          event.target.setCustomValidity('')
          state.nodeNameDraft = event.target.value
        }
      })
      document.addEventListener('click', event => {
        if (!event.target.closest('.role-switch')) cancelRoleSwitch()
        if (!event.target.closest('.refresh-control')) cancelRefresh()
        const target = event.target.closest('[data-action]')
        if (!target || target.disabled) return
        const [action, arg] = target.dataset.action.split(':')
        switch (action) {
          case 'role':
            chooseRole(arg)
            break
          case 'roleswitch':
            switchRole(event.detail === 0)
            break
          case 'project':
            if (
              state.status === 'port-conflict' &&
              Number(arg) !== state.project
            ) {
              state.status = 'idle'
              state.hostLegacyConflict = false
            }
            state.project = Number(arg)
            render()
            break
          case 'load':
            if (!state.hostNodeName) return
            if (state.hostLegacyConflict) {
              state.status = 'port-conflict'
              render()
              notice('hostConflictStill')
              break
            }
            state.runningProject = state.project
            state.status = 'running'
            render()
            break
          case 'stop':
            clearTimers()
            state.status = 'idle'
            render()
            break
          case 'leave':
            clearTimers()
            state.refreshPhase = 'idle'
            state.refreshOutcome = 'same'
            state.status = 'idle'
            state.camera = false
            state.expectedHostId = null
            render()
            break
          case 'join-new':
            state.currentProjectName = state.nextProjectName
            join()
            break
          case 'join-again':
            join()
            break
          case 'join-other-host':
            join(true)
            break
          case 'camera':
            state.camera = !state.camera
            render()
            break
          case 'reconnect':
            join()
            break
          case 'recent':
            state.url = state.recent[Number(arg)].url
            state.expectedHostId = state.recent[Number(arg)].id
            state.expectedHostName = state.recent[Number(arg)].name
            render()
            document.getElementById('address').focus()
            break
          case 'forget':
            state.recent.splice(Number(arg), 1)
            render()
            break
          case 'copy':
            notice('copied')
            document.getElementById('toast').textContent += ' ' + hostAddress()
            break
          case 'refresh':
            if (state.role === 'client') refreshClient()
            else render()
            break
          case 'restart':
            applyScene('entry')
            render()
            break
          case 'creation':
            notice('creationHint')
            break
          case 'import':
          case 'utilities':
            notice('importHint')
            break
          case 'port-details':
            state.networkDetails = !state.networkDetails
            render()
            if (event.detail === 0)
              document
                .querySelector('[data-action="port-details"]')
                .focus({ preventScroll: true })
            break
          case 'network':
            if (state.role === 'host' && state.status === 'running') {
              state.networkDetails = !state.networkDetails
              state.peek = true
              render()
            } else notice('settingsHint')
            break
          case 'check-project':
            notice('projectStillIncompatible')
            break
          case 'retry-connection':
            notice('unreachableHelp')
            break
          case 'select-another':
            state.status = 'idle'
            render()
            break
          case 'settings':
            notice('settingsHint')
            break
        }
      })
      document.addEventListener('change', event => {
        if (event.target.id === 'scene-select') {
          applyScene(event.target.value)
          const p = new URLSearchParams(location.search)
          p.set('scene', event.target.value)
          try {
            history.replaceState(null, '', location.pathname + '?' + p)
          } catch {}
          render()
          document.getElementById('sidebar-content').scrollTop = 0
        }
        if (event.target.id === 'language-select') {
          state.language = event.target.value
          render()
        }
        if (event.target.id === 'theme-select') {
          state.theme = event.target.value
          render()
        }
        if (event.target.id === 'pin-sidebar') {
          state.pin = event.target.checked
          updatePeek()
        }
      })
      document.addEventListener('pointerdown', event => {
        if (!event.target.closest('.role-switch')) cancelRoleSwitch()
        if (!event.target.closest('.refresh-control')) cancelRefresh()
      })
      document
        .getElementById('sidebar-content')
        .addEventListener('pointerout', event => {
          const control = event.target.closest('.role-switch')
          if (control && !control.contains(event.relatedTarget)) {
            state.hoverPaused = false
            if (state.switchPhase === 'blocked') cancelRoleSwitch()
            else updateRoleSwitch()
          }
        })
      document.getElementById('edge').addEventListener('mouseenter', () => {
        state.peek = true
        clearTimeout(hideTimer)
        updatePeek()
      })
      document.getElementById('sidebar').addEventListener('mouseenter', () => {
        state.peek = true
        clearTimeout(hideTimer)
        updatePeek()
      })
      document.getElementById('sidebar').addEventListener('mouseleave', () => {
        hideTimer = setTimeout(() => {
          state.peek = false
          updatePeek()
        }, 200)
      })
      document.addEventListener('keydown', event => {
        if (event.key === 'Meta') {
          state.peek = true
          updatePeek()
        }
        if (event.key === 'Escape') {
          cancelRoleSwitch()
          cancelRefresh()
        }
      })
      document.addEventListener('keyup', event => {
        if (event.key === 'Meta') {
          state.peek = false
          updatePeek()
        }
      })
      window.addEventListener('blur', () => {
        state.peek = false
        cancelRoleSwitch()
        cancelRefresh()
        state.hoverPaused = false
        updatePeek()
      })
      render()
    </script>
  </body>
</html>
