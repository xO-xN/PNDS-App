<!doctype html>
<html lang="zh-CN" data-color-theme="pond" data-variant="A">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNDS · Settings layout study</title>
    <!-- Throwaway prototype: layout A selected; review seven content categories. B/C remain layout comparisons. All mutations are in memory. -->
    <link rel="stylesheet" href="../../src/theme-variables.css" />
    <style>
      :root {
        --ink: var(--pnds-text);
        --muted: var(--pnds-text-secondary);
        --surface: var(--pnds-card);
        --soft: var(--pnds-pill);
        --line: var(--pnds-border);
        --hair: color-mix(in srgb, var(--line) 55%, transparent);
        --accent: var(--pnds-accent-text);
        --radius: 12px;
        font: 13px/1.5 var(--pnds-font-ui);
        color: var(--ink);
        background: var(--pnds-bg);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        padding: 42px 24px 142px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      summary {
        cursor: default;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        min-height: 31px;
        padding: 5px 10px;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        background: var(--pnds-pill-hover);
      }
      button:disabled {
        opacity: 0.48;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      input,
      select {
        min-width: 0;
        min-height: 34px;
        width: 100%;
        border: 1px solid var(--pnds-input);
        border-radius: 6px;
        background: var(--surface);
        padding: 6px 10px;
        outline-offset: 2px;
      }
      input::placeholder {
        color: var(--muted);
      }
      input[readonly] {
        background: var(--soft);
        color: var(--muted);
      }
      input[aria-invalid='true'] {
        border-color: var(--pnds-danger);
      }
      input[type='checkbox'],
      input[type='radio'] {
        width: 15px;
        min-height: 15px;
        height: 15px;
        accent-color: var(--pnds-accent);
        margin: 0;
      }
      input[type='number'] {
        font-variant-numeric: tabular-nums;
      }
      input[dir='ltr'],
      code,
      .address {
        text-align: start;
        direction: ltr;
        unicode-bidi: isolate;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 22px;
        line-height: 1.35;
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      h2 {
        font-size: 14px;
        font-weight: 620;
      }
      h3 {
        font-size: 13px;
        font-weight: 610;
      }
      svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      small,
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .primary {
        background: var(--pnds-accent);
        color: var(--pnds-accent-foreground);
        border-color: transparent;
      }
      .primary:hover:not(:disabled) {
        background: var(--pnds-accent-hover);
      }
      .danger {
        color: var(--pnds-danger);
      }
      .text-button {
        background: transparent;
        border-color: transparent;
        padding-inline: 6px;
      }
      .icon-button {
        width: 30px;
        padding: 5px;
      }
      .study-label {
        max-width: 866px;
        margin: 0 auto 17px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
      }
      .study-label strong {
        color: var(--ink);
        font-weight: 620;
        letter-spacing: 0.04em;
      }
      .window {
        width: min(866px, 100%);
        height: min(594px, calc(100dvh - 215px));
        min-height: 380px;
        margin: auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface);
        box-shadow:
          0 22px 65px -27px color-mix(in srgb, var(--ink) 32%, transparent),
          0 2px 6px #00000008;
      }
      .window-bar {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px 0 20px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .window-bar strong {
        font-size: 13px;
        font-weight: 600;
      }
      .window-bar .text-button {
        margin-inline-start: auto;
      }
      .window-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 176px minmax(0, 1fr);
      }
      .nav {
        min-height: 0;
        overflow: auto;
        padding: 16px 10px 20px;
        border-inline-end: 1px solid var(--line);
        background: color-mix(in srgb, var(--soft) 48%, var(--surface));
      }
      .search {
        position: relative;
        margin: 0 3px 18px;
      }
      .search svg {
        position: absolute;
        inset-inline-start: 9px;
        top: 9px;
        width: 14px;
        height: 14px;
        color: var(--muted);
        pointer-events: none;
      }
      .search input {
        min-height: 31px;
        font-size: 12px;
        padding-inline-start: 29px;
        border-color: var(--line);
        background: var(--surface);
      }
      .nav-label {
        font-size: 10px;
        font-weight: 600;
        color: var(--muted);
        padding: 0 11px;
        margin: 16px 0 5px;
      }
      .nav-list {
        display: grid;
        gap: 2px;
      }
      .nav-item {
        justify-content: start;
        gap: 9px;
        width: 100%;
        background: transparent;
        border: 0;
        min-height: 32px;
        padding: 7px 10px;
        text-align: start;
        font-size: 12px;
      }
      .nav-item svg {
        width: 15px;
        height: 15px;
        color: var(--muted);
      }
      .nav-item[aria-current='page'] {
        background: var(--pnds-selection);
        color: var(--ink);
        font-weight: 600;
      }
      .nav-item[aria-current='page'] svg {
        color: var(--accent);
      }
      .nav-item .nav-alert {
        width: 6px;
        height: 6px;
        background: var(--pnds-danger);
        border-radius: 50%;
        margin-inline-start: auto;
      }
      .content {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 27px 30px 36px;
        scroll-padding-block: 22px;
      }
      .page-heading {
        margin-bottom: 24px;
      }
      .page-heading p {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .group {
        border: 1px solid var(--line);
        border-radius: 9px;
        overflow: hidden;
        margin-bottom: 18px;
        background: color-mix(in srgb, var(--soft) 45%, var(--surface));
      }
      .group-heading {
        padding: 13px 15px 12px;
      }
      .group-heading p {
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
      }
      .group-body {
        margin: 0 5px 5px;
        border: 1px solid var(--hair);
        border-radius: 5px;
        background: var(--surface);
        overflow: hidden;
      }
      .field {
        display: grid;
        grid-template-columns: minmax(110px, 0.95fr) minmax(0, 1.2fr);
        gap: 10px 20px;
        padding: 13px 14px;
        align-items: center;
      }
      .field + .field {
        border-top: 1px solid var(--hair);
      }
      .field label,
      .field-title {
        display: block;
        font-size: 12px;
        font-weight: 580;
      }
      .field-copy p {
        margin-top: 3px;
        font-size: 11px;
        line-height: 1.55;
        color: var(--muted);
      }
      .field-copy label.inline-control {
        display: flex;
        gap: 6px;
        font-weight: 400;
      }
      .field-control {
        min-width: 0;
      }
      .field-control small {
        font-size: 11px;
        display: block;
        margin-top: 5px;
      }
      .field-control .error {
        color: var(--pnds-danger);
      }
      .field-control .pending {
        color: var(--pnds-warning-text);
      }
      .inline-control {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .inline-control input {
        flex: 1;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .connection-heading {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 14px;
      }
      .connection-heading .save-state {
        text-align: end;
        padding-top: 1px;
      }
      .model-service .field {
        align-items: start;
      }
      .model-service .field-copy {
        padding-top: 6px;
      }
      .secret-input {
        position: relative;
      }
      .secret-input input {
        padding-inline-end: 38px;
      }
      .secret-reveal {
        position: absolute;
        inset-inline-end: 3px;
        inset-block-start: 3px;
        width: 28px;
        min-height: 28px;
        height: 28px;
        padding: 6px;
        border: 0;
        background: transparent;
        color: var(--muted);
      }
      .secret-reveal svg {
        width: 15px;
        height: 15px;
      }
      .secret-reveal .eye-closed,
      .secret-reveal[aria-pressed='true'] .eye-open {
        display: none;
      }
      .secret-reveal[aria-pressed='true'] .eye-closed {
        display: block;
      }
      .key-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 5px;
      }
      .key-meta .key-remove {
        min-height: 24px;
        padding: 2px 0 2px 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .key-meta .key-remove:hover:not(:disabled) {
        color: var(--pnds-danger);
        background: transparent;
      }
      .connection-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 8px 15px 12px;
      }
      .connection-footer #model-test-state {
        min-width: 0;
        font-size: 11px;
        line-height: 1.5;
      }
      .connection-footer button {
        flex: none;
      }
      .group-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        padding: 9px 15px 12px;
        font-size: 11px;
        color: var(--muted);
      }
      .save-state {
        font-size: 11px;
        color: var(--muted);
      }
      .save-state::before {
        content: '';
        display: inline-block;
        width: 5px;
        height: 5px;
        background: var(--pnds-success);
        border-radius: 50%;
        margin-inline-end: 6px;
        vertical-align: 1px;
      }
      .save-state[data-busy='true']::before {
        background: var(--pnds-warning-text);
      }
      .page-note {
        color: var(--muted);
        font-size: 11px;
        margin-top: 6px;
      }
      .service-section {
        border-top: 1px solid var(--line);
        margin-top: 8px;
        scroll-margin-top: 15px;
      }
      .service-section > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 0;
        list-style: none;
        font-size: 13px;
      }
      .service-section > summary::-webkit-details-marker {
        display: none;
      }
      .service-section > summary strong {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
      }
      .service-section > summary strong::before {
        content: '›';
        display: inline-block;
        width: 9px;
        font-size: 17px;
        line-height: 1;
      }
      .service-section[open] > summary strong::before {
        rotate: 90deg;
      }
      .service-section > summary small {
        font-size: 11px;
        text-align: end;
      }
      .service-content {
        padding-top: 3px;
        padding-bottom: 9px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--pnds-success);
        font-size: 11px;
      }
      .status::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .status.warn {
        color: var(--pnds-warning-text);
      }
      .status.bad {
        color: var(--pnds-danger);
      }
      .status.quiet {
        color: var(--muted);
      }
      .run-context {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .switch {
        position: relative;
        display: flex;
        width: 31px;
        height: 19px;
        margin-inline-start: auto;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 31px;
        height: 19px;
      }
      .switch-track {
        display: block;
        width: 31px;
        height: 19px;
        background: var(--pnds-input);
        border-radius: 20px;
        transition: background 150ms;
      }
      .switch-track::after {
        content: '';
        display: block;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--surface);
        margin: 3px;
        transition: translate 150ms;
      }
      .switch input:checked + .switch-track {
        background: var(--pnds-accent);
      }
      .switch input:checked + .switch-track::after {
        translate: 12px 0;
        background: var(--pnds-accent-foreground);
      }
      .switch input:focus-visible + .switch-track {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .themes {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
      }
      .theme-choice {
        position: relative;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 6px;
        text-align: center;
      }
      .theme-choice input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
      }
      .theme-choice:has(input:checked) {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .theme-choice:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .theme-art {
        height: 30px;
        display: grid;
        grid-template-columns: 25% 1fr;
        border: 1px solid #00000020;
        border-radius: 3px;
        overflow: hidden;
        background: var(--sample-bg);
      }
      .theme-art::before {
        content: '';
        background: var(--sample-nav);
      }
      .theme-art::after {
        content: '';
        border-radius: 2px;
        background: var(--sample-card);
        margin: 5px;
        border-top: 4px solid var(--sample-accent);
      }
      .theme-choice span:last-child {
        display: block;
        font-size: 10px;
        margin-top: 3px;
      }
      details.disclosure {
        margin: 4px 0 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      details.disclosure > summary {
        padding: 12px 15px;
        font-size: 12px;
        font-weight: 550;
      }
      details.disclosure[open] > summary {
        border-bottom: 1px solid var(--hair);
      }
      details.disclosure .field {
        padding: 11px 15px;
      }
      .process {
        margin: 8px 0 0;
      }
      .process > summary {
        color: var(--muted);
        font-size: 11px;
      }
      .process pre {
        overflow: auto;
        font-size: 11px;
        padding: 10px;
        margin-bottom: 0;
        border: 1px solid var(--hair);
        border-radius: 5px;
        background: var(--soft);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .account {
        display: flex;
        gap: 11px;
        align-items: center;
        padding: 17px 14px;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--soft);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
      }
      .account .actions {
        margin-inline-start: auto;
      }
      .account strong {
        font-size: 12px;
      }
      .account small {
        display: block;
        font-size: 11px;
      }
      .auth {
        padding: 15px;
        border-top: 1px solid var(--hair);
      }
      .auth code {
        display: block;
        font-size: 22px;
        letter-spacing: 0.12em;
        margin: 8px 0 12px;
      }
      .danger-zone {
        margin-top: 24px;
        border-top: 1px solid var(--hair);
        padding-top: 17px;
      }
      .danger-row {
        display: flex;
        align-items: center;
        gap: 15px;
        justify-content: space-between;
      }
      .danger-row p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .confirmation {
        padding: 13px;
        margin-top: 12px;
        background: color-mix(in srgb, var(--pnds-danger) 6%, var(--surface));
        border: 1px solid var(--pnds-danger);
        border-radius: 6px;
      }
      .confirmation p {
        margin: 5px 0 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .entry-heading {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 14px;
      }
      .entry-heading .status {
        flex: none;
        margin-top: 2px;
      }
      .entry-address-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 12px;
      }
      .entry-address {
        flex: 1;
        min-width: 0;
        padding-block: 3px;
        font-size: 12px;
        white-space: nowrap;
        overflow-x: auto;
        scrollbar-width: thin;
      }
      .entry-copy {
        flex: none;
      }
      .entry-address:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .port-row {
        display: grid;
        grid-template-columns: 1fr 70px 1fr;
        align-items: start;
        gap: 12px;
        padding: 15px;
        border-top: 1px solid var(--hair);
        font-size: 12px;
      }
      .port-row:first-child {
        border-top: 0;
      }
      .port-row code {
        font-size: 13px;
      }
      .port-actions {
        grid-column: 1 / -1;
      }
      .accordion-trigger {
        display: none;
      }
      .empty-search {
        color: var(--muted);
        padding: 30px 15px;
        text-align: center;
      }
      .closed {
        height: 594px;
        max-height: calc(100dvh - 215px);
        display: grid;
        place-items: center;
      }
      [data-variant='B'] .window-body {
        display: flex;
        flex-direction: column;
      }
      [data-variant='B'] .nav {
        display: flex;
        align-items: center;
        overflow: visible;
        padding: 0;
        background: var(--surface);
        border: 0;
        border-bottom: 1px solid var(--line);
      }
      [data-variant='B'] .nav .search {
        width: 142px;
        margin: 0 0 0 16px;
        flex: none;
      }
      [data-variant='B'] .nav-label {
        display: none;
      }
      [data-variant='B'] .nav-items {
        display: flex;
        min-width: 0;
        flex: 1;
        overflow-x: auto;
        padding: 0 15px;
        scrollbar-width: thin;
      }
      [data-variant='B'] .nav-list {
        display: contents;
      }
      [data-variant='B'] .nav-item {
        width: auto;
        flex: none;
        border-radius: 0;
        min-height: 43px;
        padding-inline: 11px;
        border-bottom: 2px solid transparent;
      }
      [data-variant='B'] .nav-item svg {
        display: none;
      }
      [data-variant='B'] .nav-item[aria-current='page'] {
        border-color: var(--accent);
        background: transparent;
        color: var(--accent);
      }
      [data-variant='B'] .content {
        padding: 25px 32px 35px;
        flex: 1;
      }
      [data-variant='B'] .group {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 0 32px;
        border: 0;
        border-radius: 0;
        background: transparent;
        padding: 20px 0;
        margin: 0;
        border-top: 1px solid var(--line);
        overflow: visible;
      }
      [data-variant='B'] .group-heading {
        padding: 0;
      }
      [data-variant='B'] .group-heading p {
        margin-top: 6px;
        line-height: 1.65;
      }
      [data-variant='B'] .group-body {
        border: 0;
        margin: 0;
        background: none;
        border-radius: 0;
        overflow: visible;
      }
      [data-variant='B'] .group-footer {
        grid-column: 2;
        padding: 10px 0 0;
      }
      [data-variant='B'] .connection-footer {
        grid-column: 2;
        padding: 12px 0 0;
      }
      [data-variant='B'] .field {
        display: block;
        padding: 0;
        margin-bottom: 17px;
      }
      [data-variant='B'] .field:last-child {
        margin-bottom: 0;
      }
      [data-variant='B'] .field + .field {
        border: 0;
      }
      [data-variant='B'] .field-copy {
        margin-bottom: 7px;
      }
      [data-variant='B'] .field:has(.switch) {
        display: grid;
        grid-template-columns: 1fr 35px;
        gap: 18px;
        align-items: center;

        display: block;
        min-height: 0;
      }

        height: 61px;
        padding: 14px 25px;
        background: var(--surface);
        border: 0;
      }
      [data-variant='C'] .search {
        margin: 0;
        max-width: 300px;
      }
      [data-variant='C'] .nav-items {
        display: none;
      }
      [data-variant='C'] .content {
        height: calc(100% - 61px);
        padding: 0 25px 30px;
      }

        display: block;
        border: 1px solid var(--line);
        border-top: 0;
      }

        border-start-start-radius: 8px;
        border-start-end-radius: 8px;
      }
      [data-variant='C'] .page:last-of-type {
        border-end-start-radius: 8px;
        border-end-end-radius: 8px;
      }

        display: grid;
        grid-template-columns: 28px 105px minmax(0, 1fr) 18px;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        border-radius: 0;
        text-align: start;
        min-height: 49px;
        padding: 10px 16px;
        background: transparent;

        color: var(--muted);

        width: 13px;
        height: 13px;
        transition: rotate 150ms;
      }

        rotate: 90deg;
      }
      [data-variant='C'] .accordion-trigger[aria-expanded='true'] {
        background: var(--soft);
      }

        font-weight: 580;
        font-size: 12px;
      }
      [data-variant='C'] .accordion-trigger small {
        font-size: 11px;
      }
      [data-variant='C'] .page-heading {
        display: none;
      }
      [data-variant='C'] .page-inner {
        padding: 17px 20px 20px;
        border-top: 1px solid var(--hair);
      }
      [data-variant='C'] .group {
        border: 0;
        border-radius: 0;
        margin-bottom: 20px;
        background: transparent;
      }
      [data-variant='C'] .group-heading {
        padding: 0 0 9px;
      }
      [data-variant='C'] .group-heading p {
        display: none;
      }
      [data-variant='C'] .group-body {
        margin: 0;
        border: 1px solid var(--hair);
      }
      [data-variant='C'] .field {
        grid-template-columns: 190px minmax(0, 1fr);
        padding-block: 10px;
      }
      [data-variant='C'] .group-footer {
        padding: 8px 0 0;
      }
      .review {
        position: fixed;
        bottom: 17px;
        inset-inline: 18px;
        width: fit-content;
        max-width: calc(100% - 36px);
        margin: auto;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 12px;
        box-shadow: 0 5px 30px #00000018;
        padding: 10px 12px 9px;
        z-index: 10;
      }
      .review-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .review button,
      .review select {
        min-height: 30px;
        font-size: 11px;
      }
      .review select {
        width: auto;
        padding-block: 4px;
        border-color: var(--line);
      }
      .variant-controls {
        display: flex;
        align-items: center;
        gap: 3px;
        padding-inline-end: 9px;
        border-inline-end: 1px solid var(--line);
      }
      .variant-controls button[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--pnds-input);
        font-weight: 600;
      }
      .review-description {
        font-size: 11px;
        color: var(--muted);
        margin-top: 7px;
        text-align: center;
      }
      .toast {
        position: fixed;
        top: 18px;
        inset-inline-end: 20px;
        max-width: 350px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 3px 15px #00000015;
        font-size: 12px;
        z-index: 20;
      }
      dialog {
        max-width: min(540px, calc(100% - 40px));
        max-height: calc(100dvh - 60px);
        overflow: auto;
        padding: 25px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
      }
      dialog::backdrop {
        background: #00000060;
      }
      dialog h2 {
        font-size: 19px;
      }
      dialog p {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      dialog ul {
        margin-block: 17px;
        padding-inline-start: 20px;
      }
      dialog li {
        margin-block: 8px;
        font-size: 12px;
      }
      dialog .actions {
        margin-top: 21px;
        justify-content: end;
      }
      [data-color-theme='brutal'] {
        --radius: 0px;
      }
      [data-color-theme='brutal'] .window,
      [data-color-theme='brutal'] .review {
        box-shadow: 4px 4px 0 var(--ink);
      }
      [data-color-theme='brutal'] .window,
      [data-color-theme='brutal'] .group,
      [data-color-theme='brutal'] .group-body,
      [data-color-theme='brutal'] button,
      [data-color-theme='brutal'] input,
      [data-color-theme='brutal'] select,
      [data-color-theme='brutal'] details,
      [data-color-theme='brutal'] .review,
      [data-color-theme='brutal'] .theme-choice,
      [data-color-theme='brutal'] .theme-art,
      [data-color-theme='brutal'] dialog,
      [data-color-theme='brutal'] .confirmation,
      [data-color-theme='brutal'] .avatar {
        border-radius: 0 !important;
      }
      @media (max-width: 760px) {
        body {
          padding: 18px 12px 155px;
        }
        .window {
          height: calc(100dvh - 215px);
        }
        .window-body {
          grid-template-columns: 142px minmax(0, 1fr);
        }
        .nav {
          padding-inline: 6px;
        }
        .content {
          padding: 22px 18px 30px;
        }
        .field {
          grid-template-columns: minmax(0, 1fr);
          gap: 7px;
        }
        .field:has(.switch) {
          grid-template-columns: 1fr 35px;
        }
        [data-variant='B'] .group {
          grid-template-columns: 145px minmax(0, 1fr);
          gap: 0 22px;
        }
        [data-variant='C'] .field {
          grid-template-columns: 145px minmax(0, 1fr);
        }
      }
      @media (max-width: 540px) {
        .window {
          min-height: 340px;
        }
        .window-body {
          grid-template-columns: 110px minmax(0, 1fr);
        }
        .nav-item {
          padding-inline: 6px;
          gap: 6px;
          font-size: 11px;
        }
        .nav-item svg {
          width: 13px;
        }
        .search {
          margin-inline: 0;
        }
        .search input {
          font-size: 11px;
          padding-inline-start: 24px;
        }
        .search svg {
          inset-inline-start: 6px;
        }
        .content {
          padding-inline: 12px;
        }
        .themes {
          grid-template-columns: repeat(2, 1fr);
        }
        [data-variant='B'] .content {
          padding-inline: 18px;
        }
        [data-variant='B'] .group {
          display: block;
        }
        [data-variant='B'] .group-heading {
          margin-bottom: 15px;
        }
        [data-variant='C'] .accordion-trigger {
          grid-template-columns: 20px 1fr 15px;
        }
        [data-variant='C'] .accordion-trigger small {
          display: none;
        }
        [data-variant='C'] .field {
          grid-template-columns: minmax(0, 1fr);
        }
        [data-variant='C'] .field:has(.switch) {
          grid-template-columns: 1fr 35px;
        }
        [data-variant='C'] .nav {
          padding-inline: 12px;
        }
        [data-variant='C'] .content {
          padding-inline: 12px;
        }
        [data-variant='C'] .page-inner {
          padding-inline: 10px;
        }
        .review {
          bottom: 9px;
          padding: 8px;
        }
        .variant-controls {
          border: 0;
          padding: 0;
        }
        .review-controls {
          gap: 5px;
        }
        .review-description {
          max-width: 330px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

        input.addEventListener('change', () => {
          setTheme(input.value)
          markSaved('general-save')
          syncUrl()
        })
      )
      $('review-language').addEventListener('change', event => {
        language = event.target.value
        translate()
        syncUrl()
      })
      $('app-language').addEventListener('change', event => {
        language = event.target.value === 'en' ? 'en' : 'zh-CN'
        translate()
        markSaved('general-save')
        syncUrl()
      })
      $('hide-details').addEventListener('change', () =>
        markSaved('general-save')
      )
      $('review-scene').addEventListener('change', event =>
        applyScene(event.target.value)
      )
      $('reset').addEventListener('click', () => location.reload())
      $('reference').addEventListener('click', () =>
        $('reference-dialog').showModal()
      )
      $('close-reference').addEventListener('click', () =>
        $('reference-dialog').close()
      )
      $('close-window').addEventListener('click', () => {
        $('settings-window').hidden = true
        $('closed').hidden = false
        $('reopen').focus()
      })
      $('reopen').addEventListener('click', () => {
        $('settings-window').hidden = false
        $('closed').hidden = true
        $('close-window').focus()
      })
      document
        .querySelectorAll('[data-demo]')
        .forEach(button => button.addEventListener('click', () => toast()))
      for (const id of [
        'base-url',
        'model-name',
        'api-key',
        'capacity',
        'input-target',
        'max-output',
        'reasoning',
        'safety-margin',
        'tokenizer',
      ]) {
        $(id).addEventListener(
          $(id).tagName === 'SELECT' ? 'change' : 'input',
          () => {
            if (id === 'api-key') updateKeyControls()
            setTestState('untested')
            clearTimeout(timers.model)
            localized($('model-save'), 'saving')
            $('model-save').dataset.busy = 'true'
            timers.model = setTimeout(() => {
              if (!validateModel()) {
                localized($('model-save'), 'notSaved')
                delete $('model-save').dataset.busy
                return
              }
              if ($('api-key').value) {
                keyStored = true
                $('api-key').value = ''
                updateKeyControls()
              }
              markSaved('model-save', 0)
            }, 600)
          }
        )
      }
      $('manual-context').addEventListener('change', () => {
        setTestState('untested')
        $('manual-fields').hidden = !$('manual-context').checked
        markSaved('model-save')
      })
      for (const id of ['base-url', 'model-name'])
        $(id).addEventListener('blur', validateModel)
      $('show-key').addEventListener('pointerdown', event =>
        event.preventDefault()
      )
      $('show-key').addEventListener('click', () =>
        setKeyVisibility($('api-key').type === 'password')
      )
      $('test-model').addEventListener('click', () => {
        if (!validateModel()) {
          localized($('model-save'), 'notSaved')
          delete $('model-save').dataset.busy
          return
        }
        $('test-model').disabled = true
        setTestState('testing')
        clearTimeout(timers.test)
        // This remote demo endpoint requires a credential. Real providers may
        // allow anonymous requests; the prototype does not impose that policy.
        const testFailed = modelFailure || (!keyStored && !$('api-key').value)
        timers.test = setTimeout(() => {
          $('test-model').disabled = false
          setTestState(testFailed ? 'testFailed' : 'testPassed')
        }, 1000)
      })
      function openConfirmation(id) {
        $(id).hidden = false
        $(id).querySelector('[data-cancel]').focus()
      }
      $('remove-key').addEventListener('click', () =>
        openConfirmation('key-confirmation')
      )
      $('remove-model').addEventListener('click', () =>
        openConfirmation('model-confirmation')
      )
      document.querySelectorAll('[data-cancel]').forEach(button =>
        button.addEventListener('click', () => {
          $(button.dataset.cancel).hidden = true
          const trigger = {
            'key-confirmation': 'remove-key',
            'model-confirmation': 'remove-model',
            'port-confirmation': 'release-port',
          }[button.dataset.cancel]
          $(trigger)?.focus()
        })
      )
      document.querySelectorAll('[data-confirm]').forEach(button =>
        button.addEventListener('click', () => {
          if (button.dataset.confirm === 'key') {
            clearTimeout(timers.model)
            clearTimeout(timers['model-save'])
            keyStored = false
            $('api-key').value = ''
            updateKeyControls()
            $('key-confirmation').hidden = true
            $('api-key').focus()
            markSaved('model-save', 0)
          } else {
            $('base-url').value = ''
            $('model-name').value = ''
            $('model-confirmation').hidden = true
            $('remove-model').focus()
          }
          setTestState('untested')
          toast('removed')
        })
      )
      for (const id of ['git-name', 'git-email'])
        $(id).addEventListener('blur', () => {
          const invalid = !$(id).checkValidity()
          $(id).setAttribute('aria-invalid', String(invalid))
          $(`${id}-error`).hidden = !invalid
          localized(
            $(`${id}-error`),
            id === 'git-email' ? 'invalidEmail' : 'required'
          )
          if (!invalid) markSaved('git-save')
        })
      $('github-action').addEventListener('click', () => {
        if (signedIn) {
          signedIn = false
          updateGitHub()
        } else $('github-auth').hidden = false
      })
      $('authorize').addEventListener('click', () => {
        signedIn = true
        updateGitHub()
        toast()
      })
      for (const id of ['audio-device', 'audio-rate'])
        $(id).addEventListener('change', () => {
          updateAudio()
          markSaved('audio-save')
        })
      $('node-name').addEventListener('blur', () => {
        const invalid = !$('node-name').value.trim()
        $('node-name').setAttribute('aria-invalid', String(invalid))
        $('node-name-error').hidden = !invalid
        localized($('node-name-error'), 'required')
        if (!invalid) markSaved('device-save')
      })
      for (const id of ['hub-url', 'hub-token'])
        $(id).addEventListener('blur', () => markSaved('node-save'))
      $('lan-address').addEventListener('change', () => {
        $('lan-pending').hidden = $('lan-address').value === '192.168.1.24'
        markSaved('node-save')
      })
      $('copy-entry').addEventListener('click', () => {
        toast()
      })
      $('https-enabled').addEventListener('change', () =>
        markSaved('https-save')
      )
      $('https-domain').addEventListener('blur', () => {
        const value = $('https-domain').value.trim()
        const valid =
          /^(?![\d.]+$)(?!.*\.local$)[a-z\d](?:[a-z\d.-]*[a-z\d])?\.[a-z]{2,}$/i.test(
            value
          )
        $('domain-error').hidden = valid
        localized($('domain-error'), 'invalidDomain')
        $('https-domain').setAttribute('aria-invalid', String(!valid))
        if (valid) markSaved('https-save')
      })
      $('https-port').addEventListener('blur', () => {
        const valid =
          /^\d+$/.test($('https-port').value) && $('https-port').checkValidity()
        $('https-port-error').hidden = valid
        localized($('https-port-error'), 'invalidPort')
        $('https-port').setAttribute('aria-invalid', String(!valid))
        if (valid) markSaved('https-save')
      })
      for (const [id, imported] of [
        ['clear-certificate', false],
        ['import-certificate', true],
      ])
        $(id).addEventListener('click', () => {
          localized(
            $('certificate-state'),
            imported ? 'certificateValid' : 'certificateMissing'
          )
          $('certificate-state').className = `status ${imported ? '' : 'warn'}`
          localized(
            $('access-https-state'),
            imported ? 'certificateValid' : 'certificateMissing'
          )
          $('access-https-state').className = `status ${imported ? '' : 'warn'}`
          $('certificate-expiry').hidden = !imported
          toast()
        })
      $('dns-enabled').addEventListener('change', () => {
        dnsState = $('dns-enabled').checked ? 'approval' : 'off'
        updateDns()
      })
      $('refresh-dns').addEventListener('click', () => {
        updateDns()
        toast()
      })
      $('release-port').addEventListener('click', () =>
        openConfirmation('port-confirmation')
      )
      $('confirm-release').addEventListener('click', () => {
        $('port-confirmation').hidden = true
        $('external-process').hidden = true
        localized($('port-owner'), 'available')
        $('port-owner').className = 'status'
        localized($('access-ports-state'), 'available')
        $('access-ports-state').className = 'status'
        toast()
      })
      $('check-updates').addEventListener('click', () => {
        $('check-updates').disabled = true
        localized($('update-state'), 'checking')
        timers.update = setTimeout(() => {
          localized($('update-state'), 'upToDate')
          $('check-updates').disabled = false
        }, 1000)
      })
      setTheme(theme)
      updateKeyControls()
      translate()
      setLayout(variant)
      applyScene(scene, !params.has('category') && scene !== 'normal')
      if (
        active === 'access' &&
        ['https', 'dns', 'ports'].includes(legacyCategory)
      )
        jumpToAccess(`access-${legacyCategory}`)
    </script>
  </body>
</html>
