<!doctype html>
<!-- Throwaway UI review: three feedback placements inside the existing PNDS
     workspace. ?variant=A|B|C&scene=save&theme=pond&lang=zh-CN.
     All timings, files and progress are synthetic and memory-only. No App APIs.
     Uses the repository's real four-theme palette; keep this file in place. -->
<html lang="zh-CN" data-color-theme="pond" data-variant="A">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PNDS · 等待反馈样式核对</title>
    <link rel="stylesheet" href="../../src/theme-variables.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        color: var(--pnds-text);
        background: var(--pnds-creation-shell);
        font: 12px/1.5 var(--pnds-font-ui);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-block-size: 30px;
        padding: 5px 10px;
        border: 1px solid var(--pnds-creation-line);
        border-radius: 6px;
        background: var(--pnds-creation-raised);
        white-space: nowrap;
      }
      button:hover {
        background: var(--pnds-pill-hover);
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      :focus-visible {
        outline: 2px solid var(--pnds-accent-text);
        outline-offset: 3px;
      }
      input,
      select {
        min-block-size: 30px;
        padding: 4px 8px;
        border: 1px solid var(--pnds-input);
        border-radius: 5px;
        background: var(--pnds-creation-raised);
      }
      input {
        min-inline-size: 0;
      }
      svg {
        inline-size: 16px;
        block-size: 16px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .primary {
        background: var(--pnds-accent);
        border-color: transparent;
        color: var(--pnds-accent-foreground);
      }
      .primary:hover {
        background: var(--pnds-accent-hover);
      }
      .quiet {
        border-color: transparent;
        background: transparent;
      }
      .muted {
        color: var(--pnds-text-secondary);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .sr-only {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .review-heading {
        max-inline-size: 1480px;
        margin: auto;
        padding: 22px 28px 15px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
      }
      .review-heading h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      .review-heading p {
        margin: 0;
        color: var(--pnds-text-secondary);
        font-size: 12px;
      }
      .app-window {
        position: relative;
        max-inline-size: 1424px;
        margin: 0 28px;
        block-size: min(690px, calc(100dvh - 262px));
        min-block-size: 420px;
        display: grid;
        grid-template: 32px minmax(0, 1fr) 50px / 226px minmax(0, 1fr) 250px;
        border: 1px solid var(--pnds-creation-line);
        border-radius: 12px;
        overflow: hidden;
        background: var(--pnds-creation-workspace);
        box-shadow: 0 12px 40px
          color-mix(in srgb, var(--pnds-text) 9%, transparent);
      }
      .titlebar {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        gap: 18px;
        padding-inline: 14px;
        background: var(--pnds-creation-shell);
        border-block-end: 1px solid var(--pnds-creation-line);
        font-size: 11px;
      }
      .traffic {
        display: flex;
        gap: 8px;
      }
      .traffic i {
        display: block;
        inline-size: 11px;
        block-size: 11px;
        border-radius: 50%;
        background: #ff6058;
        border: 1px solid #0001;
      }
      .traffic i:nth-child(2) {
        background: #ffbd2e;
      }
      .traffic i:nth-child(3) {
        background: #28c840;
      }
      .sidebar {
        min-block-size: 0;
        padding: 14px 12px;
        overflow: auto;
        background: var(--pnds-creation-nav);
        border-inline-end: 1px solid var(--pnds-creation-line);
      }
      .project-name {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        font-weight: 600;
        padding: 2px 8px 15px;
      }
      .side-label {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 16px 8px 7px;
        font-size: 11px;
        color: var(--pnds-text-secondary);
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-block-size: 29px;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
      }
      .tree-row svg {
        inline-size: 13px;
        block-size: 13px;
        color: var(--pnds-file-system);
      }
      .tree-row.selected {
        background: var(--pnds-selection);
      }
      .tree-row.indent {
        padding-inline-start: 25px;
      }
      .tree-row small {
        margin-inline-start: auto;
        color: var(--pnds-text-secondary);
      }
      .workspace {
        position: relative;
        display: flex;
        flex-direction: column;
        min-inline-size: 0;
        min-block-size: 0;
      }
      .workspace-tabs {
        display: flex;
        align-items: center;
        gap: 3px;
        min-block-size: 34px;
        padding-inline: 8px;
        background: var(--pnds-creation-toolbar);
        border-block-end: 1px solid var(--pnds-creation-line);
      }
      .tab {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 7px 11px;
        color: var(--pnds-text-secondary);
        font-size: 11px;
      }
      .tab.active {
        color: var(--pnds-text);
        background: var(--pnds-creation-workspace);
        border-block-end: 2px solid var(--pnds-accent-text);
      }
      .tab svg {
        inline-size: 13px;
        block-size: 13px;
      }
      #scene-content {
        min-block-size: 0;
        overflow: auto;
        flex: 1;
      }
      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        background: var(--pnds-creation-toolbar);
        border-block-end: 1px solid var(--pnds-creation-line);
      }
      .toolbar h2 {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .toolbar .spacer {
        flex: 1;
      }
      .toolbar input {
        inline-size: 150px;
        block-size: 30px;
        font-size: 11px;
      }
      .action-button {
        inline-size: 156px;
        max-inline-size: 100%;
        flex-shrink: 0;
        font-size: 11px;
      }
      :lang(en) .action-button {
        inline-size: 210px;
      }
      .git-body {
        display: flex;
        flex-direction: column;
        min-block-size: 255px;
      }
      .git-history {
        padding: 12px;
        border-block-end: 1px solid var(--pnds-creation-line);
      }
      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--pnds-text-secondary);
        margin-block-end: 14px;
      }
      .branch-pill {
        border: 1px solid var(--pnds-creation-line);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--pnds-accent-text);
      }
      .version-node {
        position: relative;
        display: flex;
        align-items: center;
        gap: 11px;
        block-size: 32px;
        padding: 4px 8px;
      }
      .version-node > div {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-inline-size: 0;
      }
      .version-node::before {
        content: '';
        position: absolute;
        inset-inline-start: 13px;
        inset-block-start: 16px;
        inline-size: 1px;
        block-size: 32px;
        background: var(--pnds-creation-line);
      }
      .version-node:last-child::before {
        display: none;
      }
      .node-dot {
        inline-size: 11px;
        block-size: 11px;
        border-radius: 50%;
        border: 2px solid var(--pnds-accent-text);
        background: var(--pnds-creation-workspace);
        flex-shrink: 0;
        z-index: 1;
      }
      .version-node.active {
        border-radius: 5px;
        background: var(--pnds-creation-inset);
      }
      .version-node strong {
        font-size: 11px;
        font-weight: 500;
        display: block;
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .version-node small {
        display: block;
        white-space: nowrap;
        color: var(--pnds-text-secondary);
        font-size: 10px;
      }
      .changes {
        padding: 16px 14px;
      }
      .file-change {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-block: 10px;
        border-block-end: 1px solid var(--pnds-creation-hair);
        font-size: 11px;
      }
      .file-change span:first-child {
        color: var(--pnds-warning-text);
        font-size: 10px;
      }
      .file-change small {
        margin-inline-start: auto;
        color: var(--pnds-text-secondary);
      }
      .diff-snippet {
        margin-block-start: 22px;
        font:
          10px/2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--pnds-text-secondary);
        overflow: auto;
      }
      .diff-snippet div {
        white-space: nowrap;
        padding-inline: 7px;
      }
      .diff-snippet .added {
        background: color-mix(in srgb, var(--pnds-success) 8%, transparent);
        color: var(--pnds-success);
      }
      .preview {
        border-inline-start: 1px solid var(--pnds-creation-line);
        background: var(--pnds-creation-aux);
        min-inline-size: 0;
        display: flex;
        flex-direction: column;
      }
      .preview-title {
        padding: 9px 12px;
        font-size: 11px;
        border-block-end: 1px solid var(--pnds-creation-line);
      }
      .score-preview {
        flex: 1;
        min-block-size: 0;
        display: grid;
        place-items: center;
        background: #0a0b0b;
        color: #a8bcb0;
        overflow: hidden;
      }
      .score-preview svg {
        inline-size: 200px;
        block-size: 260px;
        stroke-width: 1;
        opacity: 0.7;
      }
      .preview-note {
        padding: 9px 12px;
        font-size: 10px;
        color: var(--pnds-text-secondary);
      }
      .transport {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        gap: 15px;
        padding-inline: 15px;
        background: var(--pnds-desktop-bar);
        border-block-start: 1px solid var(--pnds-creation-line);
        font-size: 11px;
      }
      .transport .grow {
        flex: 1;
      }
      .transport svg {
        inline-size: 13px;
        block-size: 13px;
      }
      .mode-button {
        background: transparent;
        border-color: var(--pnds-desktop-control-line);
        padding-inline: 16px;
      }
      .status-dot {
        inline-size: 5px;
        block-size: 5px;
        border-radius: 50%;
        background: var(--pnds-text-secondary);
      }
      .content-page {
        padding: 22px;
      }
      .content-page h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 7px;
      }
      .content-page > p {
        margin: 0 0 24px;
        color: var(--pnds-text-secondary);
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        padding-block: 16px;
        border-block-end: 1px solid var(--pnds-creation-hair);
      }
      .settings-row strong {
        font-weight: 500;
      }
      .settings-row small {
        display: block;
        color: var(--pnds-text-secondary);
        margin-block-start: 4px;
      }
      .facts {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 13px;
        padding-block: 20px;
        font-size: 11px;
      }
      .facts dt {
        color: var(--pnds-text-secondary);
      }
      .facts dd {
        margin: 0;
      }
      .project-list {
        margin-block: 20px;
      }
      .project-list > div {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-block-end: 1px solid var(--pnds-creation-hair);
      }
      .project-list svg {
        color: var(--pnds-file-system);
      }
      .project-list small {
        color: var(--pnds-text-secondary);
        margin-inline-start: auto;
      }
      .record-panel {
        border: 1px solid var(--pnds-creation-line);
        border-radius: 8px;
        padding: 18px;
        margin-block-start: 20px;
        max-inline-size: 440px;
        background: var(--pnds-creation-raised);
      }
      .record-panel h3 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      .record-time {
        font-size: 28px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -1px;
        margin-block: 20px 8px;
      }
      .record-detail {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-block-end: 20px;
        color: var(--pnds-text-secondary);
      }
      .record-detail i {
        inline-size: 7px;
        block-size: 7px;
        border-radius: 50%;
        background: var(--pnds-danger);
      }
      .confirm-surface {
        margin: 25px auto;
        max-inline-size: 390px;
        border: 1px solid var(--pnds-creation-line);
        border-radius: 10px;
        padding: 22px;
        background: var(--pnds-creation-raised);
        box-shadow: var(--pnds-popover-shadow);
      }
      .confirm-surface h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .confirm-surface p {
        color: var(--pnds-text-secondary);
        margin: 0 0 20px;
      }
      .confirm-actions {
        display: flex;
        justify-content: end;
        gap: 8px;
        flex-wrap: wrap;
      }
      .feedback-slot {
        min-block-size: 70px;
        margin: 0 12px;
        padding-block: 12px;
        border-block-end: 1px solid var(--pnds-creation-hair);
      }
      .feedback-slot.empty {
        border-color: transparent;
      }
      .feedback-line {
        display: flex;
        gap: 8px;
        align-items: center;
        min-block-size: 20px;
        color: var(--pnds-text-secondary);
        font-size: 11px;
      }
      .feedback-copy {
        min-inline-size: 0;
      }
      .feedback-line strong {
        font-weight: 500;
        color: var(--pnds-text);
      }
      .feedback-detail {
        font-size: 10px;
        color: var(--pnds-text-secondary);
        margin-block-start: 3px;
      }
      [data-tone='success'] {
        color: var(--pnds-success);
      }
      [data-tone='error'] {
        color: var(--pnds-danger);
      }
      .feedback-line[data-tone='error'] strong {
        color: var(--pnds-danger);
      }
      .feedback-line[data-tone='success'] strong {
        color: var(--pnds-success);
      }
      .feedback-line .retry {
        margin-inline-start: auto;
        font-size: 11px;
        min-block-size: 27px;
      }
      .spinner {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .progress-track {
        position: relative;
        overflow: hidden;
        block-size: 3px;
        margin-block: 10px 7px;
        background: var(--pnds-creation-line);
        border-radius: 3px;
      }
      .progress-fill {
        block-size: 100%;
        background: var(--pnds-accent-text);
      }
      .progress-track.indeterminate .progress-fill {
        inline-size: 28%;
        animation: travel 1.7s ease-in-out infinite;
      }
      @keyframes travel {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(460%);
        }
      }
      .toast-stack {
        position: absolute;
        z-index: 5;
        inset-inline-end: 16px;
        inset-block-end: 64px;
        inline-size: min(400px, calc(100% - 32px));
        pointer-events: none;
      }
      .flow-toast {
        --toast-tone: var(--pnds-text-secondary);
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        align-items: start;
        gap: 10px;
        padding: 14px;
        padding-inline-end: 35px;
        background: var(--pnds-card);
        border: 1px solid var(--pnds-border);
        border-radius: 14px;
        box-shadow: var(--pnds-popover-shadow);
        pointer-events: auto;
        overflow-wrap: anywhere;
      }
      .flow-toast[data-tone='success'] {
        --toast-tone: var(--pnds-success);
      }
      .flow-toast[data-tone='error'] {
        --toast-tone: var(--pnds-danger);
      }
      .toast-icon {
        display: grid;
        place-items: center;
        inline-size: 30px;
        block-size: 30px;
        border-radius: 9px;
        color: var(--toast-tone);
        background: color-mix(in srgb, var(--toast-tone) 10%, var(--pnds-card));
      }
      .toast-icon svg {
        inline-size: 17px;
        block-size: 17px;
      }
      .toast-title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.45;
        color: var(--pnds-text);
      }
      .toast-description {
        margin-block-start: 4px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--pnds-text-secondary);
      }
      .toast-close {
        position: absolute;
        inset-inline-end: 7px;
        inset-block-start: 7px;
        inline-size: 24px;
        min-block-size: 24px;
        padding: 4px;
        border: 0;
        background: transparent;
      }
      .toast-close svg {
        inline-size: 13px;
        block-size: 13px;
      }
      .toast-action {
        margin-block-start: 9px;
        min-block-size: 27px;
        font-size: 11px;
      }
      .review-controls {
        max-inline-size: 1424px;
        margin: 16px 28px 104px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .review-options,
      .demo-options {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
      }
      .review-options label,
      .demo-options label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: var(--pnds-text-secondary);
      }
      .review-options select {
        max-inline-size: 220px;
      }
      .demo-options button {
        min-block-size: 27px;
        font-size: 11px;
      }
      .demo-options .state-readout {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--pnds-text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .review-note {
        font-size: 11px;
        color: var(--pnds-text-secondary);
        margin: 0;
        max-inline-size: 90ch;
      }
      .variant-dock {
        position: fixed;
        z-index: 10;
        inset-block-end: 18px;
        inset-inline-start: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px;
        border: 1px solid var(--pnds-border);
        border-radius: 12px;
        box-shadow: var(--pnds-popover-shadow);
        background: var(--pnds-card);
        max-inline-size: calc(100% - 24px);
      }
      .variant-dock button {
        border: 0;
        background: transparent;
        min-inline-size: 32px;
      }
      .variant-dock .variant-option {
        padding-inline: 13px;
        font-size: 12px;
      }
      .variant-dock .variant-option[aria-pressed='true'] {
        background: var(--pnds-selection);
        font-weight: 600;
      }
      .variant-dock .divider {
        block-size: 20px;
        inline-size: 1px;
        background: var(--pnds-creation-line);
      }
      [data-color-theme='brutal']
        :is(
          button,
          input,
          select,
          .app-window,
          .flow-toast,
          .toast-icon,
          .variant-dock,
          .record-panel,
          .confirm-surface,
          .node-dot,
          .version-node,
          .branch-pill,
          .progress-track,
          .tree-row
        ) {
        border-radius: 0;
      }
      [data-color-theme='brutal']
        :is(.flow-toast, .variant-dock, .confirm-surface) {
        border: 2px solid #000;
        box-shadow: 4px 4px 0 #000;
      }
      [data-color-theme='brutal'] .app-window {
        box-shadow: 6px 6px 0 #000;
      }
      [data-color-theme='brutal'] .progress-track.indeterminate .progress-fill {
        animation-timing-function: linear;
      }
      @media (min-width: 1480px) {
        .app-window {
          margin-inline: auto;
        }
      }
      @media (max-width: 1120px) {
        .app-window {
          grid-template-columns: 190px minmax(0, 1fr) 190px;
        }
        .toolbar input {
          inline-size: 120px;
        }
      }
      @media (max-width: 860px) {
        .app-window {
          grid-template-columns: 176px minmax(0, 1fr);
        }
        .preview {
          display: none;
        }
        .review-heading {
          align-items: start;
          flex-direction: column;
          gap: 5px;
        }
        .app-window {
          block-size: 530px;
        }
      }
      @media (max-width: 580px) {
        .app-window {
          margin-inline: 12px;
          grid-template-columns: minmax(0, 1fr);
          min-block-size: 480px;
        }
        .sidebar {
          display: none;
        }

        document.documentElement.lang = state.language
        document.documentElement.dataset.colorTheme = state.theme
        document.documentElement.dataset.variant = state.variant
        document.title = `PNDS · ${t('等待反馈样式核对')}`
        document.querySelectorAll('[data-i18n]').forEach(node => {
          node.textContent = t(node.dataset.i18n)
        })
        $('review-controls').setAttribute('aria-label', t('样式核对'))
        document
          .querySelector('.variant-dock')
          .setAttribute('aria-label', t('方案'))
        $('variant-prev').setAttribute('aria-label', t('上一个方案'))
        $('variant-next').setAttribute('aria-label', t('下一个方案'))
        $('variant-prev').innerHTML = icon('left')
        $('variant-next').innerHTML = icon('chevron')
        $('scene').innerHTML = Object.entries(scenes)
          .map(
            ([key, value]) =>
              `<option value="${key}">${tx(value.label)}</option>`
          )
          .join('')
        $('scene').value = state.scene
        $('theme').value = state.theme
        $('language').value = state.language
        $('speed').value = state.speed
        document
          .querySelectorAll('.variant-option')
          .forEach(node =>
            node.setAttribute(
              'aria-pressed',
              String(node.dataset.variant === state.variant)
            )
          )
        $('variant-note').textContent = t(
          {
            A: '按钮与就地状态行使用现有样式，适合保存、切换与设置操作。',
            B: '复用 App 现有通知：同一条提示从进行中变为结果，关闭通知不取消操作。',
            C: '细进度条为新增样式提案。百分比只用于有真实计量的场景。',
          }[state.variant]
        )
      }
      function action() {
        return `<button class="primary action-button" id="product-action"></button>`
      }
      function slot() {
        return '<div class="feedback-slot empty" id="feedback-slot"><div id="inline-live" role="status" aria-atomic="true"></div><div id="inline-meter"></div></div>'
      }
      function gitPage() {
        return `<div class="toolbar"><h2>${icon('branch')}${tx('版本历史')}</h2><span class="muted" style="font-size:10px">${tx('没有远程同步')}</span><span class="spacer"></span><input id="version-name" aria-label="${tx('版本名称')}" maxlength="120" value="${esc(state.name)}"/>${action()}</div>${slot()}<div class="git-body"><div class="git-history"><div class="section-label">${tx('最近版本')}<span class="branch-pill">main</span></div><div class="version-node active" id="current-version"><span class="node-dot"></span><div><strong>${tx('尚未保存的修改')}</strong><small>score.js · audio/main.scd</small></div></div><div class="version-node"><span class="node-dot"></span><div><strong>${tx('调整音色与演奏逻辑')}</strong><small>10:42 · a9e0d23</small></div></div><div class="version-node"><span class="node-dot"></span><div><strong>${tx('初始工程')}</strong><small>09:16 · 5f8b2a1</small></div></div></div><div class="changes"><div class="section-label" id="change-label">${tx('当前修改')}<span>2 ${tx('文件')}</span></div><div class="file-change"><span>M</span><span>score.js</span><small>+18 −6</small></div><div class="file-change"><span>M</span><span>audio/main.scd</span><small>+7 −3</small></div><div class="diff-snippet"><div>124 &nbsp; const voice = {</div><div class="added">125 + &nbsp; release: 2.4,</div><div class="added">126 + &nbsp; density: 0.68,</div><div>127 &nbsp; };</div></div></div></div>`
      }
      function renderContext() {
        const settings = ['dns', 'update'].includes(state.scene)
        $('sidebar').innerHTML =
          `<div class="project-name">runes ${icon('down')}</div><div class="side-label">${tx(settings ? '设置' : '文件')}</div>${(settings ? ['通用', '模型服务', '演出 DNS', '关于'] : ['manifest.json', 'README.md', 'score.js', 'audio', 'main.scd', 'modules', 'docs']).map((name, index) => `<div class="tree-row ${name === 'main.scd' ? 'indent' : ''} ${(settings ? name === (state.scene === 'dns' ? '演出 DNS' : '关于') : index === 2) ? 'selected' : ''}">${icon(settings ? 'network' : ['audio', 'modules', 'docs'].includes(name) ? 'folder' : 'file')}<span>${settings ? tx(name) : esc(name)}</span>${!settings && ['score.js', 'main.scd'].includes(name) ? '<small>M</small>' : ''}</div>`).join('')}<div class="side-label">${icon('branch')}main</div>`
        $('workspace-tabs').innerHTML =
          `<span class="tab">${icon('chat')}${tx('讨论')}</span><span class="tab">${icon('file')}score.js</span><span class="tab active">${icon(scenes[state.scene].icon)}${tx(['save', 'switch'].includes(state.scene) ? '版本' : scenes[state.scene].label)}</span>`
        let content
        if (state.scene === 'save') content = gitPage()
        if (state.scene === 'switch')
          content = `<div class="toolbar"><h2>${icon('branch')}${tx('版本历史')}</h2><span class="spacer"></span><span class="branch-pill">main</span></div><div class="confirm-surface" role="group" aria-label="${tx('切换版本')}"><h3>${tx('切换到所选版本')}</h3><p>${tx('先保存当前修改，再停止测试并切换版本。')}</p><div class="file-change">${icon('branch')} a9e0d23 · ${tx('调整音色与演奏逻辑')}</div><div style="block-size:20px"></div><div class="confirm-actions"><button id="cancel-switch">${tx('取消')}</button>${action()}</div></div>${slot()}`
        if (['install', 'import'].includes(state.scene))
          content = `<div class="content-page"><h2>${tx(state.scene === 'install' ? '安装工程包' : '导入演出文件夹')}</h2><p>${state.scene === 'install' ? 'runes-1.7.0.pnds' : tx('周末演出') + ' · 8 ' + tx('工程')}</p>${action()}<div class="project-list">${['runes', 'III', 'Old Pond'].map((name, index) => `<div>${icon('package')}<span>${name}</span><small>${index + 1 < 3 ? '1.7.0' : '1.6.5'}</small></div>`).join('')}</div></div>${slot()}`
        if (state.scene === 'record')
          content = `<div class="content-page"><h2>${tx('演奏记录')}</h2><p>runes</p><div class="record-panel"><h3>${tx('当前轮次')} 03</h3><div class="record-time">02:46.380</div><div class="record-detail"><i></i><span id="record-state">${tx('正在录制')}</span></div><div class="file-change">${tx('演奏者')} 1, 2, 3 <small>${tx('叠加排练')}</small></div><div style="block-size:20px"></div>${action()}</div></div>${slot()}`
        if (state.scene === 'dns')
          content = `<div class="content-page"><h2>${tx('演出 DNS')}</h2><p>${tx('让现场设备通过演出域名访问工程。')}</p><div class="settings-row"><div><strong>${tx('启用后台 DNS 服务')}</strong><small>${tx('首次启用需系统授权')}</small></div>${action()}</div><dl class="facts"><dt>${tx('服务状态')}</dt><dd id="dns-fact">${tx('未启用')}</dd><dt>${tx('演出域名')}</dt><dd>pnds.local</dd><dt>${tx('映射地址')}</dt><dd class="mono">192.168.1.24</dd></dl></div>${slot()}`
        if (state.scene === 'update')
          content = `<div class="content-page"><h2>${tx('关于')}</h2><p>PNDS App</p><div class="settings-row"><strong>${tx('版本')}</strong><span>1.7.0-beta.2</span></div><div style="block-size:20px"></div>${action()}</div>${slot()}`
        if (state.scene === 'handoff')
          content = `<div class="content-page"><h2>${tx('交接文件')}</h2><p>${tx('采集当前保存版，建立比较起点。')}</p>${action()}<div class="project-list"><div>${icon('file')}score.js <small>12 KiB</small></div><div>${icon('file')}audio/main.scd <small>28 KiB</small></div><div>${icon('file')}resources/strings.wav <small>8 MiB</small></div></div></div>${slot()}`
        $('scene-content').innerHTML = content
        $('product-action').addEventListener('click', start)
        $('version-name')?.addEventListener('input', event => {
          state.name = event.target.value
        })
        $('cancel-switch')?.addEventListener('click', () => changeScene('save'))
        renderFeedback()
      }
      const duration = () =>
        state.scene === 'import' ? 10000 : state.scene === 'save' ? 8000 : 6000
      function snapshot() {
        const scene = scenes[state.scene]
        const fraction =
          state.status === 'success'
            ? 1
            : Math.min(0.999, state.elapsed / duration())
        const phaseIndex = Math.min(
          scene.steps.length - 1,
          Math.floor(fraction * scene.steps.length)
        )
        const saved =
          state.scene === 'save' && (state.saved || state.elapsed >= 6000)
        if (saved) state.saved = true
        const phase = saved ? '正在刷新版本列表…' : scene.steps[phaseIndex]
        const count =
          state.status === 'success' ? 8 : Math.min(7, Math.floor(fraction * 8))
        const fileBytes = Math.round(
          (fraction < 0.15 ? fraction / 0.15 : (fraction - 0.15) / 0.85) *
            (fraction < 0.15 ? 28 : 8192)
        )
        const path =
          fraction < 0.15 ? 'audio/main.scd' : 'resources/strings.wav'
        const total = fraction < 0.15 ? 28 : 8192
        let detail = t(phase)
        if (state.scene === 'import')
          detail = t('正在导入第 {current} / {total} 个工程：{name}', {
            current: Math.min(8, count + 1),
            total: 8,
            name: [
              'runes',
              'III',
              'Old Pond',
              'Tide',
              'Air',
              'Frame',
              'Haze',
              'Echo',
            ][Math.min(7, count)],
          })
        if (state.scene === 'handoff')
          detail = `${path} · ${Math.min(fileBytes, total)} / ${total} KiB`
        let title =
          state.status === 'idle'
            ? t('等待中')
            : t(saved ? scene.success : scene.busy)
        if (state.status === 'success') {
          title = t(scene.success)
          detail =
            state.scene === 'save'
              ? `${state.name} · main`
              : state.scene === 'record'
                ? t('轮次 03 已写入演奏记录。')
                : state.scene === 'import'
                  ? t('已导入 {count} / {total} 个工程', { count: 8, total: 8 })
                  : t('操作已完成')
        }
        if (state.status === 'error') {
          title = t(saved ? '版本已保存，列表刷新失败' : '操作未完成')
          detail = t(saved ? '请刷新版本列表，无需重复保存。' : scene.error)
        }
        return {
          title,
          detail,
          phase,
          saved,
          count,
          path,
          fileBytes,
          total,
          fraction,
        }
      }
      function meter(data) {
        if (state.status !== 'running') return ''
        if (state.scene === 'handoff')
          return `<div class="progress-track" role="progressbar" aria-label="${tx('当前文件进度')}" aria-valuemin="0" aria-valuemax="${data.total}" aria-valuenow="${Math.min(data.total, data.fileBytes)}"><div class="progress-fill" style="inline-size:${Math.min(100, (data.fileBytes / data.total) * 100)}%"></div></div><div class="feedback-detail">${tx('当前文件进度')} · ${tx('已读取 {count} 个文件', { count: data.fraction < 0.15 ? 1 : 2 })}</div>`
        if (state.scene === 'import')
          return `<div class="progress-track" role="progressbar" aria-label="${tx('按工程数量计量')}" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${data.count}"><div class="progress-fill" style="inline-size:${(data.count / 8) * 100}%"></div></div><div class="feedback-detail">${tx('已导入 {count} / {total} 个工程', { count: data.count, total: 8 })}</div>`
        return `<div class="progress-track indeterminate" role="progressbar" aria-label="${tx('正在处理，进度未知')}"><div class="progress-fill"></div></div><div class="feedback-detail">${tx('进度未知')}</div>`
      }
      function renderFeedback() {
        const data = snapshot()
        const running = state.status === 'running'
        const runtimeActive =
          state.scene === 'record' ||
          (state.scene === 'switch' &&
            state.status !== 'success' &&
            state.elapsed < 3000)
        $('transport-state').textContent = t(
          runtimeActive ? '正在运行' : '就绪'
        )
        document.querySelector('.preview-note').textContent = t(
          runtimeActive ? '运行中的工程' : '未启动测试'
        )
        const tone =
          state.status === 'success'
            ? 'success'
            : state.status === 'error'
              ? 'error'
              : 'neutral'
        const symbol = icon(
          running ? 'spinner' : state.status === 'error' ? 'error' : 'check',
          running ? 'spinner' : ''
        )
        const button = $('product-action')
        button.disabled = running || state.status === 'success'
        button.setAttribute('aria-busy', String(running))
        setMarkup(
          button,
          (running
            ? icon('spinner', 'spinner')
            : icon(scenes[state.scene].icon)) +
            tx(
              running
                ? data.saved
                  ? '正在刷新…'
                  : scenes[state.scene].busy
                : state.status === 'error'
                  ? data.saved
                    ? '刷新列表'
                    : '重试'
                  : scenes[state.scene].action
            )
        )
        if ($('version-name'))
          $('version-name').disabled = running || state.saved
        if ($('cancel-switch')) $('cancel-switch').disabled = running
        const slotNode = $('feedback-slot')
        const inline = $('inline-live')
        const hasFeedback = state.status !== 'idle' && state.variant !== 'B'
        slotNode.classList.toggle('empty', !hasFeedback)
        const retry =
          state.status === 'error'
            ? `<button class="retry" data-retry>${tx(data.saved ? '刷新列表' : '重试')}</button>`
            : ''
        const liveDetail =
          state.scene === 'handoff' && running ? t(data.phase) : data.detail
        const inlineHtml = hasFeedback
          ? `<div class="feedback-line" data-tone="${tone}">${symbol}<div class="feedback-copy"><strong>${esc(data.title)}</strong>${liveDetail ? `<div class="feedback-detail">${esc(liveDetail)}</div>` : ''}</div>${retry}</div>`
          : ''
        // Update the live region only on a meaningful stage/result change.
        if (inline.dataset.snapshot !== inlineHtml) {
          inline.innerHTML = inlineHtml
          inline.dataset.snapshot = inlineHtml
        }
        setMarkup(
          $('inline-meter'),
          hasFeedback && (state.variant === 'C' || state.scene === 'handoff')
            ? (state.scene === 'handoff' && running
                ? `<div class="feedback-detail">${esc(data.detail)}</div>`
                : '') + meter(data)
            : ''
        )
        const showToast =
          state.variant === 'B' &&
          state.status !== 'idle' &&
          !state.toastDismissed
        if (!showToast) $('toast-stack').replaceChildren()
        else {
          if (!$('flow-toast')) {
            $('toast-stack').innerHTML =
              `<aside class="flow-toast" id="flow-toast"><span class="toast-icon" id="toast-icon"></span><div><div role="status" aria-atomic="true"><div class="toast-title" id="toast-title"></div><div class="toast-description" id="toast-description"></div></div><div id="toast-meter"></div><button class="primary toast-action" id="toast-retry" hidden></button></div><button class="toast-close" id="toast-close">${icon('close')}</button></aside>`
            $('toast-close').addEventListener('click', () => {
              state.toastDismissed = true
              renderFeedback()
            })
            $('toast-retry').addEventListener('click', start)
          }
          $('flow-toast').dataset.tone = tone
          $('flow-toast').setAttribute('aria-label', t('操作状态'))
          setMarkup($('toast-icon'), symbol)
          if ($('toast-title').textContent !== data.title)
            $('toast-title').textContent = data.title
          if ($('toast-description').textContent !== liveDetail)
            $('toast-description').textContent = liveDetail
          $('toast-close').setAttribute('aria-label', t('关闭通知'))
          setMarkup(
            $('toast-meter'),
            state.scene === 'handoff' && running
              ? `<div class="feedback-detail">${esc(data.detail)}</div>${meter(data)}`
              : ''
          )
          $('toast-retry').hidden = state.status !== 'error'
          $('toast-retry').textContent = t(data.saved ? '刷新列表' : '重试')
        }
        document.querySelectorAll('[data-retry]').forEach(node => {
          node.onclick = start
        })
        if ($('dns-fact'))
          $('dns-fact').textContent = t(
            state.status === 'success'
              ? '已启用'
              : state.status === 'running'
                ? '正在读取状态…'
                : '未启用'
          )
        if ($('record-state'))
          $('record-state').textContent = t(
            state.status === 'success'
              ? '轮次已保存'
              : running
                ? '正在保存轮次…'
                : state.status === 'error'
                  ? '记录仍待保存'
                  : '正在录制'
          )
        if ($('current-version') && state.saved)
          $('current-version').innerHTML =
            `<span class="node-dot"></span><div><strong>${esc(state.name)}</strong><small>main · ${tx('已保存')}</small></div>`
        if ($('change-label') && state.saved)
          $('change-label').innerHTML =
            `${tx('此版本的更改')}<span>2 ${tx('文件')}</span>`
        $('pause').disabled = !running
        $('pause').innerHTML =
          icon(state.paused ? 'play' : 'pause') +
          tx(state.paused ? '继续演示' : '暂停演示')
        $('complete').disabled = !running
        $('fail').disabled = !running
        $('state-readout').textContent =
          `${t('演示状态')} · ${t({ idle: '等待中', running: state.paused ? '演示已暂停' : '进行中', success: '成功', error: '失败' }[state.status])} · ${state.status === 'running' ? t(data.phase) : state.status === 'idle' ? t('尚未开始') : data.title}`
      }
      function stopTimer() {
        clearTimeout(state.timer)
        state.timer = null
      }
      function tick() {
        const now = performance.now()
        if (!state.paused && state.speed !== 'hold')
          state.elapsed +=
            (now - state.lastTick) / (state.speed === 'slow' ? 3 : 1)
        state.lastTick = now
        if (state.elapsed >= duration()) {
          finish('success')
          return
        }
        renderFeedback()
        state.timer = setTimeout(tick, 250)
      }
      function start() {
        if (state.status === 'running') return
        stopTimer()
        state.elapsed = state.saved && state.scene === 'save' ? 6000 : 0
        state.status = 'running'
        state.paused = false
        state.toastDismissed = false
        state.lastTick = performance.now()
        renderFeedback()
        state.timer = setTimeout(tick, 250)
      }
      function finish(result) {
        if (state.status !== 'running') return
        snapshot()
        stopTimer()
        state.status = result
        state.paused = false
        state.toastDismissed = false
        if (result === 'success' && state.scene === 'save') state.saved = true
        renderFeedback()
      }
      function reset() {
        stopTimer()
        Object.assign(state, {
          status: 'idle',
          elapsed: 0,
          paused: false,
          saved: false,
          toastDismissed: false,
        })
        renderContext()
      }
      function changeScene(scene) {
        state.scene = scene
        reset()
        translateStatic()
        syncUrl()
      }
      function changeVariant(variant) {
        state.variant = variant
        state.toastDismissed = false
        translateStatic()
        renderFeedback()
        syncUrl()
      }
      $('scene').addEventListener('change', event =>
        changeScene(event.target.value)
      )
      $('theme').addEventListener('change', event => {
        state.theme = event.target.value
        translateStatic()
        syncUrl()
      })
      $('language').addEventListener('change', event => {
        state.language = event.target.value
        translateStatic()
        renderContext()
        syncUrl()
      })
      $('speed').addEventListener('change', event => {
        state.speed = event.target.value
      })
      $('pause').addEventListener('click', () => {
        state.paused = !state.paused
        state.lastTick = performance.now()
        renderFeedback()
      })
      $('complete').addEventListener('click', () => finish('success'))
      $('fail').addEventListener('click', () => finish('error'))
      $('reset').addEventListener('click', reset)
      document
        .querySelectorAll('.variant-option')
        .forEach(node =>
          node.addEventListener('click', () =>
            changeVariant(node.dataset.variant)
          )
        )
      function cycle(direction) {
        changeVariant(
          ['A', 'B', 'C'][
            (['A', 'B', 'C'].indexOf(state.variant) + direction + 3) % 3
          ]
        )
      }
      $('variant-prev').addEventListener('click', () => cycle(-1))
      $('variant-next').addEventListener('click', () => cycle(1))
      document.addEventListener('keydown', event => {
        if (
          event.target.closest(
            'input,textarea,select,button,[contenteditable]'
          ) ||
          event.altKey ||
          event.metaKey ||
          event.ctrlKey
        )
          return
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault()
          cycle(event.key === 'ArrowLeft' ? -1 : 1)
        }
      })
      window.addEventListener('pagehide', stopTimer)
      translateStatic()
      renderContext()
    </script>
  </body>
</html>
