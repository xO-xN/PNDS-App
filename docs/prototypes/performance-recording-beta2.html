<!doctype html>
<!-- THROWAWAY UI PROTOTYPE: compare an anchored popover (A), a right drawer (B),
     and a centered dialog (C) inside the existing PNDS desktop shell.
     ?variant=A|B|C&mode=creation|performance&project=iii|runes&theme=pond|sand|stage|brutal
     Memory-only simulation. No filesystem, network, audio, devices, Tauri or localStorage.
     Locale JSON is embedded for offline use; the sources live in /locales.
     No number monitoring, readiness checklist, playback pause, seek, or track editor. -->
<html lang="zh-CN" data-theme="pond" data-variant="A">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNDS</title>
    <style>
      :root {
        color-scheme: light;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          'PingFang SC',
          sans-serif;
        --shell: #dce4ec;
        --nav: #e7edf3;
        --toolbar: #f0f4f8;
        --workspace: #fcfdff;
        --raised: #fff;
        --bar: #e5edf4;
        --line: #cbd5df;
        --ink: #293541;
        --muted: #495b68;
        --pill: #e6edf3;
        --hover: #dbe5ed;
        --selection: #d4e3f0;
        --accent: #285a8d;
        --action: #82b4d7;
        --action-ink: #10334c;
        --danger: #9d3043;
        --good: #30634f;
        --warning: #755015;
        --shadow: 0 14px 42px #182e4524, 0 2px 8px #182e4514;
        --radius: 12px;
      }
      [data-theme='sand'] {
        --shell: #d7cdbc;
        --nav: #e5dccd;
        --toolbar: #f0e9dd;
        --workspace: #fbf8f1;
        --raised: #fffdf8;
        --bar: #ebe3d5;
        --line: #c5b9a5;
        --ink: #352e24;
        --muted: #60523f;
        --pill: #e5daca;
        --hover: #daceba;
        --selection: #ddc6a5;
        --accent: #6f481e;
        --action: #cda16a;
        --action-ink: #38250e;
        --danger: #93332b;
        --good: #315943;
        --warning: #6b4918;
      }
      [data-theme='stage'] {
        color-scheme: dark;
        --shell: #111817;
        --nav: #192220;
        --toolbar: #222e2a;
        --workspace: #26332e;
        --raised: #34453d;
        --bar: #1b2722;
        --line: #40564b;
        --ink: #e7ece9;
        --muted: #adbbb4;
        --pill: #2c3432;
        --hover: #35403b;
        --selection: #354d41;
        --accent: #b7d8c6;
        --action: #365e47;
        --action-ink: #eef8f1;
        --danger: #f4a3ac;
        --good: #a5c8b6;
        --warning: #e4c388;
        --shadow: 0 16px 46px #0006, 0 2px 8px #0004;
      }
      [data-theme='brutal'] {
        --shell: #e8c95f;
        --nav: #f3d77a;
        --toolbar: #f8ebbb;
        --workspace: #fffdf6;
        --raised: #fff;
        --bar: #f2d787;
        --line: #24231f;
        --ink: #000;
        --muted: #4a4028;
        --pill: #ffe58f;
        --hover: #ffd966;
        --selection: #ffedb3;
        --accent: #842708;
        --action: #edc158;
        --action-ink: #24231f;
        --danger: #8e1530;
        --good: #1c4c36;
        --warning: #5a3e0b;
        --radius: 0px;
        --shadow: 4px 4px 0 #24231f;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--shell);
        color: var(--ink);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.42;
        cursor: default;
      }
      button:hover:not(:disabled) {
        background: var(--hover);
      }
      :is(button, select, input, textarea, summary):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      button,
      input,
      select {
        border-radius: 7px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.35px;
      }
      h2 {
        font-size: 15px;
        font-weight: 620;
        letter-spacing: -0.2px;
      }
      h3 {
        font-size: 12px;
        font-weight: 600;
      }
      p {
        line-height: 1.6;
      }
      small,
      .muted {
        color: var(--muted);
      }
      small {
        font-size: 11px;
        line-height: 1.5;
      }
      .icon {
        width: 17px;
        height: 17px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .numeral {
        font-variant-numeric: tabular-nums;
      }
      .icon-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 30px;
        height: 30px;
        flex: none;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 32px;
        padding: 7px 12px;
        border: 1px solid var(--line);
        background: var(--raised);
        font-size: 12px;
      }
      .button.primary {
        background: var(--action);
        color: var(--action-ink);
        border-color: color-mix(in srgb, var(--action-ink) 40%, var(--line));
        font-weight: 600;
      }
      .button.record-action {
        color: var(--danger);
        font-weight: 600;
      }
      .button.record-action .record-dot {
        background: var(--danger);
      }
      .button.danger {
        color: var(--danger);
      }
      .text-button {
        padding: 6px 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .wide {
        width: 100%;
      }
      .record-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--good);
        flex: none;
      }
      .app-window {
        position: absolute;
        inset: 16px 20px var(--review-space, 142px);
        min-height: 500px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--workspace);
        box-shadow: 0 12px 38px #13273318;
        overflow: hidden;
      }
      .titlebar {
        height: 32px;
        background: var(--toolbar);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
        padding-inline: 13px;
        font-size: 11px;
      }
      .traffic {
        display: flex;
        gap: 7px;
        margin-inline-end: 6px;
      }
      .traffic i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #ff6057;
        border: 1px solid #0001;
      }
      .traffic i:nth-child(2) {
        background: #febc2e;
      }
      .traffic i:nth-child(3) {
        background: #28c840;
      }
      .title-project {
        font-weight: 550;
      }
      .title-meta {
        color: var(--muted);
      }
      .title-right {
        margin-inline-start: auto;
        color: var(--muted);
      }
      .work-area {
        position: absolute;
        inset: 32px 0 50px;
        display: flex;
        min-height: 0;
      }
      .file-sidebar {
        width: 205px;
        padding: 17px 12px;
        background: var(--nav);
        border-inline-end: 1px solid var(--line);
        flex: none;
        overflow: auto;
      }
      .file-sidebar h3 {
        margin: 0 8px 17px;
      }
      .file-entry {
        display: flex;
        gap: 8px;
        padding: 9px 8px;
        border-radius: 6px;
        line-height: 1.4;
        font-size: 11px;
      }
      .file-entry.selected {
        background: var(--selection);
      }
      .file-entry .icon {
        width: 14px;
        height: 14px;
      }
      .file-caption {
        color: var(--muted);
        font-size: 10px;
        margin-block-start: 2px;
      }
      .editor {
        flex: 1;
        min-width: 240px;
        display: flex;
        flex-direction: column;
        border-inline-end: 1px solid var(--line);
        background: var(--workspace);
      }
      .tabs {
        height: 40px;
        padding-inline: 16px;
        display: flex;
        gap: 20px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: var(--toolbar);
        font-size: 12px;
      }
      .tab-active {
        height: 100%;
        display: flex;
        align-items: center;
        border-bottom: 2px solid var(--accent);
      }
      .discussion {
        padding: 34px 28px;
        overflow: auto;
        flex: 1;
      }
      .discussion .user-message {
        margin: 6px 0 30px 18px;
        padding: 14px 16px;
        background: var(--pill);
        border-radius: 10px;
        line-height: 1.7;
        font-size: 12px;
      }
      .discussion h2 {
        line-height: 1.6;
        font-size: 17px;
        margin-bottom: 13px;
      }
      .discussion p {
        font-size: 12px;
        margin-bottom: 13px;
      }
      .assistant-label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 9px;
      }
      .composer {
        margin: 16px;
        padding: 12px;
        border: 1px solid var(--line);
        background: var(--raised);
        border-radius: 10px;
      }
      .composer textarea {
        width: 100%;
        height: 44px;
        resize: none;
        border: 0;
        outline: none;
        background: transparent;
        font-size: 12px;
      }
      .composer .row {
        justify-content: space-between;
        margin-top: 7px;
      }
      .score-pane {
        width: 45%;
        min-width: 305px;
        display: flex;
        flex-direction: column;
        background: var(--workspace);
      }
      .score-heading {
        height: 40px;
        padding-inline: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        background: var(--toolbar);
        font-size: 11px;
      }
      .score-canvas {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: var(--workspace);
      }
      .score-art {
        position: absolute;
        inset: 18% 8% 16%;
        width: 84%;
        height: 66%;
        overflow: visible;
      }
      .score-art path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .piece-title {
        position: absolute;
        inset-block-start: 25px;
        inset-inline: 0;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1px;
      }
      .piece-subtitle {
        position: absolute;
        inset-block-end: 28px;
        inset-inline: 0;
        display: flex;
        justify-content: center;
        gap: 22px;
        color: var(--muted);
        font-size: 10px;
      }
      .actor-key {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .actor-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: var(--actor-color, var(--accent));
      }
      .score-transport {
        height: 48px;
        padding: 7px 14px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 11px;
      }
      .score-transport input {
        min-width: 0;
        width: 100%;
        accent-color: var(--accent);
      }
      .score-transport .button {
        flex: none;
        white-space: nowrap;
        min-height: 27px;
        padding: 4px 8px;
      }
      .score-locked {
        margin-inline-start: auto;
        max-width: 53%;
        font-size: 10px;
        line-height: 1.5;
        text-align: end;
      }
      .host-sidebar {
        display: none;
        position: absolute;
        z-index: 2;
        inset: 14px auto 14px 14px;
        width: 300px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--nav) 96%, transparent);
        box-shadow: 0 5px 20px #13273312;
        padding: 21px 16px;
      }
      .host-role {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 22px;
      }
      .host-sidebar h2 {
        margin-bottom: 16px;
        font-size: 22px;
      }
      .project-card {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 14px;
        background: var(--raised);
        margin-bottom: 9px;
        font-size: 12px;
      }
      .project-card.selected {
        border-inline-start: 3px solid var(--accent);
        background: var(--selection);
      }
      .project-card small {
        display: block;
        margin-top: 8px;
      }
      [data-mode='performance'] .host-sidebar {
        display: block;
      }
      [data-mode='performance'] .file-sidebar,
      [data-mode='performance'] .editor {
        display: none;
      }
      [data-mode='performance'] .score-pane {
        width: 100%;
        border: 0;
      }
      [data-mode='performance'] .score-heading {
        padding-inline-start: 334px;
      }
      [data-mode='performance'] .score-canvas {
        margin-inline-start: 310px;
      }
      [data-mode='performance'] .score-transport {
        padding-inline-start: 334px;
      }
      [data-expanded='true'] .file-sidebar,
      [data-expanded='true'] .editor,
      [data-expanded='true'] .host-sidebar {
        display: none;
      }
      [data-expanded='true'] .score-pane {
        width: 100%;
      }
      [data-expanded='true'] .score-canvas {
        margin: 0;
      }
      [data-expanded='true'] .score-heading,
      [data-expanded='true'] .score-transport {
        padding-inline-start: 15px;
      }
      .desktop-bar {
        position: absolute;
        inset: auto 0 0;
        height: 50px;
        border-top: 1px solid var(--line);
        background: var(--bar);
        display: flex;
        align-items: center;
        gap: 7px;
        padding-inline: 12px;
        z-index: 10;
      }
      .session-action {
        min-width: 100px;
        height: 30px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--action-ink) 30%, transparent);
        background: color-mix(in srgb, var(--action) 55%, var(--bar));
        box-shadow:
          inset 0 1px 0 #ffffff70,
          0 1px 2px #13273312;
        font-size: 12px;
        font-weight: 600;
        color: var(--action-ink);
      }
      .desktop-summary {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 4px 8px;
        font-size: 11px;
        white-space: nowrap;
      }
      .desktop-summary[aria-expanded='true'] {
        background: var(--selection);
      }
      .volume {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 155px;
        font-size: 10px;
        margin-inline: 7px;
      }
      .volume input {
        width: 90px;
        min-width: 0;
        accent-color: var(--accent);
      }
      .bar-spacer {
        flex: 1;
      }
      .record-trigger {
        border: 1px solid transparent;
      }
      .record-trigger.active {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 30%, transparent);
        background: var(--raised);
      }
      .record-trigger.playback {
        color: var(--accent);
      }
      .record-trigger .status-time {
        min-width: 35px;
      }
      .mode-switch {
        height: 30px;
        min-width: 96px;
        padding-inline: 20px 13px;
        border-radius: 0 999px 999px 0;
        background: var(--action);
        color: var(--action-ink);
        clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .mode-switch.pending {
        min-width: 160px;
      }
      .feature-root {
        position: absolute;
        inset: 32px 0 50px;
        pointer-events: none;
        z-index: 20;
      }
      .record-panel {
        pointer-events: auto;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .record-panel h2:focus {
        outline: none;
      }
      .panel-header {
        min-height: 56px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }
      .panel-header h2 {
        flex: 1;
        min-width: 0;
      }
      .panel-project {
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
        font-weight: 400;
      }
      .panel-scroll {
        overflow: auto;
        min-height: 0;
        padding: 16px;
        scrollbar-gutter: stable;
      }
      .library-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .library-actions .primary {
        flex: 1;
      }
      .record-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .record-row {
        width: 100%;
        text-align: start;
        display: flex;
        gap: 11px;
        align-items: center;
        padding: 12px 10px;
        border-radius: 8px;
        min-height: 62px;
      }
      .record-row.selected {
        background: var(--selection);
      }
      .record-row .record-symbol {
        width: 29px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--raised);
        flex: none;
        color: var(--accent);
      }
      .record-row strong {
        display: block;
        font-size: 12px;
        font-weight: 550;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .record-row small {
        display: block;
        font-size: 10px;
        margin-top: 3px;
      }
      .record-row .chevron {
        width: 13px;
        color: var(--muted);
        flex: none;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .tag.warning {
        color: var(--warning);
      }
      .detail-view {
        position: relative;
      }
      .detail-heading {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 17px;
      }
      .detail-heading h2 {
        font-size: 18px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        padding-block-start: 2px;
      }
      .detail-heading .date {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .detail-heading input {
        width: 100%;
        border: 1px solid var(--accent);
        background: var(--workspace);
        padding: 6px;
        font-size: 15px;
      }
      .metadata {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding: 11px 0 15px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
      }
      .metadata strong {
        font-size: 19px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .metadata .label {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .detail-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 19px;
      }
      .actor-list {
        margin-top: 9px;
        display: flex;
        flex-direction: column;
      }
      .actor-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        border-bottom: 1px solid
          color-mix(in srgb, var(--line) 55%, transparent);
        font-size: 12px;
      }
      .actor-row .text-button {
        margin-inline-start: auto;
        color: var(--accent);
        font-size: 11px;
      }
      .secondary-info {
        margin-top: 19px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
        font-size: 11px;
      }
      .secondary-info summary {
        cursor: pointer;
        color: var(--muted);
        padding-block: 4px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        font-size: 11px;
        line-height: 1.6;
        padding-block: 6px;
      }
      .info-row span:last-child {
        text-align: end;
        color: var(--muted);
      }
      .notice {
        margin-block: 12px;
        padding: 10px 12px;
        border: 1px solid color-mix(in srgb, var(--warning) 30%, var(--line));
        border-radius: 7px;
        color: var(--warning);
        background: color-mix(in srgb, var(--warning) 5%, var(--raised));
        font-size: 11px;
        line-height: 1.65;
      }
      .operation {
        padding-block: 12px 5px;
      }
      .operation-status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--danger);
        font-size: 12px;
        font-weight: 550;
      }
      .operation-status.playing {
        color: var(--accent);
      }
      .big-clock {
        font-variant-numeric: tabular-nums;
        font-size: 42px;
        line-height: 1.2;
        font-weight: 400;
        letter-spacing: -1.5px;
        margin-block: 17px 8px;
      }
      .clock-total {
        color: var(--muted);
        font-size: 16px;
        letter-spacing: -0.2px;
        padding-inline-start: 8px;
      }
      .operation progress {
        display: block;
        width: 100%;
        height: 4px;
        accent-color: var(--accent);
        margin-block: 16px;
      }
      .operation .support {
        font-size: 12px;
        line-height: 1.7;
        margin-top: 6px;
      }
      .operation .operation-note {
        font-size: 11px;
        line-height: 1.65;
        color: var(--muted);
        margin: 14px 0 22px;
      }
      .operation-footer {
        border-top: 1px solid var(--line);
        margin-top: 20px;
        padding-top: 16px;
      }
      .empty {
        text-align: center;
        padding: 32px 12px;
      }
      .empty .empty-icon {
        color: var(--muted);
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }
      .empty .icon {
        width: 30px;
        height: 30px;
        stroke-width: 1.2;
      }
      .empty h2 {
        margin-bottom: 10px;
      }
      .empty p {
        font-size: 12px;
        color: var(--muted);
        max-width: 280px;
        margin: 0 auto 22px;
      }
      .layout-a {
        position: absolute;
        inset: auto 18px 10px auto;
        width: 370px;
        max-height: calc(100% - 20px);
      }
      .layout-a .panel-scroll {
        max-height: 490px;
      }
      .layout-b {
        position: absolute;
        inset: 0 0 0 auto;
        width: 370px;
        border-radius: 0;
        border-block: 0;
        border-inline-end: 0;
      }
      .layout-b .drawer-library {
        border-bottom: 1px solid var(--line);
        padding: 12px 12px 10px;
        max-height: 215px;
        overflow: auto;
        flex: none;
      }
      .layout-b .record-row {
        min-height: 49px;
        padding-block: 7px;
      }
      .layout-b .record-symbol {
        width: 23px;
        height: 28px;
      }
      .layout-b .library-actions {
        margin: 0 4px 10px;
      }
      .layout-b .panel-scroll {
        flex: 1;
      }
      .feature-root.modal-layer {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #13273326;
        backdrop-filter: blur(2px);
      }
      .layout-c {
        width: 710px;
        max-width: calc(100% - 44px);
        height: 500px;
        max-height: calc(100% - 36px);
      }
      .dialog-columns {
        display: grid;
        grid-template-columns: 244px minmax(0, 1fr);
        flex: 1;
        min-height: 0;
      }
      .dialog-library {
        padding: 14px 10px;
        border-inline-end: 1px solid var(--line);
        background: var(--toolbar);
        overflow: auto;
      }
      .dialog-library .library-actions {
        flex-direction: column;
        margin-inline: 5px;
      }
      .dialog-library .record-row {
        min-height: 58px;
      }
      .dialog-library .record-symbol {
        display: none;
      }
      .layout-c .panel-scroll {
        padding: 21px 24px;
      }
      .context-menu {
        position: absolute;
        z-index: 5;
        inset-inline-end: 0;
        top: 34px;
        min-width: 150px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        box-shadow: var(--shadow);
      }
      .context-menu button {
        width: 100%;
        text-align: start;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px;
        font-size: 12px;
      }
      .confirmation {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: #1327333d;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .confirmation-box {
        width: 385px;
        max-width: calc(100% - 32px);
        padding: 22px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .confirmation-box h2 {
        font-size: 17px;
        margin-bottom: 12px;
      }
      .confirmation-box p {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 20px;
      }
      .confirmation-box .row {
        justify-content: flex-end;
      }
      .toast {
        position: absolute;
        z-index: 45;
        bottom: 67px;
        inset-inline-start: 50%;
        transform: translateX(-50%);
        max-width: 75%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--raised);
        padding: 10px 15px;
        box-shadow: var(--shadow);
        font-size: 12px;
        pointer-events: none;
      }
      .review-bar {
        position: fixed;
        z-index: 100;
        inset: auto 20px 12px;
        max-width: 1240px;
        margin-inline: auto;
        padding: 11px 15px 10px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 11px;
        box-shadow: 0 3px 20px #13273314;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .review-top {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .review-title {
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .variant-switcher {
        display: flex;
        align-items: center;
        gap: 3px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 1px;
        margin-inline-start: 10px;
      }
      .variant-switcher strong {
        font-size: 12px;
        font-weight: 550;
        min-width: 140px;
        text-align: center;
        padding-inline: 5px;
      }
      .review-hint {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .review-settings {
        display: flex;
        gap: 7px 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .review-settings label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .review-settings select {
        padding: 4px 19px 4px 7px;
        height: 26px;
        max-width: 180px;
        border: 1px solid var(--line);
        background: var(--workspace);
        font-size: 11px;
      }
      .review-settings .text-button {
        font-size: 10px;
        padding: 5px;
      }
      .review-state {
        margin-inline-start: auto;
        font-size: 10px;
        color: var(--muted);
        position: relative;
      }
      .review-state summary {
        cursor: pointer;
        padding: 5px;
        white-space: nowrap;
      }
      .review-state pre {
        position: absolute;
        bottom: 31px;
        inset-inline-end: 0;
        width: 380px;
        max-width: 80vw;
        max-height: 310px;
        overflow: auto;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 12px;
        font:
          10px/1.6 ui-monospace,
          monospace;
        color: var(--ink);
      }
      .review-footer {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 10px;
        color: var(--muted);
      }
      .review-footer .demo-state {
        margin-inline-start: auto;
        white-space: nowrap;
      }
      [data-theme='brutal']
        :is(
          button,
          input,
          select,
          .app-window,
          .record-panel,
          .record-row,
          .project-card,
          .host-sidebar,
          .toast,
          .review-bar,
          .review-state pre,
          .confirmation-box,
          .composer
        ) {
        border-radius: 0;
      }
      [data-theme='brutal'] .feature-root {
        backdrop-filter: none;
      }
      [data-theme='brutal'] .session-action,
      [data-theme='brutal'] .mode-switch {
        box-shadow: none;
      }
      @media (max-width: 1100px) {
        .volume {
          width: 100px;
        }
        .volume input {
          width: 55px;
        }
        .desktop-optional-label {
          display: none;
        }
        .file-sidebar {
          width: 170px;
        }
        .discussion {
          padding: 25px 20px;
        }
        .score-pane {
          width: 44%;
          min-width: 270px;
        }
        .host-sidebar {
          width: 270px;
        }
        [data-mode='performance'] .score-heading,
        [data-mode='performance'] .score-transport {
          padding-inline-start: 304px;
        }
        [data-mode='performance'] .score-canvas {
          margin-inline-start: 280px;
        }
        .review-hint {
          display: none;
        }
      }
      @media (max-width: 800px) {
        .app-window {
          inset: 8px 8px var(--review-space, 172px);
          min-height: 400px;
        }
        .review-bar {
          inset: auto 8px 8px;
        }
        .file-sidebar,
        .title-meta,
        .volume,
        .host-sidebar {
          display: none !important;
        }
        .editor {
          min-width: 200px;
        }
        .score-pane {
          width: 50%;
          min-width: 240px;
        }
        .desktop-bar {
          gap: 3px;
          padding-inline: 8px;
        }
        .desktop-summary {
          padding-inline: 5px;
        }
        .mode-switch {
          min-width: 75px;
        }
        .layout-a {
          right: 8px;
          width: min(370px, calc(100% - 16px));
        }
        .layout-b {
          width: min(370px, 94%);
        }
        .layout-c {
          max-width: calc(100% - 20px);
        }
        .dialog-columns {
          grid-template-columns: 185px minmax(0, 1fr);
        }
        .layout-c .panel-scroll {
          padding: 16px;
        }
        [data-mode='performance'] .score-heading,
        [data-mode='performance'] .score-transport {
          padding-inline-start: 15px;
        }
        [data-mode='performance'] .score-canvas {
          margin: 0;
        }
        .review-title {
          font-size: 10px;
        }
        .variant-switcher {
          margin-inline-start: 0;
        }
        .review-state {
          margin-inline-start: 0;
        }
        .review-footer .demo-state {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

    <script>
      const dictionaries = {

          document.getElementById('prototype-strings-en').textContent

      }
      const params = new URLSearchParams(location.search)
      const oneOf = (value, allowed, fallback) =>
        allowed.includes(value) ? value : fallback
      const state = {
        variant: oneOf(params.get('variant'), ['A', 'B', 'C'], 'A'),
        theme: oneOf(
          params.get('theme'),
          ['pond', 'sand', 'stage', 'brutal'],
          'pond'
        ),
        mode: oneOf(
          params.get('mode'),
          ['creation', 'performance'],
          'creation'
        ),
        project: oneOf(params.get('project'), ['iii', 'runes'], 'iii'),
        lang: oneOf(params.get('lang'), ['zh-CN', 'en'], 'zh-CN'),
        scene: oneOf(
          params.get('scene'),
          [
            'library',
            'shared',
            'empty',
            'recording',
            'replay',
            'overdub',
            'replace',
            'incomplete',
            'changed',
            'offline',
            'unsupported',
          ],
          'library'
        ),
        panelOpen: true,
        view: 'list',
        selected: 'two',
        operation: null,
        runtime: true,
        expanded: false,
        modePending: false,
        menu: false,
        renaming: false,
        confirmation: null,
        speed: 1,
        offline: false,
        scorePosition: 0,
        scorePlaying: false,
        scoreAnchor: 0,
        toast: '',

      const colors = [
        '#527fa7',
        '#cc9d44',
        '#4f8d79',

        '#7c78af',
        '#bd7959',
        '#488a93',
        '#9a8050',
        '#7c9360',
      ]
      const icon = name =>
        '<svg class="icon" aria-hidden="true"><use href="#i-' +
        name +
        '"></use></svg>'
      const escapeHtml = value =>
        String(value).replace(
          /[&<>"']/g,
          char =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[char]
        )
      const t = (key, values = {}) =>
        Object.entries(values).reduce(
          (text, entry) =>
            text.replaceAll('{' + entry[0] + '}', String(entry[1])),
          dictionaries[state.lang][
            key === 'performerCount' && Number(values.n) === 1
              ? 'performerCountOne'
              : key
          ] || key
        )
      const projectName = () =>
        state.project === 'iii' ? 'Inarticulate III' : 'Runes'
      const projectDuration = () => (state.project === 'runes' ? 185 : 120)
      const clock = seconds =>
        String(Math.floor(Math.max(0, seconds) / 60)).padStart(2, '0') +
        ':' +
        String(Math.floor(Math.max(0, seconds) % 60)).padStart(2, '0')
      const actorLabel = actorId => String.fromCharCode(64 + actorId)
      const actorName = actorId => t('performer', { n: actorLabel(actorId) })
      // Synthetic project metadata, not an App rule for assigning score numbers.
      const exampleScoreNumber = (actorId, project = state.project) =>
        project === 'runes' ? (actorId <= 2 ? 3 : 5) : actorId
      const recordName = record => record.name || t(record.nameKey)
      const currentRecords = () => state.records[state.project]
      const selectedRecord = () =>
        currentRecords().find(record => record.id === state.selected) ||
        currentRecords()[0]
      const active = () => Boolean(state.operation)
      const replaying = () => active() && state.operation.kind !== 'record'
      const isWriting = () => active() && state.operation.kind !== 'play'
      const phaseKey = () =>
        !active()
          ? 'stopped'
          : {
              record: 'recording',
              play: 'playing',
              overdub: 'overdubbing',
              replace: 'replacing',

        '<button type="button" class="' +
        (options.className || 'button') +

        action +

        (options.id ? ' id="' + options.id + '"' : '') +
        (options.value != null

        (options.disabled ? ' disabled' : '') +
        (options.title ? ' title="' + escapeHtml(options.title) + '"' : '') +

        (options.icon ? icon(options.icon) : '') +
        escapeHtml(label) +

      const iconButton = (label, action, name, id = '') =>

        escapeHtml(label) +

        escapeHtml(label) +

        action +
        '"' +
        (id ? ' id="' + id + '"' : '') +
        '>' +
        icon(name) +

          project === 'runes' ? [{ at: 5, playing: true, position: 0 }] : []

            id: 'three',
            nameKey: 'recordThree',
            actors: [1, 2, 3],
            duration,
            status: 'saved',
            stamp: '2026-11-03 14:30',

            initial: { playing: false, position: 0 },
            different: false,

            id: 'two',

              actorId,
              exampleScoreNumber(actorId, project),

      function resetData() {
        state.records = { iii: makeRecords('iii'), runes: makeRecords('runes') }

        const url = new URL(location.href)
        for (const key of [
          'variant',
          'theme',
          'mode',
          'project',
          'lang',
          'scene',

          url.searchParams.set(key, state[key])
        history.replaceState(null, '', url)

      function actorDots(actors, record) {
        return actors
          .map(
            number =>
              '<span class="actor-key"><i class="actor-dot" style="--actor-color:' +
              colors[(number - 1) % colors.length] +

              escapeHtml(actorName(number)) +

                  escapeHtml(
                    t('scoreSelection', { n: record.scoreNumbers[number] })

                  '</small>'

              '</span>'

          .join('')

      function scoreLegend() {

      function begin(kind, target = null, skipChange = false) {
        const record = selectedRecord()
        if (active() || state.scene === 'unsupported') return
        if (kind !== 'record' && !record) return
        if (kind !== 'record' && record.different && !skipChange) {
          state.confirmation = { kind: 'change', operation: kind, target }
          renderConfirmation()
          focusPanel()
          return
        }
        const initial =
          kind === 'record'
            ? { playing: state.scorePlaying, position: state.scorePosition }
            : structuredClone(record.initial)
        state.operation = {
          kind,
          elapsed: 0,
          target,
          base: kind === 'record' ? null : structuredClone(record),
          commands: [],
          initial,
          nextCommand: 0,
        }
        state.runtime = true
        state.panelOpen = true
        state.view = 'detail'
        state.menu = false
        state.renaming = false
        state.offline = false
        state.scorePosition = initial.position
        state.scorePlaying = initial.playing
        lastTick = performance.now()
        render()
        focusPanel()
      }
      function saveOperation() {
        const operation = state.operation
        if (!operation) return null
        let notice = 'savedNotice',
          values = {}
        if (operation.kind === 'record') {
          const id = 'record-' + state.serial++
          const record = {
            id,
            name: t('newRecordingName', { n: state.serial - 1 }),
            actors: [1],
            scoreNumbers: { 1: exampleScoreNumber(1) },
            duration: Math.max(1, Math.round(operation.elapsed)),
            status: 'saved',
            stamp: '2026-11-03 15:00',
            commands: structuredClone(operation.commands),
            initial: structuredClone(operation.initial),
            different: false,
          }
          currentRecords().unshift(record)
          state.selected = id
        } else if (operation.kind !== 'play') {
          const replacement = structuredClone(operation.base)
          replacement.status = 'saved'
          replacement.different = false
          replacement.stamp = '2026-11-03 15:00'
          if (operation.kind === 'overdub') {
            const actorId = Math.max(0, ...replacement.actors) + 1
            replacement.actors.push(actorId)
            replacement.scoreNumbers[actorId] = exampleScoreNumber(actorId)
            notice = 'overdubSaved'
            values = { n: replacement.actors.length }
          } else {
            notice = 'replaceSaved'
            values = { n: actorLabel(operation.target) }
          }
          const index = currentRecords().findIndex(
            record => record.id === replacement.id
          )
          currentRecords()[index] = replacement
          state.selected = replacement.id
        }
        state.operation = null
        state.offline = false
        state.scorePlaying = false
        state.view = 'detail'
        state.confirmation = null
        state.menu = false
        return operation.kind === 'play' ? null : { key: notice, values }
      }
      function finish() {
        const notice = saveOperation()
        render()

        focusPanel()

        const writing = isWriting()

        state.scorePosition = 0

        if (writing) notify(restart ? 'restartSaved' : 'stopSaved')

        if (state.mode === 'creation') {

          state.runtime = false
          state.scorePosition = 0

        state.mode = mode
        state.modePending = false
        render()

      function applyScene(scene) {
        resetData()
        state.scene = scene
        state.panelOpen = true
        if (scene === 'shared') {
          state.project = 'runes'
          state.mode = 'creation'
          state.selected = 'two'
          selectedRecord().nameKey = 'recordShared'
          state.view = 'detail'
        }
        if (scene === 'empty') currentRecords().splice(0)
        if (scene === 'incomplete') {
          state.selected = 'incomplete'
          state.view = 'detail'
        }
        if (scene === 'changed') {
          selectedRecord().different = true
          selectedRecord().nameKey = 'recordChanged'
          state.view = 'detail'
        }
        if (
          ['recording', 'overdub', 'replace', 'offline', 'replay'].includes(
            scene
          )
        ) {
          if (['overdub', 'replace', 'offline'].includes(scene))
            state.mode = 'creation'
          begin(
            scene === 'recording'
              ? 'record'
              : scene === 'replay'
                ? 'play'
                : scene === 'replace'
                  ? 'replace'
                  : 'overdub',
            scene === 'replace' ? 2 : null
          )
          if (scene === 'recording') {
            state.operation.elapsed = 12
            state.scorePlaying = state.project === 'runes'
            if (state.project === 'runes')
              state.operation.commands = [{ at: 5, playing: true, position: 0 }]
            state.scorePosition = state.project === 'runes' ? 7 : 0
          }
          if (scene === 'offline') {
            state.operation.elapsed = 24
            state.offline = true
            syncRecordedTransport()
          }
        }
        render()
      }
      function setVariant(delta) {
        const variants = ['A', 'B', 'C']

        render()
        if (state.panelOpen) focusPanel()
      }
      function projectControl(playing, position) {
        if (replaying() || !state.runtime) return
        state.scorePlaying = playing
        if (position != null) state.scorePosition = position
        if (state.operation && state.operation.kind === 'record')
          state.operation.commands.push({
            at: Number(state.operation.elapsed.toFixed(2)),
            playing,
            position: Number(state.scorePosition.toFixed(2)),
          })
        renderWorkspace()
        updateStateDisplay()
      }
      function syncRecordedTransport() {
        if (!replaying() || state.project !== 'runes') return
        const operation = state.operation
        let current = { ...operation.base.initial },
          last = 0
        for (const command of operation.base.commands) {
          if (command.at > operation.elapsed) break
          current = { playing: command.playing, position: command.position }
          last = command.at
        }
        state.scorePlaying = current.playing
        state.scorePosition = Math.min(
          180,
          current.position + (current.playing ? operation.elapsed - last : 0)
        )
        if (state.scorePosition >= 180) state.scorePlaying = false
      }
      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]')
        if (!target || target.disabled) return
        const action = target.dataset.action
        if (action !== 'switch-mode' && state.modePending)
          state.modePending = false
        switch (action) {
          case 'toggle-panel':
            state.panelOpen = !state.panelOpen
            state.menu = false
            render()
            if (state.panelOpen) focusPanel()
            break
          case 'close-panel':
            state.panelOpen = false
            state.menu = false
            render()
            document.getElementById('record-trigger').focus()
            break
          case 'list':
            state.view = 'list'
            state.menu = false
            renderPanel()
            focusPanel()
            break
          case 'select-record':
            if (active()) break
            state.selected = target.dataset.value
            state.view = 'detail'
            state.menu = false
            state.renaming = false
            renderPanel()
            updateStateDisplay()
            if (state.variant === 'A') focusPanel()
            break
          case 'new-record':
            begin('record')
            break
          case 'play':
            begin('play')
            break
          case 'overdub':
            begin('overdub')
            break
          case 'replace':
            begin('replace', Number(target.dataset.value))
            break
          case 'finish':
            finish()
            break
          case 'discard':
            state.operation = null
            state.offline = false
            state.scorePlaying = false
            state.view = 'detail'
            render()
            notify('discarded')
            focusPanel()
            break
          case 'menu':
            state.menu = !state.menu
            renderPanel()
            break
          case 'rename':
            state.menu = false
            state.renaming = true
            renderPanel()
            requestAnimationFrame(() => {
              document.getElementById('rename-input').focus()
              document.getElementById('rename-input').select()
            })
            break
          case 'export':
            state.menu = false
            renderPanel()
            notify('exported')
            break
          case 'delete':
            state.menu = false
            state.confirmation = { kind: 'delete' }
            renderPanel()
            focusPanel()
            break
          case 'cancel-confirm':
            state.confirmation = null
            renderConfirmation()
            focusPanel()
            break
          case 'confirm': {
            const confirmation = state.confirmation
            state.confirmation = null
            if (confirmation.kind === 'change') {
              begin(confirmation.operation, confirmation.target, true)
              break
            }
            const index = currentRecords().findIndex(
              record => record.id === state.selected
            )
            if (index >= 0) currentRecords().splice(index, 1)
            state.selected = currentRecords()[0]?.id || ''
            state.view = 'list'
            render()
            notify('deleted')
            focusPanel()
            break
          }
          case 'import': {
            if (active()) break
            const record = structuredClone(makeRecords(state.project)[1])
            record.id = 'import-' + state.serial++
            record.nameKey = 'recordImported'
            currentRecords().unshift(record)
            state.selected = record.id
            state.view = 'detail'
            render()
            notify('imported')
            break
          }
          case 'runtime':
            if (state.runtime) stopRuntime(false)
            else {
              state.runtime = true
              render()
            }
            break
          case 'restart':
            stopRuntime(true)
            break
          case 'expand':
            state.expanded = !state.expanded
            render()
            break
          case 'switch-mode':
            if (state.modePending)
              setMode(state.mode === 'creation' ? 'performance' : 'creation')
            else {
              state.modePending = true
              render()
              document.getElementById('mode-switch').focus()
            }
            break
          case 'project-play':
            projectControl(!state.scorePlaying)
            break
          case 'previous-variant':
            setVariant(-1)
            break
          case 'next-variant':
            setVariant(1)
            break
          case 'reset':
            applyScene('library')
            break
          case 'near-end':
            if (state.operation?.base) {
              state.operation.elapsed = Math.max(
                0,
                state.operation.base.duration - 3
              )
              syncRecordedTransport()
              updateClocks()
            }
            break
          case 'offline':
            state.offline = !state.offline
            renderWorkspace()
            renderReview()
            break
          case 'context':
            notify('prototypeOnly')
            break
        }
      })
      document.addEventListener('change', event => {
        const key = event.target.dataset.review
        if (key) {
          const value = event.target.value
          if (key === 'scene') {
            applyScene(value)
            return
          }
          if (key === 'mode') {
            setMode(value)
            return
          }
          if (key === 'project') {
            state.project = value
            applyScene('library')
            return
          }
          if (key === 'speed') {
            state.speed = Number(value)
            lastTick = performance.now()
            return
          }
          state[key] = value
          render()
          return
        }
        if (event.target.id === 'piece-seek')
          projectControl(state.scorePlaying, Number(event.target.value))
      })
      document.addEventListener('submit', event => {
        if (event.target.id !== 'rename-form') return
        event.preventDefault()
        const value = document.getElementById('rename-input').value.trim()
        if (value) selectedRecord().name = value
        state.renaming = false
        renderPanel()
        notify('renamed')
      })
      document.addEventListener('pointerdown', event => {
        if (state.modePending && !event.target.closest('#mode-switch')) {
          state.modePending = false
          const button = document.getElementById('mode-switch')
          button.classList.remove('pending')
          button.textContent = t(state.mode)
        }
        if (
          !state.panelOpen ||
          state.confirmation ||
          event.target.closest('.record-panel,#record-trigger,#review')
        )
          return
        if (state.variant === 'A' || state.variant === 'C') {
          state.panelOpen = false
          state.menu = false
          renderPanel()
          document
            .getElementById('record-trigger')
            .setAttribute('aria-expanded', 'false')
          updateStateDisplay()
        }
      })
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if (state.confirmation) {
            state.confirmation = null
            renderConfirmation()
            focusPanel()
            return
          }
          if (state.renaming) {
            state.renaming = false
            renderPanel()
            focusPanel()
            return
          }
          if (state.menu) {
            state.menu = false
            renderPanel()
            focusPanel()
            return
          }
          if (state.panelOpen) {
            state.panelOpen = false
            state.menu = false
            renderWorkspace()
            document.getElementById('record-trigger').focus()
            return
          }
          if (state.modePending) {
            state.modePending = false
            renderWorkspace()
            return
          }
          if (state.expanded) {
            state.expanded = false
            renderWorkspace()
            return
          }
        }
        if (event.key === 'Tab') {
          const scope = state.confirmation
            ? document.querySelector('.confirmation-box')
            : state.panelOpen && state.variant === 'C'
              ? document.getElementById('record-panel')
              : null
          if (scope) {
            const focusable = [
              ...scope.querySelectorAll(
                'button:not(:disabled),input:not(:disabled),select:not(:disabled),summary'
              ),
            ]
            const first = focusable[0],
              last = focusable.at(-1)
            if (
              event.shiftKey &&
              (document.activeElement === first ||
                !scope.contains(document.activeElement))
            ) {
              event.preventDefault()
              last?.focus()
            } else if (
              !event.shiftKey &&
              (document.activeElement === last ||
                !scope.contains(document.activeElement))
            ) {
              event.preventDefault()
              first?.focus()
            }
          }
        }
        if (event.target.closest('input,textarea,select,[contenteditable]'))
          return
        if (event.key === 'ArrowLeft') {
          event.preventDefault()
          setVariant(-1)
        }
        if (event.key === 'ArrowRight') {
          event.preventDefault()
          setVariant(1)
        }
      })
      function updateClocks() {
        const operation = state.operation
        document
          .querySelectorAll('[data-main-clock],[data-bar-clock]')
          .forEach(element => {
            element.textContent = operation ? clock(operation.elapsed) : ''
          })
        const progress = document.getElementById('operation-progress')
        if (progress && operation) progress.value = operation.elapsed
        document.querySelectorAll('[data-score-clock]').forEach(element => {
          element.textContent = clock(state.scorePosition)
        })
        const seek = document.getElementById('piece-seek')
        const transportButton = document.querySelector(
          '[data-action="project-play"]'
        )
        if (transportButton)
          transportButton.innerHTML =
            icon(state.scorePlaying ? 'pause' : 'play') +
            escapeHtml(t(state.scorePlaying ? 'projectPause' : 'projectStart'))
        if (seek && document.activeElement !== seek)
          seek.value = Math.min(180, state.scorePosition)
        const motion = operation ? operation.elapsed : state.scorePosition
        document
          .querySelectorAll('[data-score-dot]')
          .forEach((element, index) => {
            const phase = motion * 0.18 + index * 2
            element.setAttribute(
              'cx',
              String(170 + index * 135 + Math.sin(phase) * 30)
            )
            element.setAttribute(
              'cy',
              String(185 + Math.sin(phase + index) * 40)
            )
          })
        document.querySelectorAll('[data-rune]').forEach((element, index) => {
          element.setAttribute(
            'opacity',
            String(
              state.scorePlaying
                ? 0.4 +
                    (Math.floor(state.scorePosition / 8) % 9 === index
                      ? 0.6
                      : 0)
                : 0.6
            )
          )
        })
        updateStateDisplay()
      }
      let lastTick = performance.now()
      setInterval(() => {
        const now = performance.now(),
          delta = Math.min(1, (now - lastTick) / 1000) * state.speed
        lastTick = now
        if (state.operation) {
          state.operation.elapsed += delta
          if (replaying()) syncRecordedTransport()
          else if (state.project === 'runes' && state.scorePlaying)
            state.scorePosition = Math.min(180, state.scorePosition + delta)
          if (
            state.operation.base &&
            state.operation.elapsed >= state.operation.base.duration
          ) {
            finish()
            return
          }
        } else if (
          state.runtime &&
          state.project === 'runes' &&
          state.scorePlaying
        )
          state.scorePosition = Math.min(180, state.scorePosition + delta)
        if (state.scorePosition >= 180) state.scorePlaying = false
        if (active() || state.scorePlaying) updateClocks()
      }, 100)
      applyScene(state.scene)
      new ResizeObserver(() => {
        document.documentElement.style.setProperty(
          '--review-space',
          document.getElementById('review').getBoundingClientRect().height +
            28 +
            'px'
        )
      }).observe(document.getElementById('review'))
    </script>
  </body>
</html>
