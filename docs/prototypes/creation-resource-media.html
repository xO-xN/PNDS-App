<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNDS · 创作资源 UI 原型</title>
    <!-- UI review only. A: central preview. -->
    <style>
      :root {
        color-scheme: light;
        --shell: #e2eaf1;
        --side: #edf2f6;
        --bar: #f3f7fa;
        --paper: #fcfdff;
        --ink: #202e3c;
        --muted: #53677a;
        --line: #d3dfe9;
        --soft: #e8f0f7;
        --blue: #245e94;
        --blue-dark: #184a78;
        --select: #d8e8f6;
        --green: #276356;
        --warn: #815319;
        --bad: #a1303b;
        --radius: 10px;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          'PingFang SC',
          sans-serif;
        color: var(--ink);
        background: #dce6ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.47;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid #2679bc;
        outline-offset: 3px;
      }
      button,
      .control {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 7px;
      }
      button:not(:disabled):hover {
        background: var(--soft);
      }
      button.primary {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      button.primary:not(:disabled):hover {
        background: var(--blue-dark);
      }
      button.secondary {
        background: var(--paper);
        border-color: var(--line);
      }
      button.danger {
        color: var(--bad);
      }
      button.icon {
        display: inline-grid;
        place-items: center;
        inline-size: 29px;
        block-size: 29px;
        padding: 0;
        flex: none;
      }
      button.small {
        padding: 5px 10px;
        font-size: 12px;
      }
      svg {
        display: inline-block;
        width: 16px;
        height: 16px;
        vertical-align: middle;
        flex: none;
      }
      [hidden] {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font:
          11px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .truncate {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .outer {
        max-width: 1570px;
        margin: auto;
        padding: 20px clamp(10px, 2.8vw, 42px) 12px;
      }
      .review-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 2px 13px;
      }
      .review-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .logo {
        width: 32px;
        height: 32px;
        border-radius: 9px;
      }
      .review-title h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 680;
        letter-spacing: 0.02em;
      }
      .review-title p {
        margin: 0;
        font-size: 11px;
        color: var(--muted);
      }
      .review-head a,
      .refs a {
        color: var(--blue-dark);
        text-decoration: none;
      }
      .review-head a:hover,
      .refs a:hover {
        text-decoration: underline;
      }
      .frame {
        display: grid;
        grid-template-rows: 43px minmax(0, 1fr) 44px;
        block-size: clamp(530px, calc(100dvh - 144px), 850px);
        border: 1px solid #aebfce;
        border-radius: 14px;
        background: var(--shell);
        box-shadow: 0 12px 36px #314c6820;
        overflow: hidden;
        position: relative;
      }
      .titlebar,
      .bottom {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        background: var(--bar);
      }
      .titlebar {
        border-bottom: 1px solid var(--line);
      }
      .bottom {
        border-top: 1px solid var(--line);
        justify-content: space-between;
      }
      .lights {
        display: flex;
        gap: 7px;
        margin-inline-end: 7px;
      }
      .lights i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ee6c62;
        border: 1px solid #0001;
      }
      .lights i:nth-child(2) {
        background: #eeb748;
      }
      .lights i:nth-child(3) {
        background: #60c36a;
      }
      .titlebar details {
        position: relative;
      }
      summary {
        cursor: pointer;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .project-menu summary,
      .output-control {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--paper);
      }
      .popover {
        position: absolute;
        z-index: 10;
        top: calc(100% + 6px);
        left: 0;
        min-width: 185px;
        padding: 5px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: 0 8px 18px #29466322;
      }
      .popover button {
        display: block;
        width: 100%;
        padding: 7px 9px;
        text-align: start;
      }
      .bar-right {
        margin-inline-start: auto;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .chip,
      .tag,
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 6px;
        font-size: 11px;
      }
      .chip {
        padding: 3px 7px;
        background: var(--soft);
        color: var(--muted);
      }
      .status-pill {
        padding: 3px 7px;
        background: #e0f0eb;
        color: var(--green);
      }
      .status-pill.warn {
        background: #faeddb;
        color: var(--warn);
      }
      .status-pill.bad {
        background: #fae8ea;
        color: var(--bad);
      }
      .workbench {
        display: grid;
        grid-template-columns: minmax(190px, 24%) minmax(0, 1fr) minmax(
            214px,
            25%
          );
        min-height: 0;
      }
      .sidebar,
      .workspace,
      .right {
        min-height: 0;
        min-width: 0;
      }
      .sidebar {
        display: grid;
        grid-template-rows: minmax(0, 66%) minmax(0, 34%);
        background: var(--side);
        border-right: 1px solid var(--line);
      }
      .tree {
        min-height: 0;
        overflow: auto;
        padding: 12px 10px 8px;
      }
      .group-title {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 5px;
      }
      .group-title strong {
        flex: 1;
        padding-inline: 6px;
        font-weight: 680;
      }
      .tree-search {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--muted);
        padding: 6px 8px;
        margin: 5px 3px 9px;
      }
      .tree-search input {
        padding: 0;
        min-width: 0;
        width: 100%;
        outline: none;
        border: none;
        background: transparent;
        font-size: 12px;
      }
      .tree-search:focus-within {
        outline: 2px solid #2679bc;
      }
      .tree-folder {
        margin-top: 3px;
      }
      .tree-folder summary,
      .tree-file {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 7px;
        width: 100%;
        text-align: start;
      }
      .tree-file {
        padding-left: 26px;
      }
      .tree-file.root-file {
        padding-left: 7px;
      }
      .tree-folder summary svg,
      .tree-file svg {
        width: 14px;
        height: 14px;
        color: var(--muted);
      }
      .tree-folder[open] summary .arrow {
        transform: rotate(90deg);
      }
      .resources {
        padding: 9px 9px 11px;
        border-top: 1px solid var(--line);
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .resources[data-drag] {
        outline: 2px dashed #4386bc;
        outline-offset: -4px;
        background: #e0effc;
      }
      .resource-list {
        overflow: auto;
        min-height: 0;
        display: grid;
        gap: 3px;
        align-content: start;
        scrollbar-gutter: stable;
      }
      .empty-inbox {
        display: grid;
        flex: 1;
        min-height: 0;
        align-content: center;
        justify-items: center;
        gap: 7px;
        padding: 6px;
        border: 1px dashed #a7bccf;
        background: #f1f6fa;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }
      .empty-inbox svg {
        width: 24px;
        height: 24px;
        color: var(--blue);
      }
      .file-row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 5px 6px;
        text-align: start;
        border: 1px solid transparent;
        min-width: 0;
      }
      .file-row[aria-pressed='true'] {
        background: var(--select);
        border-color: #b8d0e5;
      }
      .file-tile {
        width: 32px;
        height: 30px;
        border: 1px solid #b6cde2;
        border-radius: 6px;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #37618b;
        background: #e6eff9;
      }
      .file-tile.audio {
        background: #e3eeea;
        color: #36665b;
        border-color: #c3d9d0;
      }
      .file-tile.text {
        background: #f5efdf;
        color: #765a34;
        border-color: #dfd2b9;
      }
      .file-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .file-name {
        display: block;
        font-weight: 600;
        font-size: 12px;
      }
      .file-meta {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      .row-end {
        color: var(--blue);
        font-size: 11px;
      }
      .drop-feedback {
        position: absolute;
        inset: 4px;
        display: grid;
        place-items: center;
        pointer-events: none;
        border-radius: 8px;
        background: #e0effcec;
        color: #174e7a;
        font-weight: 650;
      }
      .workspace {
        background: var(--paper);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .tabs {
        min-height: 43px;
        display: flex;
        align-items: center;
        gap: 5px;
        overflow: auto;
        padding: 4px 11px;
        border-bottom: 1px solid var(--line);
        background: #f7fafd;
      }
      .tabs button {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
        padding: 5px 8px;
        font-size: 12px;
      }
      .tabs button[aria-selected='true'] {
        background: var(--select);
        color: #1d4b73;
      }
      .tabs .tab-name {
        max-width: 200px;
      }
      .pane {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .preview {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: clamp(12px, 2vw, 25px);
        gap: 14px;
      }
      .preview-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .preview-title {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .preview-title h2 {
        font-size: 17px;
        margin: 0;
        line-height: 1.3;
        font-weight: 670;
      }
      .preview-title p {
        font-size: 11px;
        margin: 3px 0 0;
        color: var(--muted);
      }
      .preview-heading button {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .preview-actions, .zoom-tools {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
      }
      .zoom-tools {
        justify-content: flex-end;
        color: var(--muted);
        font-size: 11px;
      }
      .zoom-tools button { min-width: 34px; }
      .zoom-tools output { min-width: 38px; text-align: center; }
      .picture {
        flex: 1;
        min-height: 190px;
        max-height: clamp(190px, calc(100dvh - 315px), 500px);
        display: flex;
        align-items: safe center;
        overflow: auto;
        background: #dfe9f1;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .picture img {
        width: auto;
        max-width: 100%;
        max-height: calc(clamp(190px, calc(100dvh - 315px), 500px) - 26px);
        object-fit: contain;
        display: block;
        border-radius: 5px;
        margin: auto;
        flex: none;
      }
      .picture[data-zoomed] { cursor: grab; }
      .picture[data-panning] { cursor: grabbing; user-select: none; }
      .picture[data-zoomed] img { max-width: none; max-height: none; }
      .dirty-marker { color: var(--warn); font-weight: 650; }
      .saved-marker { color: var(--green); }
      .text-status { margin-inline-start: auto; white-space: nowrap; }
      }
      .preview-foot {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .player {
        margin: auto 0;
        display: grid;
        gap: 14px;
        padding: clamp(14px, 3vw, 24px);
        background: #f0f6fa;
        border: 1px solid var(--line);
        border-radius: 11px;
      }
      .player-top {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .player-top .primary {
        width: 43px;
        height: 43px;
        border-radius: 50%;
        flex: none;
      }
      .player-top strong {
        display: block;
      }
      .player-top small {
        color: var(--muted);
      }
      .time-row {
        display: flex;
        justify-content: space-between;
        font:
          11px ui-monospace,
          monospace;
        color: var(--muted);
      }
      input[type='range'] {
        accent-color: var(--blue);
        min-width: 0;
      }
      .player input[type='range'] {
        width: 100%;
        margin: 0;
      }
      .player-volume {
        display: flex;
        align-items: center;
        gap: 7px;
        justify-self: end;
        color: var(--muted);
        font-size: 11px;
      }
      .player-volume input[type='range'] {
        width: 70px;
      }
      .preview-error {
        font-size: 12px;
        color: var(--bad);
      }
      .preview pre {
        overflow: auto;
        margin: 0;
        background: #f0f6fa;
        border: 1px solid var(--line);
        padding: 14px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      .preview textarea {
        min-height: 150px;
        flex: 1;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        padding: 10px;
      }
      .right {
        display: flex;
        flex-direction: column;
        background: #eaf0f5;
        border-left: 1px solid var(--line);
        overflow: auto;
      }
      .right-head {
        min-height: 43px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 4px 11px;
        border-bottom: 1px solid var(--line);
        background: var(--bar);
      }
      .right-head strong {
        font-size: 12px;
      }
      .monitor-inner {
        padding: 10px;
        display: grid;
        gap: 9px;
      }
      .monitor-screen {
        background: #102535;
        border: 1px solid #314b61;
        aspect-ratio: 4/3;
        border-radius: 9px;
        position: relative;
        overflow: hidden;
      }
      .monitor-screen canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        display: block;
      }
      .monitor-foot,
      .right-info {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .right-info {
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .thread {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        padding: clamp(12px, 2vw, 22px);
        gap: 16px;
      }
      .thread-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 650;
      }
      .thread-head svg {
        color: var(--blue);
      }
      .thread-body {
        flex: 1;
        display: grid;
        align-content: start;
        gap: 11px;
      }
      .message {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        font-size: 12px;
      }
      .message.user {
        justify-self: end;
        background: #eaf3fb;
        max-width: 90%;
      }
      .message p {
        margin: 0 0 6px;
      }
      .message p:last-child {
        margin: 0;
      }
      .message h3 {
        font-size: 13px;
        margin: 0 0 6px;
      }
      .task-list {
        display: grid;
        gap: 6px;
        padding: 0;
        list-style: none;
        margin: 8px 0;
      }
      .task-list li {
        display: flex;
        gap: 7px;
        align-items: flex-start;
      }
      .task-list svg {
        width: 14px;
        height: 14px;
      }
      .conflict {
        background: #fff9ee;
        border-color: #ebd8b6;
      }
      .conflict-actions,
      .dialog-actions,
      .thread-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
      }
      .conflict-actions .recommend {
        border-color: #9cbad5;
        color: #174e7b;
        background: #f2f8fc;
      }
      .composer {
        position: relative;
        display: grid;
        gap: 8px;
        border: 1px solid #b6c9da;
        border-radius: 11px;
        padding: 9px;
        background: var(--paper);
      }
      .composer:focus-within {
        border-color: #5c91bd;
      }
      .composer[data-file-drop] {
        outline: 2px dashed #4386bc;
        outline-offset: 2px;
        background: #eef7ff;
      }
      .composer-drop {
        position: absolute;
        inset: 3px;
        z-index: 5;
        display: grid;
        place-items: center;
        pointer-events: none;
        border-radius: 7px;
        color: #174e7a;
        background: #e0effcf5;
        font-weight: 650;
      }
      .tag.project-ref { background: #edf0f3; color: #344d65; }
      .tree-file[draggable='true'], .file-row[draggable='true'] { cursor: grab; }
      .composer textarea {
        width: 100%;
        resize: vertical;
        min-height: 56px;
        max-height: 160px;
        padding: 4px;
        background: transparent;
        border: 0;
        outline: none;
      }
      .compose-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .compose-actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .segment {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        background: #ecf3f8;
        border-radius: 7px;
      }
      .segment button {
        padding: 2px 7px;
        font-size: 11px;
      }
      .segment button[aria-pressed='true'] {
        background: var(--paper);
        box-shadow: 0 1px 3px #263b5024;
        color: var(--blue-dark);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .tag {
        padding: 2px 3px 2px 6px;
        background: #e6f0f9;
        color: #215583;
        max-width: 100%;
      }
      .tag button {
        padding: 0;
        display: grid;
        place-items: center;
        min-width: 18px;
        min-height: 18px;
      }
      .tag svg {
        width: 12px;
        height: 12px;
      }
      .add-context {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .compose-pop {
        position: absolute;
        bottom: calc(100% + 6px);
        left: 4px;
        z-index: 4;
        width: min(310px, 95%);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px;
        box-shadow: 0 8px 22px #26476022;
      }
      .compose-pop-list { max-height: 240px; overflow: auto; }
      .compose-pop p {
        margin: 0 4px 4px;
        font-weight: 600;
      }
      .pick-row {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 5px;
        text-align: start;
      }
      .compose-pop button[aria-pressed='true'] {
        background: var(--select);
      }
      .skill-pop {
        inset-inline: 4px;
        width: auto;
        max-width: 340px;
      }
      .skill-option {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .skill-option[aria-selected='true'] {
        background: var(--select);
      }
      .skill-option svg {
        width: 15px;

      function seeded() {
        let seed = 573
        return () =>
          (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296
      }

      function tideArt() {
        const c = document.createElement('canvas')
        c.width = 1100
        c.height = 660
        const g = c.getContext('2d'),
          random = seeded()
        const grad = g.createLinearGradient(0, 0, 1020, 660)
        grad.addColorStop(0, '#0c2430')
        grad.addColorStop(0.48, '#153b4b')
        grad.addColorStop(1, '#061820')
        g.fillStyle = grad
        g.fillRect(0, 0, c.width, c.height)
        for (let row = 0; row < 100; row++) {
          g.beginPath()
          const y = row * 6.9 + 9
          for (let x = 0; x <= 1100; x += 3) {
            const swell =
              Math.sin(x * 0.006 + row * 0.062) * 72 +
              Math.cos(x * 0.014 + row * 0.034) * 26
            const fold =
              Math.exp(-((x - 585) ** 2) / 110000) *
              Math.sin(row * 0.047 + 1) *
              145
            const v = y + swell + fold + Math.sin(x * 0.034 + row * 0.8) * 2
            if (x === 0) g.moveTo(x, v)
            else g.lineTo(x, v)
          }
          g.strokeStyle =
            row % 13 === 0
              ? '#f2ce8ba0'
              : row % 5 === 0
                ? '#c4e4d6a0'
                : '#7aabc34f'
          g.lineWidth = row % 13 === 0 ? 1.6 : 1
          g.stroke()
        }
        for (let i = 0; i < 4300; i++) {
          const x = random() * 1100,
            y = random() * 660
          g.fillStyle = i % 11 === 0 ? '#f7d89192' : '#9cd3d341'
          const s = random() * 1.55 + 0.18
          g.fillRect(x, y, s, s)
        }
        g.strokeStyle = '#d1e8e36e'
        g.lineWidth = 1
        g.strokeRect(26.5, 26.5, 1047, 607)
        g.fillStyle = '#dcebe0'
        g.font = '13px ui-monospace, monospace'
        g.fillText('TIDAL SCORE   /   PERFORMER FIELD', 42, 53)
        g.textAlign = 'right'
        g.fillText('FIELD 01', 1058, 609)
        return c.toDataURL('image/png')
      }
      const artwork = tideArt()
      const samples = () => [
        {
          id: 'tide',
          name: '潮汐谱面.png',
          type: 'image',
          format: 'PNG',

      function bytes(size) {
        return size < 1024
          ? size + ' B'
          : size < 1048576
            ? (size / 1024).toFixed(1) + ' KiB'
            : (size / 1048576).toFixed(1) + ' MiB'
      }
      function time(t) {
        const v = Math.max(0, Math.floor(t || 0))
        return Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0')
      }
      function selectedRow() {

      function isDirty(row) {
        return (
          row.type === 'text' &&
          (row.text === undefined ||
            (row.draftText !== undefined && row.draftText !== row.text))
        )
      }
      function saveText(row) {
        row.text = row.draftText ?? row.text ?? ''
        delete row.draftText
        row.size = bytes(new TextEncoder().encode(row.text).length)
      }
      function updateTextStatus(row) {
        const dirty = isDirty(row)
        const status = document.querySelector('.text-status')
        status.textContent = dirty ? '未保存' : '已保存'

        const fit = Math.min(1, previousWidth / img.naturalWidth)
        const viewport = picture.getBoundingClientRect()
        const image = img.getBoundingClientRect()
        const x =
          (viewport.left + picture.clientWidth / 2 - image.left) / previousWidth
        const y =
          (viewport.top + picture.clientHeight / 2 - image.top) /
          Math.max(1, img.clientHeight)

        else if (action === 'zoom-actual') zoom = 1

      function sampleAudio() {
        const sampleRate = 8000,
          duration = 10,
          frames = sampleRate * duration
        const buf = new ArrayBuffer(44 + frames * 2),

        view.setUint32(4, buf.byteLength - 8, true)

        const c = $('monitorCanvas')

        const g = c.getContext('2d'),

          w * 0.56,
          h * 0.48,

          g.moveTo(20, y)

            )

          [162, 86, 4],
          [243, 164, 5],

          g.arc(x, y, r + 7, 0, Math.PI * 2)

        render()
        $('prompt').focus()
      }
      $('demoWork').onclick = () => demoWork(['tide', 'shore'], samplePrompt)
      $('demoSample').onclick = () =>
        demoWork(
          ['shore'],
          '用 SuperCollider 加载海岸采样.wav，让触点触发采样。'
        )
      $('output').onchange = () => {
        if (running && applied) {
          render()
          return
        }
        stopAudio(false)
        unplugged = false
        updatePlayer()
      }
      $('testRun').onclick = () => {
        const previous = outputName()
        running = !running
        applied = running ? $('output').value : null
        if (outputName() !== previous) stopAudio(false)
        render()
      }
      document.addEventListener('click', e => {
        const skillOption = e.target.closest('[data-skill-index]')
        if (skillOption) {
          selectSkill(Number(skillOption.dataset.skillIndex))
          return
        }
        if (skillMenu) {
          if (e.target.id === 'prompt') updateSkillMenu(e.target)
          else if (!e.target.closest('#skillOptions')) closeSkillMenu()
        }
        const b = e.target.closest('[data-action]')
        if (!b) {
          if (picker && !e.target.closest('.composer')) {
            picker = false
            render()
          }
          return
        }
        const { action, id, choice, path } = b.dataset
        if (action.startsWith('zoom-')) changeZoom(action)
        if (action === 'save-text') {
          const row = selectedRow()
          saveText(row)
          updateTextStatus(row)
          document.querySelector('[data-draft]')?.focus()
        }
        if (action === 'preview') preview(id)
        if (action === 'close-preview') {
          stopAudio()
          zoom = null
          view = 'discussion'
          selected = null
          render()
        }
        if (action === 'discuss') {
          stopAudio()
          view = 'discussion'
          render()
        }
        if (action === 'attach') attach(id)
        if (action === 'play') play()
        if (action === 'code' || action === 'show-code') {
          stopAudio()
          codePath = path || codePath
          view = 'code'
          render()
        }
        if (action === 'mode') {
          mode = b.dataset.mode
          render()
        }
        if (action === 'remove-skill') {
          selectedSkill = null
          render()
          $('prompt').focus()
        }
        if (action === 'skill-readme-choice') {
          task.syncReadme = choice === 'sync'
          task.phase = 'skill-result'
          render()
          document.querySelector('[data-action=skill-readme-view]').focus()
        }
        if (action === 'skill-readme-view') showSkillReadme(choice)
        if (action === 'picker') {
          picker = !picker
          render()
          ;(picker
            ? document.querySelector('.compose-pop button')
            : document.querySelector('.add-context')
          )?.focus()
        }
        if (action === 'pick') {
          const fromMenu = b.closest('.compose-pop')
          picks = picks.includes(id)
            ? picks.filter(item => item !== id)
            : [...picks, id]
          render()
          if (fromMenu)
            Array.from(document.querySelectorAll('.compose-pop [data-id]'))
              .find(item => item.dataset.id === id)
              ?.focus()
          else $('prompt').focus()
        }
        if (action === 'conflict') finishTask(choice)
        if (action === 'cancel') {
          task.phase = 'cancelled'
          render()
        }
        if (action === 'stop-work') {
          runToken++
          task.phase = 'stopped'
          render()
        }
        if (action === 'retry') finishTask(task.choice, true)
        if (action === 'undo-partial') {
          assets = [...task.before]
          task = null
          render()
          viewToast('已撤回本次保存的修改。')
        }
        if (action === 'restore') restore(choice)
      })
      $('center').addEventListener('mousedown', e => {
        if (e.target.closest('[data-skill-index]')) e.preventDefault()
      })
      $('center').addEventListener('focusout', e => {
        if (e.target.id === 'prompt') closeSkillMenu()
      })
      $('center').addEventListener('compositionend', e => {
        if (e.target.id !== 'prompt') return
        prompt = e.target.value
        updateSkillMenu(e.target)
      })
      document.addEventListener('input', e => {
        if (e.target.id === 'prompt') {
          prompt = e.target.value
          if (!e.isComposing) updateSkillMenu(e.target)
        }
        if (e.target.hasAttribute('data-draft')) {
          const row = selectedRow()
          if (row?.type === 'text') {
            row.draftText = e.target.value
            updateTextStatus(row)
          }
        }
        if (e.target.hasAttribute('data-seek')) {
          position = Number(e.target.value)
          if (activeAudio && audio.readyState >= 1)
            audio.currentTime = selectedRow()?.sample ? position % 10 : position
          updatePlayer()
        }
        if (e.target.hasAttribute('data-volume')) {
          volume = Number(e.target.value)
          audio.volume = volume / 100
        }
      })
      document.addEventListener('submit', e => {
        if (e.target.id === 'composer') {
          e.preventDefault()
          sendComposer()
        }
      })
      document.addEventListener('keydown', e => {
        if (e.target.id === 'prompt') {
          if (e.isComposing || e.keyCode === 229) return
          if (
            skillMenu &&
            ['ArrowUp', 'ArrowDown'].includes(e.key) &&
            skillMenu.items.length
          ) {
            e.preventDefault()
            const count = skillMenu.items.length
            const step = e.key === 'ArrowDown' ? 1 : -1
            skillMenu.index = (skillMenu.index + step + count) % count
            showActiveSkill()
            return
          }
          if (skillMenu && e.key === 'Escape') {
            e.preventDefault()
            closeSkillMenu()
            return
          }
          if (
            e.key === 'Enter' &&
            !e.shiftKey &&
            !e.altKey &&
            !e.metaKey &&
            !e.ctrlKey
          ) {
            e.preventDefault()
            if (skillMenu?.items.length) selectSkill(skillMenu.index)
            else if (skillMenu) closeSkillMenu()
            else sendComposer()
            return
          }
        }
        if (e.key === 'Escape' && picker) {
          picker = false
          render()
          document.querySelector('.add-context')?.focus()
        }
        if (
          (e.metaKey || e.ctrlKey) &&
          e.key.toLowerCase() === 's' &&
          view === 'preview' &&
          selectedRow()?.type === 'text'
        ) {
          e.preventDefault()
          if (isDirty(selectedRow()))
            document.querySelector('[data-action=save-text]').click()
        }
      })
      $('center').addEventListener('pointerdown', e => {
        const picture = e.target.closest('.picture[data-zoomed]')
        if (
          !picture ||
          e.pointerType === 'touch' ||
          e.button !== 0 ||
          e.target !== picture.querySelector('img')
        )
          return
        pan = {
          picture,
          id: e.pointerId,
          x: e.clientX + picture.scrollLeft,
          y: e.clientY + picture.scrollTop,
        }
        picture.dataset.panning = ''
        picture.setPointerCapture(e.pointerId)
      })
      $('center').addEventListener('pointermove', e => {
        if (pan?.id !== e.pointerId) return
        pan.picture.scrollLeft = pan.x - e.clientX
        pan.picture.scrollTop = pan.y - e.clientY
      })
      $('center').addEventListener('lostpointercapture', e => {
        if (pan?.id !== e.pointerId) return
        delete pan.picture.dataset.panning
        pan = null
      })
      const initialScene = new URLSearchParams(location.search).get('scene')
      if ([...$('scene').options].some(option => option.value === initialScene))
        $('scene').value = initialScene
      newScene()
    </script>
  </body>
</html>
