<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PNDS · 创作版本原型</title>
    <style>
      :root {
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: #1c2a3c;
        background: #e6ebf2;
        --text: #1c2a3c;
        --muted: #56677c;
        --line: #dce4ee;
        --surface: #fff;
        --soft: #f5f8fc;
        --accent: #2159aa;
        --blue: #eaf2ff;
        --ok: #25614c;
        --warn: #85550d;
        --danger: #9d3345;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      summary {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid #2d6dce;
        outline-offset: 3px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: none;
        padding: 7px 11px;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        background: var(--blue);
      }
      button svg,
      .ico {
        width: 16px;
        height: 16px;
        flex: none;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
        font-weight: 680;
        letter-spacing: -0.04em;
      }
      h2 {
        font-size: 22px;
        line-height: 1.3;
        font-weight: 680;
        letter-spacing: -0.025em;
      }
      h3 {
        font-size: 15px;
      }
      small,
      .muted {
        color: var(--muted);
      }
      code,
      kbd,
      .mono {
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      kbd {
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 5px;
        color: var(--muted);
      }
      .btn,
      .button {
        border-color: var(--line);
        background: var(--surface);
      }
      .btn-primary,
      .button.primary,
      .primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        font-weight: 620;
      }
      .btn-primary:hover:not(:disabled),
      .button.primary:hover:not(:disabled),
      .primary:hover:not(:disabled) {
        background: #174783;
        color: white;
      }
      .btn-quiet,
      .form-secondary {
        border-color: transparent;
        background: transparent;
      }
      .danger {
        color: var(--danger);
      }
      .icon-button {
        padding: 6px;
        color: var(--muted);
      }
      .review {
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px max(18px, calc((100vw - 1430px) / 2));
        background: #e6ebf2;
      }
      .review-brand {
        font-size: 13px;
        font-weight: 650;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .review-brand small {
        font-weight: 450;
      }
      .review-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .review-controls label {
        display: flex;
        gap: 8px;
        align-items: center;
        color: #41536b;
        font-size: 12px;
      }
      .review select,
      .review button {
        background: #f6f9fd;
        border: 1px solid #cdd8e5;
        border-radius: 7px;
        padding: 5px 8px;
        color: #213550;
      }
      .window {
        width: calc(100% - 36px);
        max-width: 1430px;
        margin: 0 auto;
        min-height: calc(100dvh - 118px);
        display: grid;
        grid-template-rows: 53px minmax(590px, 1fr) 43px;
        background: var(--surface);
        border: 1px solid #c7d2df;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 14px 42px #23365118;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f4f7fb;
        border-bottom: 1px solid var(--line);
        padding: 0 13px;
      }
      .traffic {
        display: flex;
        gap: 6px;
        margin-inline-end: 6px;
      }
      .traffic span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ec6c61;
      }
      .traffic span:nth-child(2) {
        background: #eeb447;
      }
      .traffic span:nth-child(3) {
        background: #64b477;
      }
      .toolbar-title {
        font-weight: 640;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toolbar .right {
        margin-inline-start: auto;
        display: flex;
        gap: 7px;
      }
      .toolbar [aria-pressed='true'] {
        background: var(--blue);
        color: var(--accent);
      }
      .work {
        display: grid;
        grid-template-columns: 184px minmax(0, 1fr) 216px;
        min-height: 0;
      }
      .sidebar,
      .preview {
        background: var(--soft);
        padding: 13px 10px;
        border-inline-end: 1px solid var(--line);
        min-width: 0;
      }
      .preview {
        border-inline-start: 1px solid var(--line);
        border-inline-end: 0;
        padding: 13px;
      }
      .bar-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 4px 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .file-row {
        justify-content: flex-start;
        width: 100%;
        text-align: start;
        font-size: 12px;
        padding: 7px 8px;
        color: #465a70;
        overflow: hidden;
      }
      .file-row[aria-pressed='true'] {
        background: #e7eef8;
        color: #1b467c;
        font-weight: 640;
      }
      .file-row small {
        margin-inline-start: auto;
      }
      .file-group {
        color: var(--muted);
        font-size: 11px;
        padding: 14px 8px 5px;
      }
      .center {
        min-width: 0;
        min-height: 0;
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 13px;
        border-top: 1px solid var(--line);
        background: #f4f7fb;
        color: #465a70;
        font-size: 12px;
      }
      .footer .spacer {
        flex: 1;
      }
      .footer button {
        padding: 4px 8px;
      }
      .dot {
        width: 7px;
        height: 7px;
        background: #8193aa;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.on {
        background: #32845f;
      }
      .preview-art {
        display: grid;
        place-items: center;
        aspect-ratio: 1.14;
        background: #192b3b;
        border-radius: 6px;
        color: #99c9f7;
        overflow: hidden;
      }
      .preview-art svg {
        width: 100%;
        height: 100%;
      }
      .preview figcaption {
        font-size: 11px;
        color: var(--muted);
        padding: 9px 0;
      }
      .preview figure {
        margin: 0;
      }
      .preview .preview-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        border-top: 1px solid var(--line);
        margin-top: 12px;
        padding-top: 9px;
        color: var(--muted);
      }
      .review-foot {
        display: flex;
        max-width: 1430px;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
        padding: 12px 18px;
        color: #4e6076;
        font-size: 12px;
      }
      .review-foot a {
        color: var(--accent);
      }
      .home,
      .editor {
        max-width: 760px;
        margin: 0 auto;
        padding: 44px 36px;
      }
      .home p,
      .editor p {
        margin: 10px 0 22px;
        color: var(--muted);
      }
      .home .home-actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .home .recent {
        margin-top: 30px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      .editor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
        margin-bottom: 14px;
      }
      .editor textarea {
        width: 100%;
        min-height: 295px;
        border: 1px solid var(--line);
        border-radius: 7px;
        resize: vertical;
        background: #f8fbfe;
        padding: 15px;
        font:
          13px/1.75 ui-monospace,
          monospace;
      }
      .editor .editor-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .floating-menu {
        position: absolute;
        top: 48px;
        left: 66px;
        z-index: 2;
        display: grid;
        padding: 5px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: 0 8px 22px #1b2f4326;
      }
      .floating-menu button {
        justify-content: start;
      }
      .window {
        position: relative;
      }
      .history-panel {
        padding: 28px clamp(16px, 3vw, 44px);
        max-width: 1140px;
        margin: 0 auto;
      }
      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
        margin-bottom: 18px;
      }
      .history-header p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .github-status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        padding: 9px 11px;
        border: 1px solid #d5e1ee;
        border-radius: 8px;
        background: #f3f7fc;
        margin-bottom: 20px;
      }
      .status-symbol,
      .summary-icon,
      .modal-icon {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 7px;
        background: #e5eefb;
        color: var(--accent);
        flex: none;
      }
      .status-copy,
      .summary-copy {
        min-width: 0;
        flex: 1;
        display: grid;
        gap: 1px;
      }
      .status-label {
        font-size: 13px;
        font-weight: 640;
      }
      .status-meta,
      .summary-copy small {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .status-actions {
        display: flex;
        gap: 5px;
        margin-inline-start: auto;
        flex-wrap: wrap;
      }
      .status-actions button {
        font-size: 12px;
        padding: 5px 8px;
      }
      .history-layout {
        display: grid;
        gap: 12px;
        min-width: 0;
      }
      .history-list,
      .diff-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
        overflow: hidden;
      }
      .history-list-head,
      .diff-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 11px;
        border-bottom: 1px solid var(--line);
        background: #f8fafd;
      }
      .history-list-head h2,
      .diff-heading h2 {
        font-size: 13px;
        white-space: nowrap;
      }
      .history-tools,
      .route-switch,
      .diff-heading {
        flex-wrap: wrap;
      }
      .history-tools,
      .route-switch {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .history-tools button,
      .route-switch button,
      .diff-panel button {
        font-size: 11px;
        padding: 4px 7px;
      }
      .version-tree {
        position: relative;
        isolation: isolate;
      }
      .version-tree-rails {
        position: absolute;
        inset: 0 auto auto 0;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
      }
      .version-tree-scroll {
        max-height: 180px;
        overflow: auto;
      }
      .version-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .version-item {
        list-style: none;
      }
      .version-row {
        height: var(--history-row-height);
        width: 100%;
        text-align: start;
        justify-content: flex-start;
        gap: 8px;
        border-radius: 0;
        padding: 0 11px 0 var(--history-rail-width);
        white-space: nowrap;
        border-bottom-color: #edf1f6;
      }
      .version-row[data-selected='true'] {
        background: #eaf2ff;
        box-shadow: inset 2px 0 #2d65b7;
      }
      .version-row-copy {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
        flex: 1;
      }
      .version-row-copy strong {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .version-route,
      .version-date {
        font-size: 11px;
        color: var(--muted);
      }
      .version-badge,
      .visibility-pill {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        width: fit-content;
        border-radius: 5px;
        background: #e7effa;
        color: #245087;
        padding: 2px 6px;
        font-size: 11px;
      }
      .diff-panel button[aria-pressed='true'] {
        background: var(--blue);
        color: var(--accent);
      }
      .compare-search,
      .diff-panel select {
        font: inherit;
        font-size: 12px;
        border: 1px solid #cbd7e6;
        border-radius: 6px;
        padding: 5px 7px;
        background: white;
        min-width: 0;
        max-width: 100%;
      }
      .compare-search {
        width: 100%;
        margin-bottom: 7px;
      }
      .compare-file-list {
        min-width: 0;
      }
      .compare-sidebar .file-row {
        font-size: 12px;
      }
      .compare-sidebar .file-row span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .diff-panel {
        background: white;
      }
      .diff-heading {
        min-height: 39px;
      }
      .diff-direction {
        color: var(--muted);
        font-size: 11px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .diff-empty,
      .history-empty {
        padding: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .history-panel {
        padding-block: 18px;
      }
      .history-header {
        margin-bottom: 10px;
      }
      .history-header h1 {
        font-size: 23px;
      }
      .github-status {
        min-height: 46px;
        margin-bottom: 11px;
        padding-block: 6px;
      }
      @media (max-width: 1020px) {
        .work[data-history='true'] {
          grid-template-columns: 153px minmax(0, 1fr);
        }
        .work[data-history='true'] .preview {
          display: none;
        }
      }
      @media (max-width: 600px) {
        .work[data-history='true'] {
          grid-template-columns: minmax(0, 1fr);
        }
        .version-date {
          display: none;
        }
        .history-panel {
          padding-block: 11px;
        }
      }
      .version-tree-rails path {
        fill: none;
        stroke: #90a8c7;
        stroke-width: 1.6;
      }
      .version-tree-rails path[data-tone='branch'] {
        stroke: #7460ad;
      }
      .version-tree-rails circle {
        fill: white;
        stroke: #6d8aaa;
        stroke-width: 1.5;
      }
      .version-tree-rails circle[data-tone='branch'] {
        stroke: #7460ad;
      }
      .version-tree-rails circle[data-current='true'] {
        fill: #2159aa;
        stroke: #2159aa;
      }
      .version-tree-rails circle[data-selected='true'] {
        stroke: #2159aa;
        stroke-width: 2.5;
      }
      .history-count {
        margin-inline-start: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }
      .route-switch {
        padding: 3px 8px;
        border-bottom: 1px solid var(--line);
      }
      .route-switch [aria-current='true'] {
        color: var(--accent);
      }
      .compare-filters,
      .diff-tools,
      .diff-modes,
      .diff-layouts,
      .diff-title,
      .diff-stats {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .compare-filters {
        margin-bottom: 7px;
      }
      .compare-filters button {
        font-size: 11px;
        padding: 4px 6px;
        border: 1px solid transparent;
      }
      .compare-filters button[aria-pressed='true'] {
        background: var(--blue);
        color: var(--accent);
      }
      .compare-file-list {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .compare-file-list.compare-nested {
        padding-inline-start: 11px;
      }
      .compare-folder-row {
        font-weight: 600;
      }
      .compare-folder-row[aria-expanded='true'] {
        color: var(--accent);
      }
      .compare-file-name {
        min-width: 0;
        flex: 1;
        display: grid;
        gap: 1px;
      }
      .compare-file-name > span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .compare-mark {
        font:
          11px ui-monospace,
          monospace;
        color: var(--muted);
      }
      .compare-mark[data-kind='added'],
      .diff-stats [data-kind='add'] {
        color: #23633e;
      }
      .compare-mark[data-kind='deleted'],
      .diff-stats [data-kind='delete'] {
        color: #8f3044;
      }
      .compare-mark[data-kind='modified'] {
        color: #81570c;
      }
      .compare-empty {
        font-size: 12px;
        color: var(--muted);
        padding: 7px 4px;
      }
      .diff-toolbar {
        background: #f8fafd;
      }
      .diff-tools {
        flex-wrap: wrap;
        padding: 4px 10px;
        border-bottom: 1px solid var(--line);
      }
      .diff-layouts {
        margin-inline-start: auto;
      }
      .diff-title,
      .diff-heading {
        min-width: 0;
        flex-wrap: wrap;
      }
      .diff-title code {
        overflow-wrap: anywhere;
      }
      .diff-stats {
        font:
          11px ui-monospace,
          monospace;
      }
      .diff-file-select {
        display: none;
      }
      .diff-code-scroll {
        min-width: 0;
        overflow: auto;
        max-height: 234px;
        min-height: 108px;
      }
      .diff-code-table {
        width: 100%;
        border-spacing: 0;
        font:
          12px/1.55 ui-monospace,
          SFMono-Regular,
          monospace;
      }
      .diff-code-table th {
        background: var(--soft);
        text-align: start;
        font-size: 11px;
        padding: 3px 9px;
        color: var(--muted);
      }
      .diff-code-table td {
        padding: 1px 6px;
        white-space: pre;
      }
      .diff-code-table code {
        font: inherit;
        white-space: pre;
      }
      .diff-ln,
      .diff-sign {
        width: 26px;
        text-align: end;
        color: #596b81;
        user-select: none;
      }
      .diff-cell {
        width: 50%;
      }
      .diff-cell + .diff-cell {
        border-inline-start: 1px solid var(--line);
      }
      .diff-cell .diff-ln,
      .diff-cell .diff-sign {
        display: inline-block;
        margin-inline-end: 5px;
      }
      .diff-line[data-kind='add'],
      .diff-cell[data-kind='add'] {
        background: #edf8ee;
        color: #23633e;
      }
      .diff-line[data-kind='delete'],
      .diff-cell[data-kind='delete'] {
        background: #fff0f2;
        color: #8f3044;
      }
      @media (max-width: 600px) {
        .diff-file-select {
          display: flex;
          align-items: center;
          gap: 7px;
          padding: 6px 10px;
          border-bottom: 1px solid var(--line);
          font-size: 11px;
        }
        .diff-file-select select {
          flex: 1;
          min-width: 0;
        }
        .diff-tools {
          gap: 2px;
        }
        .diff-layouts {
          margin-inline-start: 0;
        }
      }
      dialog {
        border: 1px solid #c8d5e4;
        border-radius: 13px;
        width: min(490px, calc(100vw - 24px));
        max-height: calc(100dvh - 26px);
        padding: 0;
        color: var(--text);
        background: white;
        box-shadow: 0 24px 85px #172a4850;
        overflow: auto;
      }
      dialog::backdrop {
        background: #192b4854;
        backdrop-filter: blur(2px);
      }
      .modal-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 10px;
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--line);
      }
      .modal-title-group {
        display: flex;
        align-items: start;
        gap: 10px;
      }
      .modal-head p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .form-body,
      .modal-content {
        padding: 16px 18px;
        display: grid;
        gap: 13px;
      }
      .form-field,
      .field-grid label {
        display: grid;
        gap: 5px;
        min-width: 0;
      }
      .field-label,
      .form-field > span:first-child {
        font-size: 13px;
        font-weight: 630;
      }
      .field-input,
      .field-control input,
      .form-field input,
      .form-field select,
      .form-field textarea,
      .modal-content input {
        background: white;
        border: 1px solid #cbd7e6;
        border-radius: 7px;
        padding: 8px 10px;
        width: 100%;
        min-width: 0;
      }
      .form-field textarea {
        min-height: 65px;
        resize: vertical;
      }
      .field-control {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .location-button {
        border: 1px solid var(--line);
        flex: none;
        justify-content: flex-start;
        text-align: start;
      }
      .location-button span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .field-note {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .form-summary,
      .manage-repo {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 10px;
        background: #f1f6fd;
        border: 1px solid #d8e5f5;
        border-radius: 7px;
      }
      .advanced-button {
        justify-content: start;
        color: var(--accent);
        padding: 5px 0;
        align-self: start;
        width: fit-content;
        font-size: 13px;
      }
      .advanced-fields {
        display: grid;
        gap: 10px;
        padding: 10px 0 0;
        border-top: 1px solid var(--line);
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .radio-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        border: 0;
        padding: 0;
        margin: 0;
      }
      .radio-grid legend {
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 5px;
      }
      .radio-option {
        display: flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--line);
        padding: 6px;
        border-radius: 6px;
        font-size: 12px;
      }
      .radio-option:has(:checked) {
        background: var(--blue);
        border-color: #9bb8df;
      }
      .radio-option input {
        width: auto;
        accent-color: var(--accent);
        margin: 0;
      }
      .publish-note,
      .form-error,
      .callout,
      .manage-note {
        padding: 9px 10px;
        border: 1px solid #efdcb9;
        border-radius: 7px;
        background: #fff9ee;
        color: #6d4c19;
        font-size: 12px;
      }
      .form-error {
        border-color: #efd2d8;
        background: #fff1f3;
        color: var(--danger);
      }
      .modal-foot {
        position: sticky;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        background: #fff;
        flex-wrap: wrap;
      }
      .modal-foot .form-secondary:first-child {
        margin-inline-end: auto;
      }
      .manage-panel {
        padding: 16px 18px;
        display: grid;
        gap: 12px;
      }
      .manage-head {
        display: flex;
        justify-content: space-between;
        align-items: start;
      }
      .manage-head p {
        color: var(--muted);
        font-size: 12px;
      }
      .manage-repo {
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .manage-repo-copy {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .manage-note {
        border: 0;
        background: none;
        padding: 2px 0;
      }
      .toggle-switch {
        width: 36px;
        height: 22px;
        padding: 2px;
        border: 1px solid #a9b8ca;
        background: #dce4ee;
        border-radius: 20px;
        justify-content: start;
      }
      .toggle-switch[aria-checked='true'] {
        background: var(--accent);
        border-color: var(--accent);
        justify-content: end;
      }
      .toggle-switch span {
        display: block;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 1px 2px #28394c32;
      }
      .manage-panel h2 {
        font-size: 19px;
      }
      .manage-setting,
      .manage-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .manage-setting {
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
      }
      .manage-setting p {
        font-size: 12px;
        color: var(--muted);
      }
      .modal-content p {
        font-size: 13px;
        color: #465a70;
      }
      .modal-content label {
        display: grid;
        gap: 5px;
      }
      .toast {
        position: fixed;
        bottom: 57px;
        right: max(25px, calc((100vw - 1370px) / 2));
        z-index: 3;
        background: #1b344f;
        color: #fff;
        padding: 9px 12px;
        border-radius: 8px;
        box-shadow: 0 8px 20px #1c334a35;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toast:empty {
        display: none;
      }
      .toast button {
        color: #d5e9ff;
        padding: 3px 6px;
      }
      .toast button:hover {
        background: #314f6d;
      }
      .notes {
        font-size: 12px;
        color: #465a70;
      }
      .review-link {
        white-space: nowrap;
      }
      @media (max-width: 1110px) {
        .work {
          grid-template-columns: 150px minmax(0, 1fr) 164px;
        }
        .preview {
          padding: 9px;
        }
        .history-panel {
          padding-inline: 20px;
        }
        .history-layout {
          gap: 9px;
        }
        .version-date {
          display: none;
        }
      }
      @media (max-width: 875px) {
        .work {
          grid-template-columns: 132px minmax(0, 1fr);
        }
        .preview {
          display: none;
        }
        .window {
          grid-template-rows: 48px minmax(550px, 1fr) 43px;
        }
        .review {
          align-items: flex-start;
        }
        .review-brand small {
          display: none;
        }
      }
      @media (max-width: 600px) {
        .window {
          width: calc(100% - 14px);
        }
        .review {
          padding: 8px;
          gap: 8px;
          flex-wrap: wrap;
        }
        .review-controls {
          gap: 4px;
        }
        .review select {
          max-width: 155px;
        }
        .work {
          grid-template-columns: minmax(0, 1fr);
        }
        .sidebar,
        .traffic {
          display: none;
        }
        .toolbar {
          gap: 4px;
          padding: 0 6px;
        }
        .toolbar .right {
          gap: 3px;
        }
        .toolbar button {
          font-size: 11px;
          padding: 5px;
        }
        .toolbar-title {
          max-width: 100px;
        }
        .history-panel,
        .home,
        .editor {
          padding: 18px 11px;
        }
        .history-layout {
          grid-template-columns: 1fr;
        }
        .github-status {
          gap: 5px;
          align-items: start;
        }
        .status-actions {
          max-width: 48%;
          justify-content: flex-end;
        }
        .status-actions button {
          padding: 4px;
        }
        .review-foot {
          padding: 10px 9px;
          align-items: start;
        }
        .field-grid {
          grid-template-columns: 1fr;
        }
        .modal-foot {
          gap: 4px;
        }
        .modal-foot button {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header class="review">
      <div class="review-brand">
        <span>PNDS 创作评审</span><small>交互原型</small>
      </div>
      <div class="review-controls">
        <label
          >场景
          <select id="scenario"></select></label
        ><button data-action="reset">重置场景</button>
      </div>
    </header>
    <div class="window" id="app"></div>
    <footer class="review-foot">
      <span id="hint"></span
      ><a
        class="review-link"
        href="../plans/creation-project-and-versions-design.md"
        >设计稿</a
      >
    </footer>
    <dialog id="modal" aria-labelledby="dialog-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      function newProjectCopy() {
        const form = s.form
        const publishing = form.mode === 'publish'
        const local = form.visibility === 'local' && !publishing
        const signedOut = s.auth === 'signed-out'
        const authorizationNeeded = !local && s.auth !== 'ready'
        const visibility = local
          ? '仅在本机'
          : form.visibility === 'private'
            ? '私有'
            : '公开'
        const target = local
          ? '暂不上传到 GitHub'
          : signedOut
            ? '连接账号后显示仓库地址'
            : '@' + (form.owner || 'mira') + '/' + (form.slug || '未命名仓库')
        const primary = local
          ? '创建本地工程'
          : authorizationNeeded
            ? signedOut
              ? '连接 GitHub'
              : '继续授权'
            : publishing
              ? form.visibility === 'private'
                ? '上传到私有仓库'
                : '公开到 GitHub'
              : form.visibility === 'private'
                ? '创建并上传到 GitHub'
                : '创建并公开到 GitHub'
        const path =
          (form.parent || '').replace(/\/$/, '') +
          '/' +
          (form.folder || '未命名工程')
        return {
          publishing,
          local,
          signedOut,
          authorizationNeeded,
          visibility,
          target,
          primary,
          path,
        }
      }

      function refreshFormSummary() {
        if (!s.form) return
        const copy = newProjectCopy()
        const summaries = {
          target: copy.target,
          visibility: copy.visibility,
          path: copy.path,
          primary: copy.primary,
        }
        for (const [name, value] of Object.entries(summaries)) {
          const field = document.querySelector('[data-form-' + name + ']')
          if (field) field.textContent = value
        }
        const parent = document.querySelector('[data-field="parent"]')
        if (parent && parent !== document.activeElement)
          parent.value = s.form.parent || ''
        for (const name of ['folder', 'slug']) {
          const field = document.querySelector('[data-field="' + name + '"]')
          if (field && field !== document.activeElement)
            field.value = s.form[name] || ''
        }
      }

      function newProjectPanel() {
        const form = s.form
        const {
          publishing,
          local,
          signedOut,
          authorizationNeeded,
          visibility,
          target,
          primary,
          path,
        } = newProjectCopy()
        const title = publishing ? '上传到 GitHub' : '新建工程'
        const accounts = [
          ...new Set(['mira', 'pond-lab', form.owner].filter(Boolean)),
        ]
        const visibilityOptions = [
          ['public', '公开'],
          ['private', '私有'],
          ...(!publishing ? [['local', '暂不上传']] : []),
        ]
        const input = (name, label, placeholder = '') => `
    <label class="form-field">
      <span class="field-label">${label}</span>
      <input class="field-input" data-field="${name}" value="${esc(form[name] || '')}" placeholder="${placeholder}" autocomplete="off" />
    </label>
  `
        const history = []
        const versions = new Map(
          (s.versions || []).map(version => [version.id, version])
        )
        let version = versions.get(s.current)
        while (version && !history.includes(version)) {
          history.push(version)
          version = versions.get(version.parent)
        }

        return `
    <header class="modal-head">
      <div class="modal-title-group">
        <span class="modal-icon" aria-hidden="true">${icon(publishing ? 'cloud' : 'plus')}</span>
        <div>
          <h2 id="prototype-dialog-title">${title}</h2>
          <p>${publishing ? '为「' + esc(s.project || '当前工程') + '」创建仓库' : '从 PNDS 空白工程开始创作。'}</p>
        </div>
      </div>
      <button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭">${icon('x')}</button>
    </header>
    <form class="project-form">
      <div class="form-body">
        ${
          publishing
            ? ''
            : `
          ${input('name', '工程名称', '输入工程名称')}
          <div class="form-field">
            <label class="field-label" for="project-location">保存位置</label>
            <div class="field-control">
              <input id="project-location" class="field-input" data-field="parent" value="${esc(form.parent || '')}" autocomplete="off" />
              <button type="button" class="button location-button" data-action="choose-folder">${icon('folder')} 更改</button>
            </div>
            <p class="field-note" data-form-path>${esc(path)}</p>
          </div>
        `
        }
        <div class="form-summary" aria-live="polite">
          <span class="summary-icon" aria-hidden="true">${icon(local ? 'folder' : form.visibility === 'private' ? 'lock' : 'cloud')}</span>
          <div class="summary-copy">
            <strong>${local ? '本机' : 'GitHub'}</strong>
            <span data-form-target>${esc(target)}</span>
          </div>
          <span class="visibility-pill" data-visibility="${form.visibility}" data-form-visibility>${visibility}</span>
        </div>
        ${
          publishing
            ? `
          <div class="publish-note">
            <strong>将上传当前路线${s.route ? '「' + esc(routeTitle(s.route)) + '」' : ''}的已保存历史</strong>
            ${history.length ? `<p>${history.length} 个已保存版本 · 最新「${esc(history[0].name)}」</p>` : ''}
            <p>${form.visibility === 'private' ? '有仓库访问权限的人可以看到' : '所有人都可以看到'}历史，包括曾经保存、后来删除的文件和提交邮箱。</p>
          </div>
        `
            : ''
        }
        <button type="button" class="advanced-button" data-action="advanced-toggle" aria-expanded="${Boolean(form.advanced)}" aria-controls="new-project-advanced">
          ${icon('chevron')} 高级选项
        </button>
        <div id="new-project-advanced" class="advanced-fields" ${form.advanced ? '' : 'hidden'}>
          <fieldset class="form-field">
            <legend class="field-label">GitHub 仓库可见性</legend>
            <div class="radio-grid">
              ${visibilityOptions
                .map(
                  ([key, label]) => `
                <label class="radio-option">
                  <input type="radio" name="github-visibility" data-field="visibility" value="${key}" ${form.visibility === key ? 'checked' : ''} />
                  <span>${label}</span>
                </label>
              `
                )
                .join('')}
            </div>
          </fieldset>
          ${
            local
              ? ''
              : `
            <div class="field-grid">
              <label class="form-field">
                <span class="field-label">仓库所有者</span>
                <select class="field-input" data-field="owner" ${signedOut ? 'disabled' : ''}>
                  ${accounts.map(account => `<option value="${esc(account)}" ${form.owner === account ? 'selected' : ''}>${esc(account)}${account === 'mira' ? '（个人）' : account === 'pond-lab' ? '（组织）' : ''}</option>`).join('')}
                </select>
              </label>
              ${input('slug', '仓库名称')}
            </div>
          `
          }
          ${
            publishing
              ? ''
              : `
            <div class="field-grid">
              ${input('folder', '本地文件夹名称')}
              ${input('author', '作者（选填）')}
            </div>
            ${input('description', '简介（选填）')}
            ${input('email', '提交邮箱（选填）', '默认使用占位邮箱')}
          `
          }
        </div>
        ${form.error ? `<p class="form-error" role="alert">${esc(form.error)}</p>` : ''}
      </div>
      <footer class="modal-foot">
        ${authorizationNeeded && !publishing ? '<button type="button" class="button form-secondary" data-action="local-first">先在本机创建</button>' : ''}
        <button type="button" class="button" data-action="close-dialog">取消</button>
        <button type="button" class="button primary" data-action="new-submit" data-form-primary>${primary}</button>
      </footer>
    </form>
  `
      }
      function routeTitle(route) {
        if (!route || route === 'main') return '主路线'
        if (route === 'experiment') return '声音实验'
        return route
      }

      function historyButton(
        action,
        label,
        { glyph, style = 'quiet', attrs = '' } = {}
      ) {
        return `<button class="btn btn-${style}" type="button" data-action="${action}" ${attrs}>${glyph ? icon(glyph) : ''}<span>${label}</span></button>`
      }

      function githubLine() {
        const currentRoute = s.route || 'main'
        const isInitial = Boolean(s.initialPending) || s.github === 'initial'
        const status = isInitial ? 'initial' : s.github
        const label = s.visibility === 'private' ? '私有' : '公开'
        const count = Number(s.count)
        const states = {
          initial: ['工程已创建，GitHub 上传未完成', '继续上传', 'warn'],
          local: ['仅在本机', '上传到 GitHub', 'neutral'],
          ahead: [
            count > 0 ? `有 ${count} 个版本尚未备份` : '有版本尚未备份',
            '备份到 GitHub',
            'neutral',
          ],
          synced: ['当前路线已备份', '', 'success'],
          pending: ['已保存到本机，待备份', '', 'warn'],
          behind: ['GitHub 有新版本', '从 GitHub 更新', 'neutral'],
          conflict: ['本机与 GitHub 各有新版本', '查看处理方法', 'warn'],
          auth: ['需要 GitHub 授权', '重新授权', 'warn'],
          paused: ['自动备份已暂停', '查看此路线设置', 'warn'],
          deleted: ['GitHub 上的路线已删除', '确认重建', 'warn'],
          visibility: [`仓库已改为${label}`, '确认后继续', 'warn'],
          offline: ['离线 · 上次检查结果', '刷新', 'warn'],
          detached: ['正在查看历史位置', '', 'neutral'],
        }
        const [message, action, tone] = states[status] || states.local
        const metadata =
          status === 'local'
            ? '版本保存在这台 Mac'
            : status === 'pending'
              ? '回到这条路线并联网后继续'
              : [
                  s.repo,
                  s.visibility !== 'local' && s.repo ? label : null,
                  s.offline && status !== 'offline' ? '上次检查结果' : null,
                ]
                  .filter(Boolean)
                  .join(' · ')
        const glyph = status === 'synced' ? 'check' : 'cloud'
        const targetAction =
          status === 'paused'
            ? 'manage'
            : status === 'offline'
              ? 'refresh'
              : 'remote-action'
        const routeLabel = esc(routeTitle(currentRoute))
        return `<section class="github-status" data-tone="${tone}" aria-label="GitHub 状态">
    <div class="status-symbol" aria-hidden="true">${icon(glyph)}</div>
    <div class="status-copy" aria-live="polite">
      <span class="status-label">${message}</span>
      ${metadata ? `<span class="status-meta">${esc(metadata)}</span>` : ''}
    </div>
    <div class="status-actions">
      ${action ? historyButton(targetAction, action, { style: 'outline', attrs: `data-status="${status}"` }) : ''}
      ${historyButton('manage', '管理', { attrs: `aria-label="管理 ${routeLabel}的 GitHub 仓库"` })}
    </div>
  </section>`
      }

      function comparisonSnapshot(entry) {
        const files = {
          'README.md':
            '# ' + s.project + '\n\n一部以水面波纹为线索的数字乐谱。\n',
          'manifest.json': JSON.stringify(
            { name: s.project, entry: 'public/performer.js', version: 1 },
            null,
            2
          ),
          'public/style.css':
            ':root {\n  color-scheme: dark;\n  background: #192b3b;\n}\n',
          'server.js':
            "import { start } from './pnds.js'\n\nstart({ port: 8090 })\n",
          'public/guide.txt': '按空格键开始\n请留意波纹中的节奏变化\n',
        }
        const level =
          entry?.parent == null
            ? 0
            : entry.parent === 'a' || entry.id === 'b'
              ? 1
              : 2
        const ink =
          level === 0
            ? '123, 167, 203'
            : level === 1
              ? '142, 194, 240'
              : '158, 210, 251'
        const weight = level === 0 ? '1' : level === 1 ? '1.25' : '2'
        const tempo = entry?.route === 'experiment' ? 64 : level === 2 ? 76 : 90
        files['public/performer.js'] = `function setup() {
  createCanvas(windowWidth, windowHeight)
}

function draw() {
  background(25, 43, 59)
  stroke(${ink})
  strokeWeight(${weight})
  drawRipples(${tempo})
}
`
        if (level >= 1) {
          files['public/ripples.js'] =
            'export function drawRipples(tempo) {\n  const phase = frameCount * tempo / 3600\n  const radius = 28 + sin(phase) * 12\n  circle(width / 2, height / 2, radius * 2)\n}\n'
        }
        if (level >= 2) {
          delete files['public/guide.txt']
          files['public/style.css'] = files['public/style.css'].replace(
            '#192b3b',
            '#203849'
          )
        }
        return entry?.files ?? files
      }

      function comparisonFiles() {
        const selected = version(s.selected)
        if (!selected) return []
        const current = version(s.current)
        const working = comparisonSnapshot(current)
        Object.assign(working, s.savedFiles)
        const againstSaved = s.compareMode === 'saved'
        const before = againstSaved
          ? comparisonSnapshot(selected)
          : selected.parent
            ? comparisonSnapshot(version(selected.parent))
            : {}
        const after = againstSaved ? working : comparisonSnapshot(selected)
        const order = new Set([
          'public/performer.js',
          ...Object.keys(after),
          ...Object.keys(before),
        ])
        return Array.from(order)
          .filter(path => path in before || path in after)
          .map(path => {
            const from = before[path] ?? null
            const to = after[path] ?? null
            return {
              path,
              kind:
                from === to
                  ? 'unchanged'
                  : from === null
                    ? 'added'
                    : to === null
                      ? 'deleted'
                      : 'modified',
              before: from,
              after: to,
              exists: path in working,
            }
          })
      }

      const compareLabels = {
        added: '新增',
        modified: '修改',
        deleted: '已删除',
        unchanged: '未变更',
      }
      const compareMarks = {
        added: '+',
        modified: 'M',
        deleted: '−',
        unchanged: '—',
      }

      function selectedComparison(files) {
        return (
          files.find(file => file.path === s.compareFile) ||
          files.find(file => file.kind !== 'unchanged') ||
          files[0]
        )
      }

      function compareSidebar() {
        const files = comparisonFiles()
        const selected = selectedComparison(files)
        const search = String(s.compareSearch || '')
          .trim()
          .toLowerCase()
        const displayed = files.filter(
          file =>
            (s.compareAll || file.kind !== 'unchanged') &&

      function compareLines(before, after) {
        const from =
          before == null
            ? []
            : before.replace(/\n$/, '').split('\n').slice(0, 250)
        const to =
          after == null
            ? []
            : after.replace(/\n$/, '').split('\n').slice(0, 250)
        const lengths = Array.from({ length: from.length + 1 }, () =>
          Array(to.length + 1).fill(0)
        )
        for (let i = from.length - 1; i >= 0; i--) {
          for (let j = to.length - 1; j >= 0; j--) {
            lengths[i][j] =
              from[i] === to[j]
                ? 1 + lengths[i + 1][j + 1]
                : Math.max(lengths[i + 1][j], lengths[i][j + 1])
          }
        }
        const lines = []
        let i = 0,
          j = 0
        while (i < from.length || j < to.length) {
          if (i < from.length && j < to.length && from[i] === to[j]) {
            lines.push({
              kind: 'context',
              old: i + 1,
              next: j + 1,
              text: from[i],
            })
            i++
            j++
          } else if (
            i < from.length &&
            (j === to.length || lengths[i + 1][j] >= lengths[i][j + 1])
          ) {
            lines.push({ kind: 'delete', old: i + 1, text: from[i] })
            i++
          } else {
            lines.push({ kind: 'add', next: j + 1, text: to[j] })
            j++
          }
        }
        return lines
      }

      function diffPanel() {
        const inspected = version(s.selected)

        const from = againstSaved
          ? inspected?.name

            : '空工程'
        const to = againstSaved ? '当前已保存文件' : inspected?.name
        const lines = file ? compareLines(file.before, file.after) : []
        const added = lines.filter(line => line.kind === 'add').length
        const removed = lines.filter(line => line.kind === 'delete').length
        const sign = line =>
          line?.kind === 'add' ? '+' : line?.kind === 'delete' ? '−' : ''
        const splitCell = (line, side) =>
          `<td class="diff-cell" data-kind="${line?.kind || 'empty'}"><span class="diff-ln">${side === 'old' ? line?.old || '' : line?.next || ''}</span><span class="diff-sign">${sign(line)}</span><code class="diff-code">${esc(line?.text ?? '')}</code></td>`
        const splitRow = (left, right) =>
          '<tr class="diff-line">' +
          splitCell(left, 'old') +
          splitCell(right, 'next') +
          '</tr>'
        let rows = ''
        if (split) {
          let oldLines = [],
            newLines = []
          const flush = () => {
            for (let i = 0; i < Math.max(oldLines.length, newLines.length); i++)
              rows += splitRow(oldLines[i], newLines[i])
            oldLines = []
            newLines = []
          }
          for (const line of lines) {
            if (line.kind === 'context') {
              flush()
              rows += splitRow(line, line)
            } else if (line.kind === 'delete') oldLines.push(line)
            else newLines.push(line)
          }
          flush()
        } else {
          rows = lines
            .map(
              line =>
                `<tr class="diff-line" data-kind="${line.kind}"><td class="diff-ln">${line.old || ''}</td><td class="diff-ln">${line.next || ''}</td><td class="diff-sign">${sign(line)}</td><td><code class="diff-code">${esc(line.text)}</code></td></tr>`

        <div class="diff-layouts" role="group" aria-label="差异布局">

        </div>

          : ''
      }

      files.length
        ? `<label class="diff-file-select">比较文件
      <select id="compare-mobile-file" aria-label="选择比较文件">${files.map(option => `<option value="${esc(option.path)}" ${file?.path === option.path ? 'selected' : ''}>${esc(option.path)}（${compareLabels[option.kind]}）</option>`).join('')}</select>

    ${

      <table class="diff-code-table" data-layout="${split ? 'split' : 'unified'}">${split ? '<thead><tr><th scope="col">之前</th><th scope="col">之后</th></tr></thead>' : ''}<tbody>${rows}</tbody></table>

            $('modal')
              .querySelector('[data-action="advanced-toggle"]')
              .setAttribute('aria-expanded', String(s.form.advanced))
            break
          }
          case 'choose-folder':
            s.returnDialog = 'form'
            dialog('folder')
            break
          case 'folder-pick':
            s.form.parent = data.id
            dialog('form')
            break
          case 'close-dialog':
            closeDialog()
            break
          case 'auth-complete': {
            s.auth = 'ready'
            const target = s.returnDialog
            s.returnDialog = null
            if (s.block === 'auth') s.block = null
            render()
            dialog(target)
            announce('已连接 @mira')
            break
          }
          case 'settings':
            dialog('settings')
            break
          case 'sign-out':
            s.auth = 'signed-out'
            if (s.repo) s.block = 'auth'
            render()
            dialog('settings')
            break
          case 'account-connect':
            s.returnDialog = 'settings'
            dialog('auth')
            break
          case 'select-version':
            s.selected = data.id
            render()
            break
          case 'compare-filter':
            s.compareAll = data.id === 'all'
            render()
            break
          case 'compare-folder':
            if (s.compareCollapsed.has(data.id))
              s.compareCollapsed.delete(data.id)
            else s.compareCollapsed.add(data.id)
            render()
            break
          case 'compare-file':
            s.compareFile = data.id
            render()
            break
          case 'diff-layout':
            s.compareLayout = data.id
            render()
            break
          case 'diff-mode':
            s.compareMode = data.id
            render()
            break
          case 'continue-version':
            trySwitch(data.id, null)
            break
          case 'switch-route':
            trySwitch(tip(data.route)?.id, data.route)
            break
          case 'switch-confirm':
            switchVersion()
            break
          case 'save-switch':
            if (saveVersion()) switchVersion()
            break
          case 'discard':
            dialog('discard')
            break
          case 'rename-version':
            s.rename = data.id
            dialog('rename')
            break
          case 'rename-confirm': {
            const name = $('new-version-name').value.trim()
            if (name) {
              version(s.rename).name = name
              closeDialog()
              render()
              announce('版本名称已更新')
            }
            break
          }
          case 'remote-action':
            remoteAction(data.status)
            break
          case 'remote-confirm':
            confirmRemote()
            break
          case 'manage':
            dialog('manage')
            break
          case 'manage-toggle': {
            if (!s.route || !s.backed[s.route]) break
            if (!s.auto[s.route] && s.block && s.block !== 'paused') {
              announce('先处理当前 GitHub 状态')
              break
            }
            s.auto[s.route] = !s.auto[s.route]
            if (s.block === 'paused') s.block = null
            if (!s.auto[s.route]) delete s.queue[s.route]
            flushQueue()
            render()
            renderDialog()
            $('modal').querySelector('[data-action="manage-toggle"]')?.focus()
            break
          }
          case 'refresh':
            flushQueue()
            render()
            if (s.dialog) renderDialog()
            announce(
              s.offline ? '离线 · 保留上次检查结果' : '已检查 GitHub 状态'
            )
            break
          case 'open-repo':
            dialog('repo')
            break
          case 'clone':
          case 'bind':
            s.menu = false
            render()
            dialog(action)
            break
          case 'rebind':
            dialog('rebind')
            break
          case 'repo-confirm': {
            const repo = $('repo-name').value.trim()
            if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) {
              $('repo-name').setCustomValidity('请输入 owner/repo')
              $('repo-name').reportValidity()
              break
            }
            const clone = s.dialog === 'clone'
            if (clone) {
              s.project = repo.split('/')[1]
              s.versions = sample.map(x => ({ ...x }))
              s.route = 'main'
              s.current = 'c'
              s.selected = null
              s.dirty = false
              s.changed = false
              s.savedFiles = {}
              s.drafts = {}
              s.compareFile = ''
              s.compareMode = 'parent'
              s.view = 'history'
              s.running = false
            }
            Object.assign(s, {
              repo,
              visibility: 'public',
              auto: {},
              queue: {},
              remote: clone ? { main: s.current } : {},
              backed: {},
              initialPending: null,
              block: null,
            })
            closeDialog()
            render()
            announce(clone ? '已打开示例 GitHub 工程' : '已绑定示例仓库')
            break
          }
          case 'unbind':
            dialog('unbind')
            break
          case 'unbind-confirm':
            Object.assign(s, {
              repo: '',
              visibility: 'local',
              auto: {},
              queue: {},
              remote: {},
              backed: {},
              initialPending: null,
              block: null,
            })
            closeDialog()
            render()
            announce('已解绑，工程版本保留在本机')
            break
        }
      }
      for (const [value, [label]] of Object.entries(scenes))
        $('scenario').add(new Option(label, value))
      $('scenario').addEventListener('change', event => {
        scene = event.target.value
        $('toast').replaceChildren()
        init()
      })
      document.addEventListener('click', event => {
        const trigger = event.target.closest('button[data-action]')
        if (!trigger || trigger.disabled) return
        const action = trigger.dataset.action
        act(action, trigger.dataset)
        if (
          !trigger.isConnected &&
          !$('modal').open &&
          document.activeElement === document.body
        ) {
          const replacement = [
            ...document.querySelectorAll(
              'button[data-action="' + action + '"]'
            ),
          ].find(
            button =>
              button.dataset.id === trigger.dataset.id &&
              button.dataset.route === trigger.dataset.route
          )
          replacement?.focus({ preventScroll: true })
        }
      })
      document.addEventListener('input', event => {
        const input = event.target
        if (input.id === 'compare-search') {
          s.compareSearch = input.value
          const cursor = input.selectionStart
          render()
          const search = $('compare-search')
          search?.focus({ preventScroll: true })
          search?.setSelectionRange(cursor, cursor)
          return
        }
        if (input.id === 'compare-mobile-file') {
          act('compare-file', { id: input.value })
          $('compare-mobile-file')?.focus({ preventScroll: true })
          return
        }
        if (input.id === 'repo-name') input.setCustomValidity('')
        if (input.id === 'source') {
          s.drafts[s.file] = input.value
          s.dirty = true
          $('file-state').textContent = '未保存草稿'
          return
        }
        if (!s.form || !input.dataset.field) return
        const field = input.dataset.field
        s.form[field] = input.value
        s.form.error = ''
        $('modal').querySelector('.form-error')?.remove()
        if (field === 'name') {
          if (!s.form.folderEdited) s.form.folder = folderName(input.value)
          if (!s.form.slugEdited) s.form.slug = slugName(input.value)
        }
        if (field === 'folder' || field === 'slug')
          s.form[field + 'Edited'] = true
        if (field === 'visibility') {
          renderDialog()
          $('modal').querySelector('[data-field="visibility"]:checked')?.focus()
        } else refreshFormSummary()
      })
      $('modal').addEventListener('submit', event => {
        event.preventDefault()
        if (s.dialog === 'form') submitForm()
      })
      $('modal').addEventListener('cancel', event => {
        event.preventDefault()
        closeDialog()
      })
      document.addEventListener('keydown', event => {
        if (
          event.key.toLowerCase() === 's' &&
          (event.metaKey || event.ctrlKey) &&
          s.view === 'editor' &&
          !s.dialog
        ) {
          event.preventDefault()
          act('save-file')
        }
        if (
          event.key === 'Enter' &&
          event.target.matches('.project-form input:not([type=radio])')
        ) {
          event.preventDefault()
          submitForm()
        }
        if (event.key === 'Escape' && !s.dialog && s.menu) {
          s.menu = false
          render()
          $('app').querySelector('[data-action="project-menu"]')?.focus()
        }
      })
      init()
    </script>
  </body>
</html>
