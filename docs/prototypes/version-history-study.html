<!doctype html>
<html lang="zh-CN" data-color-theme="pond">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNDS · Version history prototype</title>
    <!-- Throwaway review: extend the approved A layout with a minimal merge workflow.
         Merge review: ?variant=A&scene=merge|merge-conflict|merge-ready|merge-test|merge-binary|merge-audio|merge-stale|merge-recovery|merge-ff
         A inspector + branch tree, B graph + diff, C current work + expandable history.
         ?variant=A|B|C&scene=dirty|clean|branch|offline|update|diverged|interrupted|local|protected
         Existing creation workspace shell is represented; all mutations are memory-only stubs. -->
    <link rel="stylesheet" href="../../src/theme-variables.css" />
    <style>
      :root {
        --bg: var(--pnds-creation-shell);
        --surface: var(--pnds-creation-workspace);
        --raised: var(--pnds-creation-raised);
        --inset: var(--pnds-creation-inset);
        --toolbar: var(--pnds-creation-toolbar);
        --line: var(--pnds-creation-line);
        --hair: var(--pnds-creation-hair);
        --ink: var(--pnds-text);
        --muted: var(--pnds-text-secondary);
        --accent: var(--pnds-accent-text);
        --selected: var(--pnds-selection);
        --success: var(--pnds-success);
        --warning: var(--pnds-warning-text);
        --danger: var(--pnds-danger);
        --radius: 8px;
        font: 13px/1.5 var(--pnds-font-ui);
        color: var(--ink);
        color-scheme: light;
      }
      [data-color-theme='stage'] {
        color-scheme: dark;
      }
      [data-color-theme='brutal'] {
        --radius: 0px;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-block-size: 100dvh;
        padding: 22px 24px 103px;
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      button,
      input,
      select,
      summary {
        border-radius: 5px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:hover:not(:disabled) {
        background: var(--inset);
      }
      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      svg.icon {
        inline-size: 16px;
        block-size: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
      }
      .btn {
        min-block-size: 32px;
        padding: 5px 10px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        border: 1px solid var(--line);
        background: var(--raised);
        font-weight: 550;
      }
      .btn.primary {
        background: var(--pnds-accent);
        color: var(--pnds-accent-foreground);
        border-color: transparent;
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--pnds-accent-hover);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        font-weight: 450;
      }
      .btn.small {
        min-block-size: 28px;
        padding: 3px 8px;
        font-size: 12px;
      }
      .icon-btn {
        inline-size: 30px;
        block-size: 30px;
        display: inline-grid;
        place-items: center;
        flex: none;
      }
      .muted {
        color: var(--muted);
      }
      .fine {
        font-size: 11px;
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        line-height: 18px;
        background: var(--inset);
        white-space: nowrap;
        font-weight: 500;
      }
      .pill.current {
        color: var(--accent);
        background: var(--selected);
      }
      .pill.viewing {
        color: var(--muted);
        border: 1px solid var(--line);
        background: transparent;
      }
      .window {
        margin-inline: auto;
        max-inline-size: 1440px;
        block-size: max(520px, calc(100dvh - 125px));
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        overflow: hidden;
        box-shadow: 0 18px 65px -35px #17293866;
        display: grid;
        grid-template-rows: 42px minmax(0, 1fr) 42px;
      }
      [data-color-theme='brutal'] .window {
        border-radius: 0;
        box-shadow: 4px 4px 0 var(--ink);
      }
      .titlebar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-inline: 16px;
        background: var(--toolbar);
        border-block-end: 1px solid var(--hair);
      }
      .traffic {
        display: flex;
        gap: 7px;
        margin-inline-end: 15px;
      }
      .traffic i {
        inline-size: 11px;
        block-size: 11px;
        border-radius: 50%;
        background: #f06a61;
        border: 1px solid #0001;
      }
      .traffic i:nth-child(2) {
        background: #eaba4c;
      }
      .traffic i:nth-child(3) {
        background: #65ba6b;
      }
      .project {
        font-weight: 600;
        font-size: 13px;
      }
      .titlebar .muted {
        font-size: 11px;
      }
      .spacer {
        flex: 1;
      }
      .body {
        min-block-size: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 244px;
      }
      .body.no-preview {
        grid-template-columns: minmax(0, 1fr);
      }
      .workspace {
        min-inline-size: 0;
        min-block-size: 0;
        display: grid;
        grid-template-rows: 42px 54px minmax(0, 1fr);
      }
      .tabs {
        display: flex;
        align-items: stretch;
        gap: 19px;
        padding-inline: 20px;
        border-block-end: 1px solid var(--line);
      }
      .tab {
        font-size: 12px;
        color: var(--muted);
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tab.active {
        color: var(--ink);
        font-weight: 600;
      }
      .tab.active:after {
        content: '';
        position: absolute;
        inset-block-end: -1px;
        inset-inline: 0;
        block-size: 2px;
        background: var(--accent);
      }
      .workspace > .context {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-inline: 20px;
        border-block-end: 1px solid var(--line);
        background: var(--toolbar);
        min-inline-size: 0;
      }
      .location {
        display: flex;
        gap: 6px;
        align-items: center;
        min-inline-size: 0;
        font-size: 12px;
      }
      .location strong {
        font-weight: 600;
      }
      .location .current-name {
        max-inline-size: 170px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .remote {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-inline-start: auto;
        font-size: 11px;
        white-space: nowrap;
      }
      .remote.warn {
        color: var(--warning);
      }
      .remote .icon {
        inline-size: 15px;
      }
      .variant {
        min-block-size: 0;
        min-inline-size: 0;
        overflow: hidden;
      }
      .layout-a {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        block-size: 100%;
      }
      .history-rail {
        border-inline-end: 1px solid var(--line);
        background: var(--toolbar);
        min-block-size: 0;
        overflow: auto;
        padding-block: 12px;
      }
      .rail-tools {
        display: flex;
        gap: 6px;
        align-items: center;
        padding-inline: 12px;
        margin-block-end: 9px;
      }
      .rail-tools select {
        min-inline-size: 0;
        inline-size: 100%;
        border: 1px solid var(--line);
        background: var(--raised);
        padding: 5px 8px;
        font-size: 12px;
      }
      .history-heading {
        padding: 14px 15px 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .history-item {
        position: relative;
        display: flex;
        text-align: start;
        inline-size: calc(100% - 16px);
        margin-inline: 8px;
        padding: 10px 9px;
        gap: 9px;
        border: 1px solid transparent;
        border-radius: 6px;
      }
      .history-item:hover {
        background: var(--inset);
      }
      .history-item[aria-pressed='true'] {
        background: var(--raised);
        border-color: var(--line);
        box-shadow: 0 1px 3px #00000006;
      }
      .history-item[aria-pressed='true']:before {
        content: '';
        position: absolute;
        inset-inline-start: -9px;
        inset-block: 9px;
        inline-size: 3px;
        background: var(--accent);
      }
      .node {
        inline-size: 11px;
        block-size: 11px;
        border-radius: 50%;
        border: 2px solid var(--muted);
        margin-block-start: 4px;
        flex: none;
        position: relative;
      }
      .node:after {
        content: '';
        position: absolute;
        inset-block-start: 13px;
        inset-inline-start: 2px;
        block-size: 34px;
        border-inline-start: 1px solid var(--line);
      }
      .history-item:last-child .node:after {
        display: none;
      }
      .history-item.working .node {
        border-style: dashed;
        border-color: var(--accent);
      }
      .history-item.at-head .node {
        background: var(--accent);
        border-color: var(--accent);
      }
      .history-item.fork .node {
        border-color: var(--success);
      }
      .history-item.fork {
        margin-inline-start: 26px;
        inline-size: calc(100% - 34px);
      }
      .item-copy {
        min-inline-size: 0;
        flex: 1;
      }
      .item-title {
        font-size: 12px;
        font-weight: 550;
        line-height: 1.6;
      }
      .item-meta {
        margin-block-start: 3px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 5px;
        font-size: 10px;
        color: var(--muted);
      }
      .inspector {
        min-inline-size: 0;
        min-block-size: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
      }
      .selection-head {
        padding: 17px 20px 14px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        min-inline-size: 0;
      }
      .selection-copy {
        flex: 1;
        min-inline-size: 0;
      }
      .selection-copy h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.3px;
        line-height: 1.4;
      }
      .selection-copy p {
        font-size: 11px;
        color: var(--muted);
        margin-block-start: 5px;
      }
      .selection-actions {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .selection-badge {
        margin-block-end: 6px;
      }
      .compare-bar {
        padding: 8px 16px;
        min-block-size: 43px;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
        border-block: 1px solid var(--hair);
        background: var(--toolbar);
        font-size: 11px;
      }
      .compare-bar select {
        padding: 4px 6px;
        max-inline-size: 240px;
        min-inline-size: 0;
        border: 1px solid var(--line);
        background: var(--raised);
        font-size: 11px;
      }
      .compare-bar .draft-note {
        margin-inline-start: auto;
        color: var(--warning);
      }
      .diff-area {
        display: grid;
        grid-template-columns: 155px minmax(0, 1fr);
        min-block-size: 0;
      }
      .file-rail {
        min-block-size: 0;
        overflow: auto;
        padding: 10px 8px;
        border-inline-end: 1px solid var(--hair);
      }
      .file-controls {
        display: flex;
        gap: 2px;
        padding: 0 2px 8px;
      }
      .file-controls button {
        font-size: 10px;
        padding: 3px 7px;
      }
      .file-controls [aria-pressed='true'] {
        background: var(--inset);
        font-weight: 600;
      }
      .search {
        inline-size: 100%;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 6px 7px;
        margin-block-end: 9px;
        font-size: 10px;
      }
      .directory {
        margin: 4px 0;
      }
      .directory summary {
        cursor: pointer;
        font-size: 11px;
        padding: 4px;
        color: var(--muted);
      }
      .file {
        inline-size: 100%;
        text-align: start;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 6px;
        border-radius: 4px;
        font-size: 11px;
      }
      .file[aria-pressed='true'] {
        background: var(--selected);
        color: var(--accent);
      }
      .file-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .file-status {
        font-size: 10px;
        color: var(--muted);
      }
      .file-status.deleted {
        color: var(--danger);
      }
      .code-pane {
        min-inline-size: 0;
        min-block-size: 0;
        display: flex;
        flex-direction: column;
      }
      .code-head {
        min-block-size: 43px;
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 6px 11px;
        border-block-end: 1px solid var(--hair);
        flex-wrap: wrap;
      }
      .code-head .path {
        font-size: 11px;
        font-weight: 550;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .segments {
        display: inline-flex;
        background: var(--inset);
        border-radius: 5px;
        padding: 2px;
      }
      .segments button {
        padding: 3px 6px;
        font-size: 10px;
      }
      .segments button[aria-pressed='true'] {
        background: var(--raised);
        box-shadow: 0 1px 3px #0001;
      }
      .code {
        flex: 1;
        overflow: auto;
        padding-block: 14px;
        font:
          11px/1.95 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        tab-size: 2;
      }
      .code-line {
        display: flex;
        min-inline-size: max-content;
        padding-inline-end: 15px;
      }
      .line-no {
        color: var(--muted);
        opacity: 0.7;
        inline-size: 40px;
        flex: none;
        text-align: end;
        padding-inline-end: 12px;
        user-select: none;
      }
      .sign {
        inline-size: 18px;
        flex: none;
        text-align: center;
      }
      .code-line code {
        white-space: pre;
        font: inherit;
      }
      .code-line.add {
        background: color-mix(in srgb, var(--success) 10%, transparent);
      }
      .code-line.remove {
        background: color-mix(in srgb, var(--danger) 8%, transparent);
      }
      .code-line.add .sign {
        color: var(--success);
      }
      .code-line.remove .sign {
        color: var(--danger);
      }
      .hunk {
        color: var(--muted);
        background: var(--toolbar);
        padding: 2px 12px;
        font-size: 10px;
        margin-block-end: 7px;
      }
      .split-code {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-inline-size: 500px;
      }
      .split-code > div:first-child {
        border-inline-end: 1px solid var(--line);
      }
      .code-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px;
        border-block-start: 1px solid var(--hair);
        font-size: 10px;
      }
      .plus {
        color: var(--success);
      }
      .minus {
        color: var(--danger);
      }
      .code-empty {
        padding: 30px 22px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
      .layout-b {
        display: grid;
        block-size: 100%;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .graph-zone {
        background: var(--toolbar);
        border-block-end: 1px solid var(--line);
        padding: 10px 20px 13px;
      }
      .graph-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-block-end: 12px;
      }
      .graph-tools strong {
        font-size: 12px;
      }
      .graph-tools .fine {
        flex: 1;
      }
      .graph-scroll {
        overflow: auto;
        padding-block: 4px 9px;
      }
      .graph-track {
        min-inline-size: 690px;
        display: flex;
        align-items: center;
        gap: 25px;
        padding-inline: 10px;
      }
      .graph-version {
        position: relative;
        flex: 1;
        min-inline-size: 126px;
        padding: 11px;
        border: 1px solid var(--line);
        background: var(--surface);
        text-align: start;
      }
      .graph-version:after {
        content: '';
        position: absolute;
        inset-inline-start: 100%;
        inset-block-start: 50%;
        inline-size: 26px;
        border-block-start: 1px solid var(--muted);
      }
      .graph-version:last-child:after {
        display: none;
      }
      .graph-version[aria-pressed='true'] {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .graph-version strong {
        display: block;
        font-size: 11px;
        margin-block: 4px;
      }
      .graph-version .fine {
        font-size: 10px;
      }
      .branch-track {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-block-start: 12px;
        margin-inline-start: 175px;
        font-size: 11px;
        color: var(--success);
      }
      .branch-track:before {
        content: '';
        inline-size: 23px;
        block-size: 17px;
        border-inline-start: 1px solid var(--success);
        border-block-end: 1px solid var(--success);
        border-end-start-radius: 10px;
      }
      .branch-track button {
        border: 1px solid var(--line);
        padding: 5px 10px;
        background: var(--surface);
      }
      .layout-b .selection-head {
        padding-block: 12px;
      }
      .layout-b .selection-copy h1 {
        font-size: 15px;
      }
      .layout-c {
        block-size: 100%;
        overflow: auto;
        padding: 22px 24px 35px;
      }
      .work-summary {
        display: flex;
        gap: 15px;
        align-items: center;
        border-block-end: 1px solid var(--line);
        padding-block-end: 21px;
        margin-block-end: 21px;
      }
      .work-summary h1 {
        font-size: 20px;
        font-weight: 600;
        margin-block-end: 5px;
      }
      .work-summary p {
        font-size: 12px;
        color: var(--muted);
      }
      .work-summary .summary-copy {
        flex: 1;
      }
      .work-summary .btn {
        min-block-size: 36px;
      }
      .archive-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-block-end: 10px;
      }
      .archive-heading h2 {
        font-size: 13px;
        font-weight: 600;
      }
      .archive-heading select {
        margin-inline-start: auto;
        font-size: 11px;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 4px 6px;
      }
      .archive-row {
        display: flex;
        align-items: center;
        gap: 14px;
        min-block-size: 57px;
        border-block-end: 1px solid var(--hair);
        inline-size: 100%;
        text-align: start;
        border-radius: 0;
      }
      .archive-row > strong {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
      }
      .archive-row .fine {
        min-inline-size: 46px;
      }
      .archive-row[aria-pressed='true'] {
        color: var(--accent);
      }
      .archive-expansion {
        border: 1px solid var(--line);
        margin-block: 0 12px;
        block-size: 415px;
        display: grid;
      }
      .archive-expansion .selection-copy h1 {
        font-size: 14px;
      }
      .archive-expansion .selection-head {
        padding: 12px;
      }
      .preview {
        border-inline-start: 1px solid var(--line);
        background: var(--toolbar);
        display: flex;
        flex-direction: column;
        min-block-size: 0;
      }
      .preview-head {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        border-block-end: 1px solid var(--line);
        min-block-size: 42px;
        gap: 5px;
        font-size: 12px;
      }
      .score {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        overflow: hidden;
        background: var(--surface);
        margin: 12px;
        border: 1px solid var(--hair);
        border-radius: 5px;
      }
      .score svg {
        inline-size: 190px;
        block-size: 190px;
        color: var(--accent);
        opacity: 0.7;
      }
      .score h2 {
        font-weight: 300;
        font-size: 32px;
        letter-spacing: 7px;
      }
      .score p {
        font-size: 11px;
        color: var(--muted);
      }
      .preview-bottom {
        padding: 13px;
        border-block-start: 1px solid var(--line);
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 11px;
      }
      .bottom {
        display: flex;
        align-items: center;
        gap: 15px;
        background: var(--toolbar);
        border-block-start: 1px solid var(--line);
        padding-inline: 15px;
        font-size: 11px;
      }
      .mode {
        font-size: 12px;
        font-weight: 600;
      }
      .bottom .runtime {
        color: var(--muted);
      }
      .bottom .runtime.running {
        color: var(--success);
      }
      .review {
        position: fixed;

          openDialog(
            t('resumeUpload'),
            `<p>${t('resumeScope')}</p><div class="fact"><span>${t('confirmedVersion')}</span><strong>${esc(name(version('v1')))}</strong></div><div class="fact"><span>${t('destination')}</span><strong>xiaoxiang/ripples · ${t('private')}</strong></div><div class="dialog-actions">${button(t('cancel'), 'closeDialog', 'quiet')}${button(t('resumeUpload'), 'confirmResume', 'primary')}</div>`
          )
          return
        }
        if (action === 'confirmResume') {
          state.remote = 'pending'
          state.backed = true
          closeDialog()
          render()
          notify('resumed')
          return
        }
        if (action === 'connect') {
          openDialog(
            t('connect'),
            `<p>${t('connectScope')}</p><div class="fact"><span>${t('currentRoute')}</span><strong>${routeName()}</strong></div><div class="notice">${t('connectDemo')}</div>${button(t('close'), 'closeDialog', 'quiet')}`
          )
          return
        }
        if (action === 'autoBackup') {
          if (state.backed) {
            state.auto = !state.auto
            manage()
            renderReview()
          }
          return
        }
        if (action === 'checkRemote') {
          notify('checkedRemote')
          return
        }
        if (action === 'viewRepository') {
          notify('repositoryDemo')
          return
        }
        if (action === 'changeRepository' || action === 'unbind') {
          openDialog(
            t(action),
            `<p>${t('unbindNotice')}</p><div class="dialog-actions">${button(t('cancel'), 'closeDialog', 'quiet')}${button(t('confirmUnbind'), 'confirmUnbind', 'danger')}</div>`
          )
          return
        }
        if (action === 'confirmUnbind') {
          state.bound = false
          for (const route of Object.values(state.routes)) {
            route.pending = 0
            route.auto = false
            route.backed = false
            route.remote = 'unpublished'
          }
          state.remote = 'local'
          state.pending = 0
          state.auto = false
          state.backed = false
          closeDialog()
          render()
          notify('unboundDone')
          return
        }
        if (action === 'scope') {
          openDialog(
            t('recordScope'),
            `<p>${t('scopeExplanation')}</p><div class="notice">${t('scopeExclusions')}</div>${button(t('close'), 'closeDialog', 'quiet')}`
          )
          return
        }
        if (action === 'openSketch') {
          state.file = 'sketch.js'
          perform('openFile')
          return
        }
        if (action === 'openFile') {
          if (state.file === 'old-map.json') {
            notify('deletedNoOpen')
            return
          }
          openDialog(
            t('currentFile'),
            `<p>${t('openFileExplanation')}</p><div class="fact"><strong>${state.file}</strong><span>${state.draft ? t('draftPreserved') : t('diskSaved')}</span></div><div class="code" style="max-height:240px">${codeLines(rowsText().filter(row => row[0] !== 'remove'))}</div>${button(t('returnHistory'), 'closeDialog', 'quiet')}`
          )
          return
        }
        if (action === 'reviewWorking') {
          if (document.getElementById('dialog').open) closeDialog()
          state.selected = hasWorkingChanges() ? 'working' : state.head
          state.mode = hasWorkingChanges() ? 'saved' : 'parent'
          render()
          return
        }
        if (action === 'locate') {
          state.selected = state.head
          render()
          document
            .querySelector(`[data-select="${state.head}"]`)
            ?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
          return
        }
        if (action === 'fullContext') state.full = !state.full
        if (action === 'togglePreview') state.preview = !state.preview
        if (action === 'toggleGraph') state.graph = !state.graph
        if (action === 'toggleRuntime') state.running = !state.running
        if (action === 'refresh') {
          notify('refreshed')
          return
        }
        if (action === 'codeCheck') {
          notify('codeCheckDemo')
          return
        }
        if (action === 'assistant') {
          notify('assistantDemo')
          return
        }
        if (action === 'showState') {
          openDialog(
            t('showState'),
            `<pre style="font-size:11px;white-space:pre-wrap">${esc(JSON.stringify({ variant, scene: state.scene, workRoute: state.route, workVersion: state.head, viewing: state.selected, dirty: state.dirty, editorDraft: state.draft, comparison: state.selected === 'working' ? 'head → disk' : state.mode, file: state.file, remoteForWorkRoute: state.remote, pending: state.pending, autoBackup: state.auto, running: state.running, assistantTask: state.task, createRouteOnNextSave: state.detached, merge: state.merge ? { source: state.merge.source, target: state.merge.target, phase: state.merge.phase, revision: state.merge.revision, pending: mergePending(), fastForward: state.merge.fast, assistant: state.merge.ai } : null, runtimeOwner: state.runtimeOwner, runtimeRevision: state.runtimeRevision }, null, 2))}</pre>`
          )
          return
        }
        if (action === 'reviewNotes') {
          openDialog(
            t('reviewNotes'),
            `<p>${t(`rationale.${variant}`)}</p><div class="notice">${t('commonPrinciple')}</div><p>${t('reviewTasks')}</p><p class="fine">${t('prototypeNote')}</p>`
          )
          return
        }
        render()
      }
      let mergePreviewHover = null
      function hideMergeTreePreview() {
        if (!mergePreviewHover) return
        const { rail, scroll, left } = mergePreviewHover
        delete rail.dataset.mergePreview
        scroll.scrollLeft = left
        mergePreviewHover = null
      }
      function showMergeTreePreview(trigger) {
        if (mergePreviewHover?.trigger === trigger) return
        hideMergeTreePreview()
        const rail = trigger.closest('.branch-history')
        if (!rail?.querySelector('.merge-preview-node')) return
        const scroll = rail.querySelector('.history-scroll')
        mergePreviewHover = { trigger, rail, scroll, left: scroll.scrollLeft }
        rail.dataset.mergePreview = 'true'
        scroll.scrollLeft = Math.max(0, scroll.scrollWidth - scroll.clientWidth)
      }
      document.addEventListener('pointerover', event => {
        const trigger = event.target.closest('[data-action="beginMerge"]')
        if (trigger && !trigger.disabled) showMergeTreePreview(trigger)
      })
      document.addEventListener('pointerout', event => {
        const trigger = event.target.closest('[data-action="beginMerge"]')
        if (trigger && !trigger.contains(event.relatedTarget))
          hideMergeTreePreview()
      })
      document.addEventListener('click', event => {
        hideMergeTreePreview()
        if (!event.target.closest('[data-action="switch"]')) clearSwitchArm()
        const target = event.target.closest('button')
        if (!target || target.disabled) return
        if (target.dataset.select) {
          if (state.merge) {
            state.merge.inspected = target.dataset.select
            state.tab = 'history'
          }
          state.selected = target.dataset.select
          state.mode = state.selected === 'working' ? 'saved' : 'parent'
          state.file = 'sketch.js'
          state.query = ''
          state.full = false
          render()
          return
        }
        if (target.dataset.compare) {
          state.mode = target.dataset.compare
          state.full = false
          render()
          return
        }
        if (target.dataset.file) {
          if (state.merge) {
            state.tab = 'history'
            state.merge.inspected = null
          }
          state.file = target.dataset.file
          const currentQuery = state.query
          render()
          state.query = currentQuery
          return
        }
        if (target.dataset.filter) {
          state.fileFilter = target.dataset.filter
          render()
          return
        }
        if (target.dataset.layout) {
          state.layout = target.dataset.layout
          render()
          return
        }
        if (target.dataset.action) perform(target.dataset.action)
      })
      document.addEventListener('change', event => {
        clearSwitchArm()
        const field = event.target.dataset.field,
          value = event.target.value
        if (!field) return
        if (field === 'scene') reset(value)
        else if (field === 'theme') theme = value
        else if (field === 'lang') lang = value
        else if (field === 'mergeRequest' && state.merge) {
          state.merge.request = value
          return
        } else if (field === 'query') return
        else state[field] = value
        render()
      })
      document.addEventListener('input', event => {
        if (
          event.target.dataset.mergeEditor &&
          state.merge &&
          !mergeLocked() &&
          !state.merge.fast
        ) {
          state.merge.results[event.target.dataset.mergeEditor] =
            event.target.value
          mergeChanged()
          syncMergeEditing()
          return
        }
        if (event.target.dataset.field === 'mergeRequest' && state.merge) {
          state.merge.request = event.target.value
          return
        }
        if (event.target.dataset.field === 'query') {
          state.query = event.target.value
          document.getElementById('file-list').innerHTML = state.merge
            ? mergeFileList()
            : fileList()
        }
      })
      document.addEventListener('submit', event => {
        if (event.target.id === 'merge-assistant-form') {
          event.preventDefault()
          perform('mergeStartAI')
          return
        }
        if (event.target.id === 'save-form') {
          event.preventDefault()
          const data = new FormData(event.target),
            title = String(data.get('versionName')).trim()
          if (!title) return
          saveNow(title, String(data.get('routeName') || ''))
          closeDialog()
          render()
          notify('saved')
        }
        if (event.target.id === 'rename-form') {
          event.preventDefault()
          const value = String(
            new FormData(event.target).get('versionName')
          ).trim()
          if (!value) return
          version(state.selected).custom = value
          closeDialog()
          render()
          notify('renamed')
        }
      })
      window.addEventListener('blur', () => {
        hideMergeTreePreview()
        finishMergeRename(true)
        finishInlineRename(true)
        clearSwitchArm()
      })
      document.addEventListener('focusout', event => {
        if (event.target.matches('[data-action="beginMerge"]'))
          hideMergeTreePreview()
        if (event.target.id === 'inline-merge-name') finishMergeRename(true)
        if (event.target.id === 'inline-version-name') finishInlineRename(true)
      })
      document.addEventListener('focusin', event => {
        if (event.target.matches('[data-action="beginMerge"]'))
          showMergeTreePreview(event.target)
        if (!event.target.closest('[data-action="switch"]')) clearSwitchArm()
      })
      document.addEventListener('keydown', event => {
        if (event.target.id === 'inline-merge-name') {
          if (event.isComposing) return
          if (event.key === 'Enter' || event.key === 'Escape') {
            event.preventDefault()
            finishMergeRename(event.key === 'Enter', true)
          }
          return
        }
        if (event.target.id === 'inline-version-name') {
          if (event.isComposing) return
          if (event.key === 'Enter' || event.key === 'Escape') {
            event.preventDefault()
            finishInlineRename(event.key === 'Enter', true)
          }
          return
        }
        if (event.key === 'Escape' && state.switchArm) {
          event.preventDefault()
          clearSwitchArm()
          return
        }
        if (
          event.repeat &&
          event.target.closest('[data-action="switch"]') &&
          ['Enter', ' '].includes(event.key)
        ) {
          event.preventDefault()
          return
        }
        if (
          document.getElementById('dialog').open ||
          event.target.closest(
            'input,textarea,select,[contenteditable="true"],[data-resize]'
          )
        )
          return
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault()
          perform(event.key === 'ArrowLeft' ? 'prev' : 'next')
        }
      })
      document.getElementById('dialog').addEventListener('close', () => {
        if (opener?.isConnected) opener.focus()
      })
      reset(params.get('scene') || 'merge')
      render()
    </script>
  </body>
</html>
