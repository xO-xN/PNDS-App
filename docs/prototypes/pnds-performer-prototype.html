<!doctype html>
<html lang="zh-CN" data-theme="pond">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Performer · 独立测试窗</title>
    <!-- Throwaway prototype. One distinct performer test client, memory-only.
         BroadcastChannel connects this page to the local UI prototype;
         there is no project runtime, audio engine, or network connection. -->
    <style>
      @font-face {
        font-family: Manrope;
        src: url('../../public/fonts/manrope-latin.woff2');
        font-weight: 200 800;
        font-display: swap;
      }
      @font-face {
        font-family: Comfortaa;
        src: url('../../public/fonts/comfortaa-latin.woff2');
        font-weight: 300 700;
        font-display: swap;
      }
      @font-face {
        font-family: Archivo;
        src: url('../../public/fonts/archivo-latin.woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --bg: #eef0f8;
        --side: #e2e5f3;
        --card: #fff;
        --field: #e8ebf7;
        --hover: #dee2f2;
        --accent: #5a4ff3;
        --on-accent: #fff;
        --text: #171a2b;
        --muted: #5d6484;
        --line: #d7dceb;
        --radius: 12px;
        --shadow: 0 1px 3px rgb(23 26 43 / 10%);
        --knob-shadow:
          0 1px 2px rgb(23 26 43 / 20%), 0 2px 6px rgb(23 26 43 / 15%);
        --ui: Manrope, -apple-system, 'PingFang SC', sans-serif;
        --brand: Comfortaa, var(--ui);
      }
      [data-theme='sand'] {
        --bg: #474036;
        --side: #4e463b;
        --card: #5c5344;
        --field: #544a3e;
        --hover: #655a4c;
        --accent: #d97706;
        --on-accent: #241d12;
        --text: #fff8ec;
        --muted: #e5dcca;
        --line: #776c5a;
        --shadow: 0 1px 3px rgb(0 0 0 / 40%);
        --knob-shadow: 0 1px 2px rgb(0 0 0 / 45%), 0 2px 6px rgb(0 0 0 / 35%);
      }
      [data-theme='stage'] {
        --bg: #0b0c10;
        --side: #101218;
        --card: #16181f;
        --field: #12151d;
        --hover: #1b1f2a;
        --accent: #34d399;
        --on-accent: #06281a;
        --text: #eceef5;
        --muted: #99a1b5;
        --line: #303746;
        --shadow: 0 1px 3px rgb(0 0 0 / 60%);
        --knob-shadow: 0 1px 2px rgb(0 0 0 / 60%), 0 2px 6px rgb(0 0 0 / 45%);
      }
      [data-theme='brutal'] {
        --bg: #fff1c9;
        --side: #ffc107;
        --card: #fff;
        --field: #ffe58f;
        --hover: #ffd966;
        --accent: #ff5722;
        --on-accent: #000;
        --text: #000;
        --muted: #4a4028;
        --line: #000;
        --radius: 0px;
        --shadow: 3px 3px 0 #000;
        --knob-shadow: 2px 2px 0 #000;
        --ui: Archivo, -apple-system, 'PingFang SC', sans-serif;
        --brand: var(--ui);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.5 var(--ui);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      svg {
        display: block;
      }
      .toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding: 12px 16px;
        background: var(--side);
        border-bottom: 1px solid var(--line);
      }
      .toolbar-title {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toolbar-title strong {
        font-size: 12px;
        font-weight: 650;
      }
      .toolbar-title span {
        font-size: 10px;
        color: var(--muted);
      }
      .tools {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .segmented {
        padding: 2px;
        display: flex;
        background: color-mix(in srgb, var(--text) 5%, transparent);
        border-radius: 8px;
      }
      .segmented button {
        min-height: 28px;
        padding: 5px 10px;
        border: none;
        border-radius: 6px;
        background: none;
        color: var(--muted);
        font-size: 11px;
      }
      .segmented button:hover {
        color: var(--text);
      }
      .segmented button[aria-pressed='true'] {
        color: var(--text);
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .device-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .device {
        position: absolute;
        inset: 0 auto auto 0;
        transform-origin: top left;
        border-radius: 28px;
        overflow: hidden;
        background: #f6f5ef;
        box-shadow:
          0 0 0 1px rgb(23 26 43 / 14%),
          0 16px 40px rgb(23 26 43 / 12%);
      }
      .performer-page {
        height: 100%;
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        padding: 30px;
        color: #314b40;
        font:
          14px/1.5 Manrope,
          -apple-system,
          'PingFang SC',
          sans-serif;
        --score-accent: #50765f;
        --score-field: #d9e2d8;
        --score-card: #fffef9;
      }
      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      .page-heading h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.3;
        font-weight: 650;
      }
      .page-heading .work-subtitle {
        color: #688173;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin: 6px 0 0;
      }
      .player {
        flex-shrink: 0;
        font-size: 11px;
        padding-top: 3px;
        color: #688173;
      }
      .ready-line {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 24px;
        font-size: 11px;
        color: #688173;
      }
      .ready-light {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #a8aaa5;
      }
      .performer-page[data-ready='true'] .ready-light {
        background: #50765f;
      }
      .performance-control {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px 0;
      }
      .touch-visual {
        width: min(74%, 460px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        position: relative;
        border: 1px solid #d7dfd4;
        border-radius: 50%;
        background: radial-gradient(circle, #e2e9dd 0%, #f6f5ef 68%);
      }
      .touch-visual::before,
      .touch-visual::after {
        content: '';
        border: 1px solid #d7dfd4;
        width: 79%;
        height: 79%;
        border-radius: 50%;
        position: absolute;
      }
      .touch-visual::after {
        width: 57%;
        height: 57%;
      }
      .trigger {
        position: relative;
        z-index: 1;
        width: 114px;
        height: 114px;
        border: 1px solid #50765f;
        border-radius: 50%;
        background: #e2e9dd;
        color: #314b40;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        font-size: 11px;
        touch-action: manipulation;
        transition:
          background 0.16s,
          transform 0.16s;
      }
      .trigger:hover:not(:disabled) {
        background: #d5e1ce;
      }
      .trigger:active:not(:disabled) {
        transform: scale(0.96);
      }
      .trigger svg {
        width: 25px;
        height: 25px;
      }
      .trigger:focus-visible,
      .density:focus-visible {
        outline-color: #50765f;
      }
      .pulse-ring {
        position: absolute;
        width: 114px;
        height: 114px;
        border: 1px solid #b8865e;
        border-radius: 50%;
        opacity: 0;
      }
      .pulse-ring.animate {
        animation: pulse 0.6s ease-out;
      }
      @keyframes pulse {
        from {
          opacity: 0.7;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(2.4);
        }
      }
      .gesture-caption {
        font-size: 12px;
        color: #688173;
        text-align: center;
        margin: 0;
      }
      .density-card {
        background: #fffef9;
        box-shadow: 0 1px 3px rgb(49 75 64 / 7%);
        border-radius: 14px;
        padding: 20px;
      }
      .density-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 12px;
      }
      .density-label label {
        font-weight: 550;
      }
      .density-label output {
        font-variant-numeric: tabular-nums;
      }
      .density {
        width: 100%;
        height: 36px;
        margin: 12px 0 0;
        padding: 0;
        background: transparent;
        appearance: none;
        -webkit-appearance: none;
        cursor: default;
      }
      .density:disabled {
        opacity: 0.35;
      }
      .density::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 9999px;
        background: linear-gradient(
          to right,
          var(--score-accent) 0 var(--fill, 35%),
          var(--score-field) var(--fill, 35%) 100%
        );
      }
      .density::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 9999px;
        margin-top: -5px;
        background: var(--score-card);
        box-shadow:
          0 1px 2px rgb(49 75 64 / 20%),
          0 2px 6px rgb(49 75 64 / 15%);
      }
      .density::-moz-range-track {
        height: 4px;
        border-radius: 9999px;
        background: var(--score-field);
      }
      .density::-moz-range-progress {
        height: 4px;
        border-radius: 9999px;
        background: var(--score-accent);
      }
      .density::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 0;
        border-radius: 9999px;
        background: var(--score-card);
        box-shadow:
          0 1px 2px rgb(49 75 64 / 20%),
          0 2px 6px rgb(49 75 64 / 15%);
      }
      .range-labels {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #829386;
        margin-top: 1px;
      }
      .page-footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        font-size: 10px;
        color: #829386;
        margin-top: 20px;
      }
      .landscape .performer-page {
        padding: 20px 36px;
      }
      .landscape .performance-control {
        flex-direction: row;
        gap: 28px;
        padding: 6px 0;
      }
      .landscape .touch-visual {
        width: 154px;
        flex-shrink: 0;
      }
      .landscape .trigger {
        width: 90px;
        height: 90px;
        font-size: 10px;
      }
      .landscape .pulse-ring {
        width: 90px;
        height: 90px;
      }
      .landscape .gesture-caption {
        max-width: 170px;
        text-align: start;
      }
      .landscape .density-card {
        max-width: 560px;
        width: 100%;
        margin-inline: auto;
        padding: 12px 20px;
      }
      .landscape .density {
        height: 28px;
        margin-top: 8px;
      }
      .landscape .ready-line {
        margin-top: 12px;
      }
      .landscape .page-footer {
        margin-top: 12px;
      }
      .tablet .performer-page {
        padding: 52px;
        font-size: 18px;
      }
      .tablet .page-heading h1 {
        font-size: 27px;
      }
      .tablet .trigger {
        width: 154px;
        height: 154px;
        font-size: 14px;
      }
      .tablet .trigger svg {
        width: 34px;
        height: 34px;
      }
      .tablet .pulse-ring {
        width: 154px;
        height: 154px;
      }
      .tablet .density-card {
        padding: 28px;
      }
      .tablet .density-label {
        font-size: 16px;
      }
      .tablet .gesture-caption {
        font-size: 16px;
      }
      .tablet.landscape .touch-visual {
        width: 380px;
      }
      .tablet.landscape .gesture-caption {
        max-width: 200px;
      }
      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px 12px;
        color: var(--muted);
        padding: 9px 16px;
        border-top: 1px solid var(--line);
        font-size: 10px;
        background: var(--side);
        font-variant-numeric: tabular-nums;
      }
      .statusbar strong {
        font-weight: 500;
        color: var(--text);
      }
      [data-theme='brutal'] .toolbar,
      [data-theme='brutal'] .statusbar {
        border-width: 1px;
      }
      [data-theme='brutal'] .segmented,
      [data-theme='brutal'] .segmented button {
        border-radius: 0;
      }
      [data-theme='brutal'] .segmented {
        outline: 1px solid #000;
      }
      @media (max-width: 480px) {
        .toolbar {
          padding: 10px 12px;
        }
        .stage {
          padding: 14px;
        }
        .toolbar-title span {
          display: none;
        }
        .statusbar {
          padding-inline: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-title">
        <strong>Performer 测试</strong>
        <span>独立演示窗口</span>
      </div>
      <div class="tools">
        <div class="segmented" role="group" aria-label="模拟设备">
          <button type="button" id="phone" aria-pressed="true">手机</button>
          <button type="button" id="tablet" aria-pressed="false">平板</button>
        </div>
        <div class="segmented" role="group" aria-label="屏幕方向">
          <button type="button" id="portrait" aria-pressed="true">竖屏</button>
          <button type="button" id="landscape" aria-pressed="false">
            横屏
          </button>
        </div>
      </div>
    </header>
    <main class="stage" id="stage" aria-label="Performer 设备预览">
      <div class="device-wrap" id="device-wrap">
        <div class="device" id="device">
          <section
            class="performer-page"
            id="performer-page"
            data-ready="false"
          >
            <header class="page-heading">
              <div>
                <h1 id="work-name">等待工程</h1>
                <p class="work-subtitle">Networked digital score</p>
              </div>
              <span class="player" id="player-name">Player 01</span>
            </header>
            <div class="ready-line" role="status">
              <span class="ready-light"></span
              ><span id="page-status">等待主窗口连接</span>
            </div>
            <div class="performance-control">
              <div class="touch-visual">
                <div
                  class="pulse-ring"
                  id="pulse-ring"
                  aria-hidden="true"
                ></div>
                <button
                  type="button"
                  class="trigger"
                  id="trigger"
                  disabled
                  aria-label="触发演奏事件"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="m8 5 11 7-11 7Z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linejoin="round"
                    />
                  </svg>
                  <span>触发 / Trigger</span>
                </button>
              </div>
              <p class="gesture-caption">
                轻触触发事件，<br />调整密度，观察 Monitor 的响应。
              </p>
            </div>
            <div class="density-card">
              <div class="density-label">
                <label for="density">密度 / Density</label
                ><output id="density-value" for="density">35</output>
              </div>
              <input
                type="range"
                class="density"
                id="density"
                dir="ltr"
                min="0"
                max="100"
                value="35"
                style="--fill: 35%"
                disabled
              />
              <div class="range-labels">
                <span>疏 / Sparse</span><span>密 / Dense</span>
              </div>
            </div>
            <footer class="page-footer">
              <span id="event-state" aria-live="polite">尚未发送事件</span
              ><span id="client-caption">Player 01 · 独立测试客户端</span>
            </footer>
          </section>
        </div>
      </div>
    </main>
    <footer class="statusbar">
      <span
        ><strong id="viewport-size">390 × 844</strong> ·
        <span id="fit-scale">100%</span></span
      >
      <span id="connection-note">模拟交互 · 无真实网络或音频</span>
    </footer>
    <script>
      const $ = id => document.getElementById(id)
      const query = new URLSearchParams(location.search)
      const channelId = query.get('session') || 'standalone'
      const clientId = String(query.get('client') || '1')
      const playerName = 'Player ' + clientId.padStart(2, '0')
      const state = {
        device: 'phone',
        orientation: 'portrait',
        project: { name: '等待工程', blank: false },
        session: 'disconnected',
        density: 35,
        pulse: 0,
        theme: 'pond',
        closed: false,
      }
      const channel =
        typeof BroadcastChannel === 'function'
          ? new BroadcastChannel('pnds-ui-performer-' + channelId)
          : null
      function send(message) {
        if (state.closed) return
        const [width, height] = dimensions()
        const deviceDetails =
          message.type === 'performer:ready' ||
          message.type === 'performer:device'
            ? {
                device: state.device,
                orientation: state.orientation,
                width,
                height,
              }
            : {}
        channel?.postMessage({ ...message, ...deviceDetails, clientId })
      }
      function dimensions() {
        const sizes = state.device === 'phone' ? [390, 844] : [820, 1180]
        return state.orientation === 'portrait' ? sizes : sizes.reverse()
      }
      function fitDevice() {
        const [width, height] = dimensions()
        const style = getComputedStyle($('stage'))
        const availableWidth =
          $('stage').clientWidth -
          parseFloat(style.paddingLeft) -
          parseFloat(style.paddingRight)
        const availableHeight =
          $('stage').clientHeight -
          parseFloat(style.paddingTop) -
          parseFloat(style.paddingBottom)
        const scale = Math.min(
          1,
          Math.max(0.1, availableWidth / width),
          Math.max(0.1, availableHeight / height)
        )
        $('device-wrap').style.width = width * scale + 'px'
        $('device-wrap').style.height = height * scale + 'px'
        $('device').style.width = width + 'px'
        $('device').style.height = height + 'px'
        $('device').style.transform = 'scale(' + scale + ')'
        $('device').className =
          'device ' + state.device + ' ' + state.orientation
        $('viewport-size').textContent = width + ' × ' + height
        $('fit-scale').textContent = Math.round(scale * 100) + '%'
      }
      function render() {
        document.documentElement.dataset.theme = state.theme
        $('work-name').textContent = state.project.name || '未命名工程'
        $('player-name').textContent = playerName
        $('client-caption').textContent = playerName + ' · 独立测试客户端'
        const active =
          !state.closed && state.session === 'ready' && !state.project.blank
        $('performer-page').dataset.ready = String(active)
        $('trigger').disabled = !active
        $('density').disabled = !active
        $('density').value = state.density
        $('density').style.setProperty('--fill', state.density + '%')
        $('density-value').textContent = state.density
        const messages = {
          disconnected: '等待主窗口连接',
          idle: '工程尚未运行',
          starting: '工程启动中',
          stopping: '工程正在停止',
          error: '工程启动失败，请回主窗口查看',
          closed: '测试窗口已关闭 · 请从主窗口重新建立',
        }
        $('page-status').textContent = state.closed
          ? messages.closed
          : state.project.blank
            ? '空工程 · 尚未编写演奏交互'
            : active
              ? '已连接 · 可以交互测试'
              : messages[state.session] || '等待工程就绪'
        for (const id of ['phone', 'tablet']) {
          $('' + id).setAttribute('aria-pressed', String(state.device === id))
          $('' + id).disabled = state.closed
        }
        for (const id of ['portrait', 'landscape']) {
          $('' + id).setAttribute(
            'aria-pressed',
            String(state.orientation === id)
          )
          $('' + id).disabled = state.closed
        }
        $('connection-note').textContent = state.closed
          ? '已断开 · 此页面不再参与交互测试'
          : '模拟交互 · 无真实网络或音频'
        fitDevice()
      }
      function selectDevice(device) {
        if (state.closed) return
        state.device = device
        render()
        resizeWindow()
        send({ type: 'performer:device' })
      }
      function selectOrientation(orientation) {
        if (state.closed) return
        state.orientation = orientation
        render()
        resizeWindow()
        send({ type: 'performer:device' })
      }
      function resizeWindow() {
        const [width, height] = dimensions()
        const chromeWidth = Math.max(0, window.outerWidth - window.innerWidth)
        const chromeHeight = Math.max(
          0,
          window.outerHeight - window.innerHeight
        )
        const toolbarHeight = $('stage').offsetTop
        const footerHeight = document.querySelector('.statusbar').offsetHeight
        const desiredWidth = Math.min(
          width + 40 + chromeWidth,
          screen.availWidth * 0.9
        )
        const desiredHeight = Math.min(
          height + toolbarHeight + footerHeight + 40 + chromeHeight,
          screen.availHeight * 0.9
        )
        try {
          window.resizeTo(
            Math.max(450, desiredWidth),
            Math.max(430, desiredHeight)
          )
        } catch {
          /* The preview still fits within its current window. */
        }
      }
      function animatePulse() {
        $('pulse-ring').classList.remove('animate')
        void $('pulse-ring').offsetWidth
        $('pulse-ring').classList.add('animate')
        $('event-state').textContent = '已发送触发事件 · ' + state.pulse
      }
      function closeClient() {
        if (state.closed) return
        send({ type: 'performer:closed' })
        state.closed = true
        state.session = 'closed'
        $('event-state').textContent = '测试已结束'
        render()
        channel?.close()
        window.close()
      }
      $('phone').onclick = () => selectDevice('phone')
      $('tablet').onclick = () => selectDevice('tablet')
      $('portrait').onclick = () => selectOrientation('portrait')
      $('landscape').onclick = () => selectOrientation('landscape')
      $('trigger').onclick = () => {
        if (state.closed || state.session !== 'ready' || state.project.blank)
          return
        send({ type: 'performer:trigger' })
      }
      $('density').oninput = event => {
        if (state.closed || state.session !== 'ready' || state.project.blank)
          return
        state.density = Number(event.target.value)
        $('density').style.setProperty('--fill', state.density + '%')
        $('density-value').textContent = state.density
        $('event-state').textContent = '已发送密度 · ' + state.density
        send({ type: 'performer:density', value: state.density })
      }
      if (channel) {
        channel.onmessage = event => {
          const message = event.data
          if (!message || state.closed) return
          if (message.clientId != null && String(message.clientId) !== clientId)
            return
          if (message.type === 'performer:close') {
            if (String(message.clientId) === clientId) closeClient()
            return
          }
          if (message.type !== 'performer:state') return
          const previousPulse = state.pulse
          if (message.project) state.project = message.project
          if (typeof message.session === 'string')
            state.session = message.session
          if (Number.isFinite(message.density))
            state.density = Math.max(0, Math.min(100, message.density))
          if (Number.isFinite(message.pulse)) state.pulse = message.pulse
          if (['pond', 'sand', 'stage', 'brutal'].includes(message.theme))
            state.theme = message.theme
          render()
          if (
            state.pulse !== previousPulse &&
            state.session === 'ready' &&
            !state.project.blank
          )
            animatePulse()
        }
      }
      window.addEventListener('resize', fitDevice)
      window.addEventListener('pageshow', () =>
        send({ type: 'performer:ready' })
      )
      window.addEventListener('pagehide', () =>
        send({ type: 'performer:closed' })
      )
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) send({ type: 'performer:ready' })
      })
      render()
      send({ type: 'performer:ready' })
    </script>
  </body>
</html>
