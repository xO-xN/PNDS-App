<!doctype html>
<!-- THROWAWAY UI PROTOTYPE, 2026-11-10. Approved centered Pond waiting layout (A).
     Standalone prototype: explicitly switch projects with a 360-degree slingshot.
     Synthetic scores and loading only; no Host/API calls, persistence, Tauri or audio.
     Slingshot interaction reference: https://bencho.dev/?c=slingshot&theme=light
     Locale block is generated by npm run prototype:locales. -->
<html lang="zh-CN" data-variant="A">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PNDS池谱</title>
    <style>
      @font-face {
        font-family: Comfortaa;
        src: url('../../public/fonts/comfortaa-latin.woff2') format('woff2');
        font-display: swap;
      }
      @font-face {
        font-family: Manrope;
        src: url('../../public/fonts/manrope-latin.woff2') format('woff2');
        font-display: swap;
      }
      :root {
        color-scheme: light;
        --pond: #f1f5f8;
        --surface: #fcfdff;
        --ink: #293541;
        --secondary: #495b68;
        --accent: #1476cc;
        --line: #bdcbd6;
        --socket: #dce4eb;
        --good: #30634f;
        --danger: #9d3043;
        font:
          15px/1.6 Manrope,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: var(--pond);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled {
        cursor: wait;
      }
      button:focus-visible,
      summary:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        display: block;
      }
      .icon {
        inline-size: 18px;
        block-size: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .product {
        position: fixed;
        inset: 0;
        overflow: auto;
        overscroll-behavior: none;
      }
      .waiting-view {
        min-block-size: 100%;
        display: grid;
        grid-template-rows: 1fr auto;
        padding: max(32px, env(safe-area-inset-top))
          max(32px, env(safe-area-inset-right))
          max(116px, env(safe-area-inset-bottom))
          max(32px, env(safe-area-inset-left));
      }
      .waiting-layout {
        display: grid;
        place-items: center;
        min-block-size: 390px;
      }
      .waiting-inner {
        text-align: center;
        padding-block: 32px 12px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .brand-mark {
        inline-size: 116px;
        block-size: 116px;
        object-fit: contain;
      }
      .brand-name {
        font-family: Comfortaa, sans-serif;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0.035em;
        line-height: 1.3;
      }
      .connection {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--secondary);
        font-size: 13px;
      }
      .connection-dot {
        flex: none;
        inline-size: 6px;
        block-size: 6px;
        border-radius: 50%;
        background: var(--good);
      }
      .connection strong {
        font-weight: 600;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .waiting-copy {
        margin-block-start: 40px;
      }
      .waiting-copy h1 {
        margin: 14px 0 8px;
        font-size: clamp(23px, 3vw, 28px);
        line-height: 1.5;
        font-weight: 500;
        letter-spacing: -0.035em;
      }
      .waiting-copy p {
        margin: 0;
        color: var(--secondary);
        font-size: 14px;
      }
      .save-entry {
        inline-size: min(100%, 410px);
        text-align: center;
        justify-self: center;
      }
      .save-entry summary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-block-size: 44px;
        cursor: pointer;
        color: var(--secondary);
        font-size: 13px;
        list-style: none;
        border-radius: 4px;
      }
      .save-entry summary::-webkit-details-marker {
        display: none;
      }
      .save-entry .chevron {
        inline-size: 12px;
        block-size: 12px;
        transition: transform 180ms ease;
      }
      .save-entry[open] .chevron {
        transform: rotate(180deg);
      }
      .save-entry p {
        margin: 8px 0 0;
        color: var(--secondary);
        font-size: 12px;
      }
      .save-entry p + p {
        margin-block-start: 3px;
      }
      .split-status,
      .connection-caption {
        display: none;
      }
      .score-view {
        position: absolute;
        inset: 0;
        background: #fcfdff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: clamp(24px, 5vw, 64px);
        transition:
          filter 360ms ease,
          opacity 360ms ease;
      }
      .score-view.is-obscured {
        filter: blur(10px);
        opacity: 0.65;
        pointer-events: none;
        user-select: none;
      }
      .score-view.is-loading {
        opacity: 0;
        transition: opacity 240ms ease;
      }
      .score-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .score-project {
        margin: 0;
        font-size: clamp(26px, 4vw, 48px);
        font-weight: 450;
        letter-spacing: -0.05em;
      }
      .score-number {
        color: var(--secondary);
        font-size: 13px;
      }
      .score-body {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        align-content: center;
        gap: clamp(16px, 5vh, 58px) clamp(12px, 6vw, 100px);
        inline-size: min(100%, 900px);
        align-self: center;
      }
      .rune {
        border: 0;
        border-radius: 18px;
        background: transparent;
        padding: 18px;
        min-block-size: 100px;
        color: var(--ink);
      }
      .rune svg {
        inline-size: 100%;
        block-size: clamp(70px, 14vh, 130px);
        fill: none;
        stroke: currentColor;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rune:hover {
        background: #f1f5f8;
      }
      .rune[aria-pressed='true'] {
        color: var(--accent);
        background: #e6edf3;
      }
      .score-footer {
        display: flex;
        justify-content: space-between;
        color: var(--secondary);
        font-size: 12px;
        padding-block-end: 50px;
      }
      .switch-overlay {
        position: fixed;
        inset: 0;
        z-index: 2;
        background: #f1f5f880;
        display: grid;
        place-items: center;
        overflow: hidden auto;
        padding: 30px 20px 100px;
        outline: none;
      }
      .switch-content {
        text-align: center;
        inline-size: min(100%, 400px);
        position: relative;
      }
      .incoming,
      .gesture-copy,
      .gesture-hint,
      .key-hint,
      .tools,
      .tools-collapsed {
        transition: opacity 240ms ease;
      }
      .switch-overlay.is-busy .incoming,
      .switch-overlay.is-busy .gesture-copy,
      .switch-overlay.is-busy .gesture-hint,
      .switch-overlay.is-busy .key-hint,
      .tools.is-loading,
      .tools-collapsed.is-loading {
        opacity: 0;
        pointer-events: none;
      }
      .switch-overlay.is-busy .sling-ball {
        opacity: 0;
      }
      .incoming-label {
        margin: 0 0 9px;
        font-size: 13px;
        color: var(--secondary);
      }
      .incoming-project {
        margin: 0;
        font-size: 30px;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.025em;
        overflow-wrap: anywhere;
      }
      .slingshot {
        position: relative;
        inline-size: 240px;
        block-size: 260px;
        margin: 18px auto 0;
        user-select: none;
        -webkit-user-select: none;
      }
      .sling-svg {
        position: absolute;
        inset: 0;
        overflow: visible;
        inline-size: 240px;
        block-size: 260px;
      }
      .sling-band {
        fill: var(--socket);
        transition: fill 160ms ease;
      }
      .slingshot.is-armed .sling-band {
        fill: #c6dff4;
      }
      .sling-ball {
        position: absolute;
        inset-inline-start: 90px;
        inset-block-start: 80px;
        inline-size: 60px;
        block-size: 60px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--ink);
        color: white;
        display: grid;
        place-items: center;
        touch-action: none;
        cursor: grab;
        will-change: transform;
        box-shadow: 0 3px 6px #2935410a;
      }
      .sling-ball:active {
        cursor: grabbing;
      }
      .slingshot.is-armed .sling-ball {
        background: var(--accent);
      }
      .sling-arrow {
        inline-size: 26px;
        block-size: 26px;
        transition: transform 150ms ease;
      }
      .spinner {
        inline-size: 24px;
        block-size: 24px;
        border: 2px solid #495b6833;
        border-block-start-color: var(--secondary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .socket-loader {
        position: absolute;
        inset-inline-start: 90px;
        inset-block-start: 80px;
        inline-size: 60px;
        block-size: 60px;
        display: grid;
        place-items: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 240ms ease;
      }
      .switch-overlay.is-busy .socket-loader {
        opacity: 1;
      }
      .gesture-copy {
        margin: 0;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.6;
      }
      .gesture-hint {
        min-block-size: 20px;
        margin: 9px 0 0;
        font-size: 12px;
        color: var(--secondary);
      }
      .key-hint {
        margin: 18px 0 0;
        font-size: 11px;
        color: var(--secondary);
        visibility: hidden;
      }
      .switch-content:has(.sling-ball:focus-visible) .key-hint {
        visibility: visible;
      }
      .cancel-load {
        margin-block-start: 12px;
        padding: 4px 12px;
        min-block-size: 44px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--secondary);
        font-size: 13px;
      }
      .error-icon {
        color: var(--danger);
      }
      .tools {
        position: fixed;
        z-index: 5;
        inset-inline-start: 50%;
        inset-block-end: max(16px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        inline-size: max-content;
        max-inline-size: calc(100% - 24px);
        border: 1px solid #ffffff22;
        border-radius: 14px;
        background: #293541;
        color: #fcfdff;
        box-shadow: 0 8px 30px #29354118;
        font-size: 12px;
      }
      .tools-main {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px;
      }
      .tools button {
        display: grid;
        place-items: center;
        min-inline-size: 34px;
        min-block-size: 34px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: inherit;
      }
      .tools button:hover {
        background: #ffffff15;
      }
      .variant-label {
        min-inline-size: 106px;
        text-align: center;
        padding-inline: 2px;
      }
      .tools-rule {
        inline-size: 1px;
        align-self: stretch;
        margin-block: 6px;
        background: #ffffff25;
      }
      .tools select {
        max-inline-size: 144px;
        block-size: 34px;
        border: 0;
        border-radius: 7px;
        padding-inline: 8px 22px;
        background: #3a4652;
        color: #fcfdff;
        font-size: 12px;
        cursor: pointer;
      }
      .tools .language {
        max-inline-size: 84px;
      }
      .tools-extra {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 13px 9px;
        color: #e1e8ed;
        font-size: 10px;
      }
      .fail-option {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        white-space: nowrap;
        min-block-size: 24px;
      }
      .fail-option input {
        accent-color: #8bc4f3;
        margin: 0;
      }
      .state-readout {
        min-inline-size: 74px;
      }
      .tools-collapsed {
        position: fixed;
        z-index: 5;
        inset-inline-end: 14px;
        inset-block-end: max(14px, env(safe-area-inset-bottom));
        padding: 0 15px;
        min-block-size: 44px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        color: var(--secondary);
        font-size: 12px;
      }
      .sr-only {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 600px) {
        .waiting-view {
          padding-inline: 26px;
          padding-block-end: 138px;
        }
        .waiting-layout {
          min-block-size: 370px;
        }
        .brand-mark {
          inline-size: 100px;
          block-size: 100px;
        }
        .brand-name {
          font-size: 25px;
        }
        .waiting-copy {
          margin-block-start: 32px;
        }
        .tools-main {
          display: grid;
          grid-template-columns: minmax(84px, 1fr) 64px 30px;
          gap: 3px;
          padding: 6px;
        }
        .tools {
          inline-size: calc(100% - 24px);
        }
        .tools-rule {
          display: none;
        }
        #scene-select {
          grid-column: 1 / -1;
          grid-row: 2;
          max-inline-size: none;
          inline-size: 100%;
        }
        .tools button {
          min-inline-size: 30px;
        }
        .variant-label {
          min-inline-size: 84px;
          font-size: 11px;
        }
        .tools select {
          max-inline-size: 112px;
          font-size: 11px;
          padding-inline-start: 5px;
        }
        .tools .language {
          max-inline-size: 65px;
        }
        .tools-extra {
          font-size: 9px;
          gap: 8px;
        }
        .prototype-note {
          display: none;
        }
        .score-view {
          padding: 26px 22px;
        }
        .score-body {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .score-footer {
          padding-block-end: 86px;
        }
      }
      @media (max-height: 600px) and (min-width: 601px) {
        .waiting-view {
          padding-block: 18px 100px;
        }
        .waiting-layout {
          min-block-size: 240px;
        }
        .waiting-inner {
          padding-block: 0;
        }
        .brand {
          flex-direction: row;
          gap: 18px;
          justify-content: center;
        }
        .brand-mark {
          inline-size: 70px;
          block-size: 70px;
        }
        .waiting-copy {
          margin-block-start: 18px;
        }
        .switch-overlay {
          padding-block: 18px 90px;
        }
        .switch-content {
          display: grid;
          grid-template-columns: 200px 240px;
          align-items: center;
          inline-size: 480px;
        }
        .incoming {
          grid-column: 1;
          grid-row: 1;
          align-self: end;
        }
        .slingshot {
          grid-column: 2;
          grid-row: 1 / span 3;
          margin: 0;
        }
        .gesture-copy {
          grid-column: 1;
          grid-row: 2;
          font-size: 15px;
          margin-block-start: 20px;
        }
        .gesture-hint {
          grid-column: 1;
          grid-row: 3;
          align-self: start;
        }
        .key-hint {
          position: absolute;
          inset-block-end: -12px;
          inline-size: 100%;
        }
        .cancel-load {
          grid-column: 1;
          margin-block-start: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
        .spinner {
          animation: none;
          border-style: dotted;
        }
      }
    </style>
  </head>
  <body>
    <svg
      aria-hidden="true"
      style="
        position: absolute;
        inline-size: 0;
        block-size: 0;
        overflow: hidden;
      "
    >
      <defs>
        <symbol id="down" viewBox="0 0 24 24">
          <path d="m7 10 5 5 5-5" />
        </symbol>
        <symbol id="arrow" viewBox="0 0 24 24">
          <path d="M12 19V5m-6 6 6-6 6 6" />
        </symbol>
        <symbol id="bookmark" viewBox="0 0 24 24">
          <path d="M6 4h12v17l-6-4-6 4z" />
        </symbol>
      </defs>
    </svg>
    <main class="product" id="product">
      <section class="waiting-view" id="waiting-view">
        <div class="waiting-layout">
          <div class="waiting-inner">
            <div class="brand" role="img" data-i18n-label="brand">
              <img
                class="brand-mark"
                src="../../assets/pnds-icon.png"
                alt=""
                width="116"
                height="116"
              />
              <span class="brand-name" data-i18n="brand"></span>
            </div>
            <div class="waiting-copy">
              <div class="connection">
                <span class="connection-dot" aria-hidden="true"></span
                ><span data-i18n="connected"></span
                ><strong data-i18n="host"></strong>
              </div>
              <h1 data-i18n="waiting"></h1>
              <p data-i18n="waitingHint"></p>
            </div>
          </div>
        </div>
        <details class="save-entry" id="save-entry">
          <summary>
            <svg class="icon" aria-hidden="true"><use href="#bookmark" /></svg
            ><span data-i18n="save"></span
            ><svg class="icon chevron" aria-hidden="true">
              <use href="#down" />
            </svg>
          </summary>
          <p data-i18n="saveHint"></p>
          <p data-i18n="saveNote"></p>
        </details>
      </section>
      <section
        class="score-view"
        id="score-view"
        data-i18n-label="scoreLabel"
        hidden
      >
        <header class="score-header">
          <h1 class="score-project" id="score-project">runes</h1>
          <span class="score-number" data-i18n="scoreNumber"></span>
        </header>
        <div class="score-body">
          <button class="rune" aria-pressed="false" data-i18n-label="scoreOne">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path d="M60 17v86M60 38l-30 28M60 60l30-28M60 80l-30 22" />
            </svg>
          </button>
          <button class="rune" aria-pressed="false" data-i18n-label="scoreTwo">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="60" r="35" />
              <path d="M60 15v90M35 85l50-50" />
            </svg>
          </button>
          <button
            class="rune"
            aria-pressed="false"
            data-i18n-label="scoreThree"
          >
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path d="M27 100 60 20l33 80M39 72h42M60 20v80" />
            </svg>
          </button>
          <button class="rune" aria-pressed="false" data-i18n-label="scoreFour">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path d="M30 20v80l60-60v60M30 40l60 60" />
            </svg>
          </button>
          <button class="rune" aria-pressed="false" data-i18n-label="scoreFive">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path d="M60 15v90M25 40l35 30 35-30M25 70l35-30 35 30" />
            </svg>
          </button>
          <button class="rune" aria-pressed="false" data-i18n-label="scoreSix">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path d="M35 20v80M35 20l50 40-50 40M85 20 35 60l50 40" />
            </svg>
          </button>
        </div>
        <footer class="score-footer">
          <span data-i18n="scoreHint"></span><span data-i18n="scoreCue"></span>
        </footer>
      </section>
      <section
        class="switch-overlay"
        id="switch-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="incoming-project"
        aria-describedby="gesture-copy gesture-hint"
        tabindex="-1"
        hidden
      >
        <div class="switch-content">
          <div class="incoming">
            <p class="incoming-label" id="incoming-label"></p>
            <h2 class="incoming-project" id="incoming-project">III</h2>
          </div>
          <div class="slingshot" id="slingshot">
            <svg class="sling-svg" viewBox="0 0 240 260" aria-hidden="true">
              <path class="sling-band" id="sling-band" />
            </svg>
            <button
              class="sling-ball"
              id="sling-ball"
              data-i18n-label="gestureLabel"
              aria-describedby="gesture-copy gesture-hint"
            >
              <svg class="icon sling-arrow" id="sling-arrow" aria-hidden="true">
                <use href="#arrow" />
              </svg>
            </button>
            <div
              class="socket-loader"
              id="socket-loader"
              role="status"
              data-i18n-label="loading"
              aria-hidden="true"
            >
              <span class="spinner" id="spinner" hidden></span>
            </div>
          </div>
          <p class="gesture-copy" id="gesture-copy"></p>
          <p class="gesture-hint" id="gesture-hint" aria-live="polite"></p>
          <p class="key-hint" data-i18n="keyHint"></p>
          <button
            class="cancel-load"
            id="cancel-load"
            data-i18n="cancel"
            hidden
          ></button>
        </div>
      </section>
    </main>
    <!-- Review controls are prototype-only and never enter the production shell. -->
    <aside class="tools" id="tools">
      <div class="tools-main">
        <span class="variant-label" id="variant-label"></span>
        <span class="tools-rule"></span>

    <script>
      const translations = JSON.parse(
        document.querySelector('#prototype-translations').textContent
      )
      const query = new URLSearchParams(location.search)
      const allowedScenes = [
        'waiting',
        'first',
        'playing',
        'switch',
        'loading',
        'error',
      ]
      const state = {
        variant: 'A',
        language: query.get('lang') === 'en' ? 'en' : 'zh-CN',
        scene: allowedScenes.includes(query.get('scene'))
          ? query.get('scene')
          : 'waiting',
        phase: 'waiting',
        current: null,
        candidate: null,
        pull: 0,
        pullX: 0,
        pullY: 0,
        pointer: null,
        generation: 0,
        timer: 0,
        launchTimer: 0,
        animation: 0,
        hint: '',
        tools: query.get('tools') !== 'hidden',
        failNext: false,
      }
      const MIN_PULL = 18,
        FLICK_PULL = 8,
        FLICK_SPEED = 0.22
      const LOAD_MS = Math.min(
        10000,
        Math.max(800, Number(query.get('loadMs')) || 1500)
      )
      const REST = { x: 120, y: 110 }
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')
      const $ = id => document.getElementById(id)
      const t = key => translations[state.language][key] || key
      const overlay = $('switch-overlay'),
        ball = $('sling-ball'),
        sling = $('slingshot'),
        band = $('sling-band'),
        arrow = $('sling-arrow')
      const busy = () => ['launching', 'loading'].includes(state.phase)
      function syncUrl() {
        const params = new URLSearchParams(location.search)
        params.set('variant', 'A')
        params.set('scene', state.scene)
        params.set('lang', state.language)
        if (state.tools) params.delete('tools')
        else params.set('tools', 'hidden')
        try {
          history.replaceState(
            null,
            '',
            `${location.pathname}?${params}${location.hash}`
          )
        } catch {
          /* file:// history may be unavailable */
        }
      }
      function translate() {
        document.documentElement.lang = state.language
        document.title = t('pageTitle')
        document.querySelectorAll('[data-i18n]').forEach(el => {
          el.textContent = t(el.dataset.i18n)
        })
        document.querySelectorAll('[data-i18n-label]').forEach(el => {
          el.setAttribute('aria-label', t(el.dataset.i18nLabel))
        })
        $('language-select').value = state.language
      }
      function paintPull(x, y) {
        state.pullX = x
        state.pullY = y
        state.pull = Math.hypot(x, y)
        ball.style.transform = `translate(${x}px, ${y}px)`
        const a = 40,
          b = 35,
          distance = state.pull
        if (distance <= a - b) {
          band.setAttribute(
            'd',
            `M${REST.x - a},${REST.y}a${a},${a} 0 1,0 ${a * 2},0a${a},${a} 0 1,0 ${-a * 2},0Z`
          )
        } else {
          // Outer tangents join the socket and dragged disk at any angle.
          const theta = Math.atan2(y, x),
            normal = Math.acos((a - b) / distance)
          const point = (cx, cy, radius, angle) =>
            `${cx + radius * Math.cos(angle)},${cy + radius * Math.sin(angle)}`
          band.setAttribute(
            'd',
            `M${point(REST.x, REST.y, a, theta + normal)}L${point(REST.x + x, REST.y + y, b, theta + normal)}A${b},${b} 0 0,0 ${point(REST.x + x, REST.y + y, b, theta - normal)}L${point(REST.x, REST.y, a, theta - normal)}A${a},${a} 0 1,0 ${point(REST.x, REST.y, a, theta + normal)}Z`
          )
        }
        arrow.style.transform =
          state.pointer && distance > 2
            ? `rotate(${(Math.atan2(-x, y) * 180) / Math.PI}deg)`
            : 'rotate(0deg)'
      }
      function hintDrag() {
        if (reducedMotion.matches || !state.candidate || busy()) return
        arrow.animate(
          [
            { transform: 'rotate(0deg)' },
            { transform: 'rotate(-24deg)' },
            { transform: 'rotate(24deg)' },
            { transform: 'rotate(-12deg)' },
            { transform: 'rotate(8deg)' },
            { transform: 'rotate(0deg)' },
          ],
          { duration: 680, easing: 'ease-in-out' }
        )
      }
      function updateAction() {
        const first = !state.current,
          loading = state.phase === 'loading',
          armed = state.phase === 'armed'
        sling.classList.toggle('is-dragging', !!state.pointer)
        sling.classList.toggle('is-armed', armed)
        arrow.toggleAttribute('hidden', loading)
        $('spinner').hidden = !busy()
        ball.disabled = busy()
        overlay.setAttribute('aria-busy', String(busy()))
        overlay.classList.toggle('is-busy', busy())
        $('socket-loader').setAttribute('aria-hidden', String(!busy()))
        $('score-view').classList.toggle('is-loading', busy())
        for (const element of document.querySelectorAll(
          '.incoming, #gesture-copy, #gesture-hint, .key-hint'
        )) {
          element.inert = busy()
          element.setAttribute('aria-hidden', String(busy()))
        }
        for (const element of [$('tools'), $('show-tools')]) {
          element.inert = busy()
          element.classList.toggle('is-loading', busy())
          element.setAttribute('aria-hidden', String(busy()))
        }
        $('cancel-load').hidden = true
        $('incoming-label').textContent = t(first ? 'firstReady' : 'ready')
        $('incoming-project').textContent = state.candidate || 'III'
        if (!busy() || !$('gesture-copy').textContent)
          $('gesture-copy').textContent = t(
            state.phase === 'error'
              ? 'failed'
              : armed
                ? first
                  ? 'releaseFirst'
                  : 'release'
                : first
                  ? 'pullFirst'
                  : 'pull'
          )
        $('gesture-copy').classList.toggle(
          'error-icon',
          state.phase === 'error'
        )
        const hint = busy()
          ? 'loadingHint'
          : state.hint ||
            (state.phase === 'error'
              ? first
                ? 'firstFailedHint'
                : 'failedHint'
              : state.pointer && !armed
                ? 'pullMore'
                : null)
        if (!busy() || !$('gesture-hint').textContent)
          $('gesture-hint').textContent = hint ? t(hint) : '\u00a0'
        $('state-readout').textContent =
          `${t('stateLabel')} · ${t(`state${state.phase[0].toUpperCase()}${state.phase.slice(1)}`)}`
      }
      function render() {
        const switching = !!state.candidate
        $('waiting-view').hidden = !!state.current || switching
        $('waiting-view').inert = switching
        $('waiting-view').setAttribute(
          'aria-hidden',
          String(switching || !!state.current)
        )
        $('score-view').hidden = !state.current
        $('score-view').inert = switching
        $('score-view').setAttribute(
          'aria-hidden',
          String(switching || !state.current)
        )
        $('score-view').classList.toggle('is-obscured', switching)
        $('score-project').textContent = state.current || 'runes'
        overlay.hidden = !switching
        $('scene-select').value = state.scene
        $('variant-label').textContent = t('variantA')
        $('tools').hidden = !state.tools
        $('show-tools').hidden = state.tools
        $('fail-next').checked = state.failNext
        updateAction()
        syncUrl()
      }
      function stopAttempt() {
        state.generation += 1
        clearTimeout(state.timer)
        clearTimeout(state.launchTimer)
        cancelAnimationFrame(state.animation)
        state.timer = state.launchTimer = state.animation = 0
        const pointer = state.pointer
        state.pointer = null
        if (
          pointer &&
          pointer.id !== null &&
          ball.hasPointerCapture?.(pointer.id)
        )
          ball.releasePointerCapture(pointer.id)
        ball.getAnimations().forEach(animation => animation.cancel())
        arrow.getAnimations().forEach(animation => animation.cancel())
        ball.style.opacity = ''
        paintPull(0, 0)
      }
      function setScene(scene) {
        stopAttempt()
        state.scene = scene
        state.hint = ''
        state.current = ['playing', 'switch', 'loading', 'error'].includes(
          scene
        )
          ? 'runes'
          : null
        state.candidate = ['first', 'switch', 'loading', 'error'].includes(
          scene
        )
          ? 'III'
          : null
        state.phase =
          scene === 'loading'
            ? 'loading'
            : scene === 'error'
              ? 'error'
              : state.candidate
                ? 'ready'
                : state.current
                  ? 'playing'
                  : 'waiting'
        state.failNext = false
        document
          .querySelectorAll('.rune')
          .forEach(button => button.setAttribute('aria-pressed', 'false'))
        render()
        if (busy()) overlay.focus({ preventScroll: true })
        hintDrag()
      }
      function springHome(hint = '') {
        const from = { x: state.pullX, y: state.pullY }
        cancelAnimationFrame(state.animation)
        state.pointer = null
        state.phase = 'ready'
        state.hint = hint
        updateAction()
        if (reducedMotion.matches) {
          paintPull(0, 0)
          return
        }
        const started = performance.now(),
          generation = state.generation
        function frame(now) {
          if (generation !== state.generation) return
          const elapsed = Math.min((now - started) / 1000, 0.55)
          const spring = Math.exp(-12 * elapsed) * Math.cos(17 * elapsed)
          paintPull(from.x * spring, from.y * spring)
          if (elapsed < 0.55) state.animation = requestAnimationFrame(frame)
          else {
            state.animation = 0
            paintPull(0, 0)
          }
        }
        state.animation = requestAnimationFrame(frame)
      }
      function beginLoad(speed = 0) {
        if (!state.candidate || busy()) return
        const from = { x: state.pullX, y: state.pullY },
          distance = state.pull
        const fail = state.failNext,
          target = state.candidate
        const direction =
          distance > 0
            ? { x: -from.x / distance, y: -from.y / distance }
            : { x: 0, y: -1 }
        const flight = Math.min(360, 140 + distance + speed * 110)
        stopAttempt()
        const generation = state.generation
        state.phase = reducedMotion.matches ? 'loading' : 'launching'
        state.hint = ''
        state.failNext = false
        if (!reducedMotion.matches) {
          arrow.style.transform = `rotate(${(Math.atan2(direction.x, -direction.y) * 180) / Math.PI}deg)`
          ball.animate(
            [
              { transform: `translate(${from.x}px,${from.y}px)`, opacity: 1 },
              {
                transform: `translate(${direction.x * flight}px,${direction.y * flight}px)`,
                opacity: 0,
              },
            ],
            { duration: 420, easing: 'cubic-bezier(.18,.7,.25,1)' }
          )
          state.launchTimer = setTimeout(() => {
            if (
              generation !== state.generation ||
              state.candidate !== target ||
              state.phase !== 'launching'
            )
              return
            state.launchTimer = 0
            state.phase = 'loading'
            arrow.style.transform = 'rotate(0deg)'
            updateAction()
          }, 420)
        }
        render()
        overlay.focus({ preventScroll: true })
        state.timer = setTimeout(() => {
          if (generation !== state.generation || state.candidate !== target)
            return
          state.timer = 0
          if (fail) {
            state.phase = 'error'
            render()
            ball.focus({ preventScroll: true })
            return
          }
          state.current = target
          state.candidate = null
          state.phase = 'playing'
          state.scene = 'playing'
          render()
          $('announcement').textContent = t('loaded')
          document.querySelector('.rune').focus({ preventScroll: true })
        }, LOAD_MS)
      }
      function cancelLoad() {
        if (!busy()) return
        stopAttempt()
        state.phase = 'ready'
        if (state.scene === 'loading')
          state.scene = state.current ? 'switch' : 'first'
        state.hint = 'cancelled'
        render()
        ball.focus({ preventScroll: true })
      }
      function sampleGrip(event) {
        const grip = state.pointer
        if (!grip || (grip.mode !== 'mouse' && grip.id !== event.pointerId))
          return 0
        const now = performance.now()
        if (Number.isFinite(event.clientX) && Number.isFinite(event.clientY)) {
          grip.lastX = event.clientX
          grip.lastY = event.clientY
        }
        grip.samples.push({ x: grip.lastX, y: grip.lastY, t: now })
        grip.samples = grip.samples.filter(sample => now - sample.t <= 100)
        const oldest = grip.samples[0],
          elapsed = now - oldest.t
        const speed =
          elapsed >= 8
            ? Math.hypot(grip.lastX - oldest.x, grip.lastY - oldest.y) / elapsed
            : 0
        const x = grip.lastX - grip.x,
          y = grip.lastY - grip.y,
          raw = Math.hypot(x, y)
        const radius = raw <= 72 ? raw : 72 + 46 * Math.tanh((raw - 72) / 46)
        const scale = raw ? radius / raw : 1
        paintPull(x * scale, y * scale)
        return speed
      }
      const hasIntent = speed =>
        state.pull >= MIN_PULL ||
        (state.pull >= FLICK_PULL && speed >= FLICK_SPEED)
      function startGrip(event, mode) {
        if (event.button !== 0 || !state.candidate || busy() || state.pointer)
          return
        event.preventDefault()
        cancelAnimationFrame(state.animation)
        state.animation = 0
        arrow.getAnimations().forEach(animation => animation.cancel())
        paintPull(0, 0)
        state.pointer = {
          id: mode === 'mouse' ? null : event.pointerId,
          mode,
          x: event.clientX,
          y: event.clientY,
          lastX: event.clientX,
          lastY: event.clientY,
          generation: state.generation,
          samples: [
            { x: event.clientX, y: event.clientY, t: performance.now() },
          ],
        }
        state.phase = 'dragging'
        state.hint = ''
        if (mode === 'pointer') ball.setPointerCapture(event.pointerId)
        ball.focus({ preventScroll: true })
        updateAction()
      }
      ball.addEventListener('pointerdown', event => {
        if (event.isPrimary) startGrip(event, 'pointer')
      })
      // Safari can omit pointerdown after closing a native select popup while
      // still sending mousedown. Track that first mouse gesture without capture.
      ball.addEventListener('mousedown', event => startGrip(event, 'mouse'))
      ball.addEventListener('pointermove', event => {
        if (!state.pointer || state.pointer.id !== event.pointerId) return
        const speed = sampleGrip(event)
        state.phase = hasIntent(speed) ? 'armed' : 'dragging'
        updateAction()
      })
      window.addEventListener('mousemove', event => {
        if (state.pointer?.mode !== 'mouse') return
        const speed = sampleGrip(event)
        state.phase = hasIntent(speed) ? 'armed' : 'dragging'
        updateAction()
      })
      function release(event, cancelled, mode = 'pointer') {
        const grip = state.pointer
        if (
          !grip ||
          grip.mode !== mode ||
          (mode === 'pointer' && grip.id !== event.pointerId)
        )
          return
        if (mode === 'mouse' && !cancelled && event.button !== 0) return
        const speed = cancelled ? 0 : sampleGrip(event)
        const confirm =
          !cancelled && hasIntent(speed) && grip.generation === state.generation
        state.pointer = null
        if (grip.id !== null && ball.hasPointerCapture(grip.id))
          ball.releasePointerCapture(grip.id)
        if (confirm) beginLoad(speed)
        else springHome(cancelled ? '' : 'shortPull')
      }
      ball.addEventListener('pointerup', event => release(event, false))
      ball.addEventListener('pointercancel', event => release(event, true))
      window.addEventListener('mouseup', event =>
        release(event, false, 'mouse')
      )
      ball.addEventListener('lostpointercapture', event => {
        if (state.pointer) release(event, true)
      })
      ball.addEventListener('click', event => {
        if (event.detail === 0) beginLoad()
      })
      ball.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault()
          if (!event.repeat) beginLoad()
        }
      })
      window.addEventListener('blur', () => {
        if (state.pointer)
          release({ pointerId: state.pointer.id }, true, state.pointer.mode)
      })
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state.pointer)
          release({ pointerId: state.pointer.id }, true, state.pointer.mode)
      })
      $('cancel-load').addEventListener('click', cancelLoad)
      $('scene-select').addEventListener('change', event =>
        setScene(event.target.value)
      )
      $('language-select').addEventListener('change', event => {
        state.language = event.target.value
        translate()
        render()
      })
      $('fail-next').addEventListener('change', event => {
        state.failNext = event.target.checked
      })
      $('hide-tools').addEventListener('click', () => {
        state.tools = false
        render()
        $('show-tools').focus({ preventScroll: true })
      })
      $('show-tools').addEventListener('click', () => {
        state.tools = true
        render()
        $('hide-tools').focus({ preventScroll: true })
      })
      document
        .querySelectorAll('.rune')
        .forEach(button =>
          button.addEventListener('click', () =>
            button.setAttribute(
              'aria-pressed',
              String(button.getAttribute('aria-pressed') !== 'true')
            )
          )
        )
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          if (state.pointer) {
            release({ pointerId: state.pointer.id }, true, state.pointer.mode)
            event.preventDefault()
          } else if (busy()) {
            cancelLoad()
            event.preventDefault()
          }
          return
        }
        if (event.key === 'Tab' && !overlay.hidden) {
          const candidates = [
            ...overlay.querySelectorAll('button:not(:disabled)'),
            ...document.querySelectorAll(
              '#tools button,#tools select,#tools input,#show-tools'
            ),
          ].filter(
            el =>
              !el.hidden && !el.closest('[inert]') && el.getClientRects().length
          )
          if (!candidates.length) {
            event.preventDefault()
            return
          }
          const index = candidates.indexOf(document.activeElement)
          if (event.shiftKey && index <= 0) {
            event.preventDefault()
            candidates.at(-1).focus()
          } else if (
            !event.shiftKey &&
            (index === -1 || index === candidates.length - 1)
          ) {
            event.preventDefault()
            candidates[0].focus()
          }
        }
      })
      translate()
      setScene(state.scene)
    </script>
  </body>
</html>
