<!doctype html>
<!-- Throwaway button review, 2026-11-08. Confirmed rainbow Load/Reopen,
     red Close and gold Node. All actions are memory-only.
     Shared production palette/material; inline production rim optics retain MIT.
     Keep this file in place so relative CSS and font paths remain valid. -->
<html lang="zh-CN" data-color-theme="pond">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PNDS · 动作色环核对</title>
    <link rel="stylesheet" href="../../src/theme-variables.css" />
    <link
      rel="stylesheet"
      href="../../src/components/shell/desktop-controls.css"
    />
    <style>
      @font-face {
        font-family: Comfortaa;
        src: url('../../public/fonts/comfortaa-latin.woff2') format('woff2');
        font-weight: 300 700;
        font-display: swap;
      }
      @font-face {
        font-family: Archivo;
        src: url('../../public/fonts/archivo-latin.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        color: var(--pnds-text);
        background: var(--pnds-performance-workspace);
        font: 13px/1.6 var(--pnds-font-ui);
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled {
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--pnds-desktop-control-line);
        outline-offset: 4px;
      }
      .page {
        max-inline-size: 1120px;
        margin-inline: auto;
        padding: 32px 38px 160px;
      }
      .masthead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }
      .wordmark {
        font:
          600 23px/1.2 Comfortaa,
          system-ui;
        letter-spacing: -0.7px;
      }
      .prototype-label {
        color: var(--pnds-text-secondary);
        font-size: 11px;
      }
      h1 {
        margin: 38px 0 8px;
        font-size: clamp(24px, 3vw, 32px);
        font-weight: 550;
        letter-spacing: -0.7px;
        line-height: 1.35;
      }
      .intro {
        margin: 0 0 28px;
        color: var(--pnds-text-secondary);
        max-inline-size: 700px;
      }
      .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin: 24px 0 12px;
      }
      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .section-title span {
        color: var(--pnds-text-secondary);
        font-size: 11px;
      }
      .specimens {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border-block: 1px solid var(--pnds-performance-line);
        background: var(--pnds-desktop-bar);
      }
      .specimen {
        min-inline-size: 0;
        padding: 30px 12px 18px;
        text-align: center;
      }
      .specimen + .specimen {
        border-inline-start: 1px solid var(--pnds-performance-line);
      }
      .sample-space {
        display: grid;
        place-items: center;
        block-size: 50px;
      }
      .sample-space .prototype-action {
        inline-size: 112px;
        flex: none;
      }
      .specimen p {
        margin: 14px 0 0;
        font-size: 11px;
        color: var(--pnds-text-secondary);
      }
      .swatches {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin-block-start: 9px;
      }
      .swatches i {
        inline-size: 8px;
        block-size: 8px;
        border-radius: 50%;
        background: var(--swatch);
      }
      [data-enlarged='true'] .sample-space {
        block-size: 78px;
      }
      [data-enlarged='true'] .sample-space .prototype-action {
        transform: scale(1.65);
      }

      /* The same 30px glass, one 1.1px rim and the production optical engine.
         Only decorative pixels receive colour. The label has no content filter. */
      .desktop-bar .prototype-action {
        --glass-fill: var(--pnds-desktop-glass-neutral);
        --glass-ink: var(--pnds-desktop-glass-ink);
        --glass-power: 0;
        --glass-play: paused;
        --rest-power: 0.68;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        inline-size: 112px;
        block-size: 30px;
        padding: 0 12px;
        background: transparent;
        line-height: 1;
        white-space: nowrap;
        transition:
          box-shadow 180ms,
          opacity 180ms;
      }
      .prototype-action:is([data-action='load'], [data-action='reopen']) {
        --ring-rest: var(--pnds-desktop-control-line);
        --pnds-desktop-rainbow: inherit;
      }
      .prototype-action[data-action='close'] {
        --ring-rest: #ed1c2e;
        --rest-power: 0.82;
        --pnds-desktop-rainbow: conic-gradient(
          #b80f1c 0deg,
          #ed1c2e 95deg,
          #ff4b59 205deg,
          #ed1c2e 300deg,
          #b80f1c 360deg
        );
      }
      .prototype-action[data-action='node'] {
        --ring-rest: #f49b25;
        --pnds-desktop-rainbow: conic-gradient(
          #ca6711 0deg,
          #f49b25 95deg,
          #ffca58 205deg,
          #f49b25 300deg,
          #ca6711 360deg
        );
      }
      .desktop-bar .prototype-action .desktop-action-static-rim {
        display: block;
        position: absolute;
        z-index: 4;
        inset: 1px;
        border: 1.1px solid var(--ring-rest);
        border-radius: inherit;
        opacity: var(--rest-power);
        transition: opacity 180ms ease;
      }
      .desktop-bar .prototype-action .desktop-action-rim {
        transition: opacity 180ms ease;
      }
      /* Keep the lens constant, including the production hover/focus selector.
         The ring and its static replacement share one complementary fade. */
      .desktop-bar .prototype-action .desktop-action-lens,
      .desktop-bar
        .prototype-action:is(:hover, :focus-visible):not(:disabled)
        .desktop-action-lens {
        background: color-mix(
          in srgb,
          var(--pnds-desktop-glass-tint)
            calc(var(--pnds-desktop-glass-tint-opacity) * 100%),
          transparent
        );
        transition: none;
      }
      /* Pause in place at exit. Removing the animation would reset its phase
         while the coloured pixels are still fading out. */
      .desktop-bar .prototype-action:hover:not(:disabled) {
        --glass-power: 1;
        --glass-play: running;
      }
      .desktop-bar
        .prototype-action:hover:not(:disabled)
        .desktop-action-static-rim {
        opacity: 0;
      }
      .desktop-bar .prototype-action:disabled:not([data-busy='true']) {
        --glass-power: 0;
        --glass-play: paused;
        --ring-rest: var(--pnds-desktop-control-line);
        --glass-ink: var(--pnds-text-secondary);
        opacity: 0.55;
      }
      .desktop-bar .prototype-action[data-busy='true'] {
        --glass-power: 0;
        --glass-play: paused;
        opacity: 0.8;
      }
      [data-paused='true'] .desktop-action-orbit {
        animation-play-state: paused !important;
      }
      [data-glow='false'] .desktop-action-glow {
        display: none;
      }
      :where([data-color-theme='brutal']) .desktop-bar .prototype-action {
        background: var(--pnds-desktop-glass-neutral);
        box-shadow: inset 0 0 0 1px var(--pnds-desktop-control-line);
        border-radius: 0;
        overflow: hidden;
      }
      :where([data-color-theme='brutal'])
        .desktop-bar
        .prototype-action[data-action='load']:not(:disabled) {
        box-shadow: inset 0 0 0 2px var(--ring-rest);
      }
      :where([data-color-theme='brutal'])
        .desktop-bar
        .prototype-action[data-action='close']:not(:disabled) {
        box-shadow: inset 0 0 0 2px var(--ring-rest);
      }
      :where([data-color-theme='brutal'])
        .desktop-bar
        .prototype-action:is([data-action='reopen'], [data-action='node']):not(
          :disabled
        ) {
        box-shadow: inset 0 0 0 2px var(--ring-rest);
      }

      .app-frame {
        position: relative;
        overflow: hidden;
        block-size: 334px;
        border: 1px solid var(--pnds-performance-line);
        border-radius: 16px;
        background: var(--pnds-performance-workspace);
      }
      .app-main {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        block-size: calc(100% - 50px);
      }
      .sidebar {
        margin: 12px;
        padding: 16px 12px;
        border: 1px solid var(--pnds-performance-line);
        border-radius: 13px;
        background: var(--pnds-performance-nav);
      }
      .window-dots {
        display: flex;
        gap: 7px;
        margin-block-end: 19px;
      }
      .window-dots i {
        inline-size: 10px;
        block-size: 10px;
        border: 1px solid #0001;
        border-radius: 50%;
        background: #ff6258;
      }
      .window-dots i:nth-child(2) {
        background: #ffbd2e;
      }
      .window-dots i:nth-child(3) {
        background: #28c840;
      }
      .identity {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 8px 18px;
        font: 600 17px/1.4 system-ui;
      }
      .identity span {
        font-weight: 300;
      }
      .project-card {
        inline-size: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 12px;
        block-size: 57px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        text-align: start;
      }
      .project-card b {
        font-size: 10px;
        font-weight: 400;
        color: var(--pnds-text-secondary);
      }
      .project-card span {
        font-size: 13px;
      }
      .project-card[aria-pressed='true'] {
        background: var(--pnds-performance-raised);
        border-color: var(--pnds-performance-line);
        box-shadow: var(--pnds-project-selection-shadow);
      }
      .project-card:hover:not(:disabled) {
        background: var(--pnds-performance-raised);
      }
      .preview-content {
        position: relative;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 24px;
        overflow: hidden;
        text-align: center;
      }
      .score-lines {
        position: absolute;
        inset: 0;
        opacity: 0.2;
        pointer-events: none;
        color: var(--pnds-text-secondary);
      }
      .score-lines svg {
        inline-size: 100%;
        block-size: 100%;
      }
      .preview-content h3 {
        z-index: 1;
        margin: 0 0 10px;
        font:
          400 34px/1.2 Comfortaa,
          system-ui;
        letter-spacing: -1px;
      }
      .preview-content p {
        z-index: 1;
        margin: 0;
        font-size: 12px;
        color: var(--pnds-text-secondary);
      }
      .app-bar {
        position: absolute;
        inset-inline: 0;
        inset-block-end: 0;
        display: flex;
        align-items: center;
        gap: 15px;
        block-size: 50px;
        padding-inline: 14px;
        border-block-start: 1px solid var(--pnds-performance-line);
        background: var(--pnds-desktop-bar);
      }
      .bar-icon {
        display: flex;
        align-items: center;
        color: var(--pnds-text-secondary);
      }
      .bar-icon svg {
        inline-size: 15px;
        block-size: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }
      .gain-track {
        position: relative;
        inline-size: 65px;
        block-size: 3px;
        border-radius: 5px;
        background: var(--pnds-performance-line);
      }
      .gain-track::after {
        content: '';
        position: absolute;
        inset-inline-start: 70%;
        inset-block-start: -3px;
        inline-size: 9px;
        block-size: 9px;
        border-radius: 50%;
        background: var(--pnds-text-secondary);
      }
      .bar-value {
        font-size: 10px;
        color: var(--pnds-text-secondary);
      }
      .bar-spacer {
        flex: 1;
      }
      .mode-label {
        min-inline-size: 130px;
        text-align: center;
        color: var(--pnds-text-secondary);
        font-size: 11px;
      }
      .state-line {
        display: flex;
        gap: 8px;
        margin: 13px 0 0;
        font-size: 11px;
        color: var(--pnds-text-secondary);
      }
      .state-line strong {
        color: var(--pnds-text);
        font-weight: 500;
      }
      .notes {
        margin-block-start: 23px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }
      .notes p {
        margin: 5px 0 0;
        color: var(--pnds-text-secondary);
        font-size: 12px;
      }
      .review-controls {
        position: fixed;
        z-index: 20;
        inset-inline: 22px;
        inset-block-end: 16px;
        max-inline-size: 1100px;
        margin-inline: auto;
        padding: 13px 17px;
        color: #f1f5f9;
        background: #202b35;
        border: 1px solid #46535f;
        border-radius: 12px;
        box-shadow: 0 8px 30px #0003;
        font: 12px/1.5 system-ui;
      }
      .review-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 11px 18px;
      }
      .review-row + .review-row {
        margin-block-start: 10px;
        padding-block-start: 10px;
        border-block-start: 1px solid #ffffff26;
      }
      .review-controls label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .review-controls select,
      .review-controls button {
        min-block-size: 28px;
        padding: 3px 8px;
        border: 1px solid #62707c;
        border-radius: 5px;
        color: #f1f5f9;
        background: #2d3b48;
      }
      .review-controls option {
        background: #2d3b48;
      }
      .review-controls input {
        accent-color: #a8d7fa;
      }
      .review-title {
        font-weight: 600;
        margin-inline-end: 4px;
      }
      .review-controls :focus-visible {
        outline-color: #c7e5ff;
        outline-offset: 3px;
      }
      :where([data-color-theme='brutal'])
        :is(.app-frame, .sidebar, .project-card, .review-controls) {
        border-radius: 0;
      }
      @media (max-width: 760px) {
        .page {
          padding: 23px 20px 210px;
        }
        .specimens {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .specimen:nth-child(3) {
          border-inline-start: 0;
        }
        .specimen:nth-child(n + 3) {
          border-block-start: 1px solid var(--pnds-performance-line);
        }
        .app-main {
          grid-template-columns: 210px minmax(0, 1fr);
        }
        .sidebar {
          padding: 13px 7px;
        }
        .identity {
          font-size: 14px;
        }
        .gain-track,
        .bar-value,
        .bar-optional {
          display: none;
        }
        .mode-label {
          min-inline-size: 80px;
        }
        .notes {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .review-controls {
          inset-inline: 10px;
          inset-block-end: 10px;
        }
      }
      @media (max-width: 470px) {
        .page {
          padding-inline: 14px;
          padding-block-end: 270px;
        }
        h1 {
          margin-block-start: 28px;
        }
        .app-main {
          grid-template-columns: 145px minmax(0, 1fr);
        }
        .sidebar {
          margin: 7px;
          padding-inline: 5px;
        }
        .identity {
          display: block;
          margin-inline: 5px;
        }
        .identity span {
          display: block;
          font-size: 11px;
        }
        .project-card {
          gap: 6px;
          padding-inline: 6px;
        }
        .project-card span {
          font-size: 11px;
        }
        .preview-content {
          padding: 10px;
        }
        .preview-content h3 {
          font-size: 25px;
        }
        .preview-content p {
          font-size: 11px;
        }
        .section-title {
          flex-wrap: wrap;
          gap: 3px;
        }
        .prototype-label {
          max-inline-size: 135px;
          text-align: end;
        }
        .app-bar {
          gap: 12px;
          padding-inline: 10px;
        }
        .mode-label {
          min-inline-size: 70px;
        }
        [data-enlarged='true'] .sample-space .prototype-action {
          transform: scale(1.25);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .desktop-bar .prototype-action .desktop-action-orbit {
          animation: none !important;
        }
        .desktop-bar .prototype-action .desktop-action-static-rim {
          opacity: var(--rest-power) !important;
          transition: none;
        }
        .desktop-bar .prototype-action:not(:disabled) {
          box-shadow: inset 0 0 0 1px
            var(--ring-rest, var(--pnds-desktop-control-line));
        }
      }
      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        .desktop-bar .prototype-action {
          background: var(--pnds-desktop-glass-neutral);
        }
      }
      @media (forced-colors: active) {
        .desktop-bar .prototype-action {
          background: ButtonFace;
          color: ButtonText;
          border: 1px solid ButtonText;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <span class="wordmark">PNDS</span>
        <span class="prototype-label" data-i18n="按钮色环 · 交互原型"></span>
      </header>
      <h1 data-i18n="同一层玻璃，不同的动作色"></h1>
      <p
        class="intro"
        data-i18n="加载与重新打开共用彩虹环，关闭用红色，设置节点用金橙。"
      ></p>

      <div class="section-title">
        <h2 data-i18n="色环对照"></h2>
        <span data-i18n="先悬停看动效，再点击放入下方底栏"></span>
      </div>
      <section class="specimens desktop-bar" aria-label="色环对照">
        <div class="specimen">
          <div class="sample-space">
            <button
              type="button"
              class="desktop-session-action prototype-action"
              data-action="load"
              data-scene="selected"
            >
              <span class="button-label" data-i18n="加载"></span>
            </button>
          </div>
          <p data-i18n="原版七色彩虹"></p>
          <div class="swatches" id="load-swatches" aria-hidden="true"></div>
        </div>
        <div class="specimen">
          <div class="sample-space">
            <button
              type="button"
              class="desktop-session-action prototype-action"
              data-action="close"
              data-scene="running"
            >
              <span class="button-label" data-i18n="关闭"></span>
            </button>
          </div>
          <p data-i18n="深红 / 正红 / 亮红"></p>
          <div class="swatches" aria-hidden="true">
            <i style="--swatch: #b80f1c"></i><i style="--swatch: #ed1c2e"></i
            ><i style="--swatch: #ff4b59"></i>
          </div>
        </div>
        <div class="specimen">
          <div class="sample-space">
            <button
              type="button"
              class="desktop-session-action prototype-action"
              data-action="reopen"
              data-scene="pending"
            >
              <span class="button-label" data-i18n="重新打开"></span>
            </button>
          </div>
          <p data-i18n="原版七色彩虹"></p>
          <div class="swatches" id="reopen-swatches" aria-hidden="true"></div>
        </div>
        <div class="specimen">
          <div class="sample-space">
            <button
              type="button"
              class="desktop-session-action prototype-action"
              data-action="node"
              data-scene="node"
            >
              <span class="button-label" data-i18n="设置节点"></span>
            </button>
          </div>
          <p data-i18n="深金橙 / 橙金 / 浅金"></p>
          <div class="swatches" aria-hidden="true">
            <i style="--swatch: #ca6711"></i><i style="--swatch: #f49b25"></i
            ><i style="--swatch: #ffca58"></i>
          </div>
        </div>
      </section>

      <div class="section-title">
        <h2 data-i18n="放回演出底栏"></h2>
        <span data-i18n="原尺寸 112 × 30 · 底栏高 50"></span>
      </div>
      <section class="app-frame" aria-label="底栏交互演示">
        <div class="app-main">
          <aside class="sidebar">
            <div class="window-dots" aria-hidden="true">
              <i></i><i></i><i></i>
            </div>
            <div class="identity">
              <b data-i18n="池主"></b><span>Studio Mac</span>
            </div>
            <button
              type="button"
              class="project-card"
              id="select-project"
              aria-pressed="true"
            >
              <b>01</b><span>runes</span>
            </button>
            <div class="project-card">
              <b>02</b><span>Inarticulate III</span>
            </div>
          </aside>
          <div class="preview-content">
            <div class="score-lines" aria-hidden="true">
              <svg viewBox="0 0 680 300" preserveAspectRatio="none">
                <g fill="none" stroke="currentColor" stroke-width=".7">
                  <path d="M-20 245C140 42 350 308 720 58" />
                  <path d="M-20 259C145 63 350 325 720 72" />
                  <path d="M-20 273C150 84 350 342 720 86" />
                  <path d="M-20 287C155 105 350 359 720 100" />
                  <path d="M-20 301C160 126 350 376 720 114" />
                </g>
              </svg>
            </div>
            <h3>runes</h3>
            <p id="scene-description" aria-live="polite"></p>
          </div>
        </div>
        <div class="desktop-bar app-bar">
          <button
            type="button"
            class="desktop-session-action prototype-action"
            id="session-action"
            data-action="load"
          >
            <span class="button-label"></span>
          </button>
          <span class="bar-icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path
                d="M10 5 5 9H2v6h3l5 4V5Z M14 8c3 2 3 6 0 8 M17 5c5 4 5 10 0 14"
              /></svg
          ></span>
          <span class="gain-track" aria-hidden="true"></span
          ><span class="bar-value">80%</span>
          <span class="bar-spacer"></span>
          <span class="bar-icon bar-optional" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path

            const entry = lensMap(p, Math.min(dpr, 2))
            if (!filter) {
              filter = node('filter', {
                filterUnits: 'objectBoundingBox',
                x: 0,
                y: 0,
                width: 1,
                height: 1,
                primitiveUnits: 'objectBoundingBox',
                'color-interpolation-filters': 'sRGB',
              })
              graph = buildGraph(filter, engine)
              defsNode().appendChild(filter)
            }
            if (wanted !== entry) {
              wanted = entry
              const seq = ++request
              if (entry.decoded) show(entry)
              else
                void entry.ready.then(ready => {
                  if (destroyed || seq !== request) return
                  if (!ready) {
                    stop()
                    return
                  }
                  show(entry)
                  schedule()
                })
            }
            if (!shown || !graph) return
            const snappedWidth = Math.round(width * dpr) / dpr
            const snappedHeight = Math.round(height * dpr) / dpr
            const radius = Math.min(
              p.radius,
              snappedWidth / 2,
              snappedHeight / 2
            )
            target.style.clipPath = `inset(0 ${width - snappedWidth}px ${height - snappedHeight}px 0 round ${radius}px)`
            for (const element of graph.lensRect)
              setRect(element, snappedWidth / width, snappedHeight / height)
            const { scale, kx, ky } = bendScale(
              p.refraction,
              width,
              height,
              engine
            )
            graph.displace.forEach((element, index) =>
              element.setAttribute(
                'scale',
                String(scale * (1 + (p.chroma * index) / 2))
              )
            )
            graph.aspect?.setAttribute(
              'values',
              `${kx} 0 0 0 ${(1 - kx) / 2}  0 ${ky} 0 0 ${(1 - ky) / 2}  0 0 1 0 0  0 0 0 1 0`
            )
            filter.id = `${base}-v${++version}`
            target.style.filter = `url(#${filter.id})`
            target.dataset.rimOptics = ''
          } catch {
            // Canvas/filter failures must never interfere with loading or mode switching.
            stop()
          }
        }
        try {
          observer = new ResizeObserver(schedule)
          observer.observe(target)
          schedule()
        } catch {
          stop()
        }
        return { destroy: stop }
      }
    </script>
    <script>
      const $ = id => document.getElementById(id)
      const root = document.documentElement
      const params = new URLSearchParams(location.search)
      const themes = ['pond', 'sand', 'stage', 'brutal']
      const scenes = {
        selected: [
          'load',
          '加载',
          '已选工程',
          '工程已准备好，点击加载开始。',
          '中性细边 · 悬停后出现彩虹',
        ],
        running: [
          'close',
          '关闭',
          '运行中',
          '演出正在运行。',
          '正红细边 · 悬停后流动',
        ],
        pending: [
          'reopen',
          '重新打开',
          '有待应用修改',
          '配置已更改，重新打开后生效。',
          '彩虹环 · 重新启动并应用配置',
        ],
        node: [
          'node',
          '设置节点',
          '需要设置节点',
          '补全节点设置后即可加载。',
          '金橙细边 · 配置尚未完成',
        ],
        empty: [
          'load',
          '加载',
          '尚未选择工程',
          '点击左侧 runes 选择工程。',
          '中性描边 · 当前不可用',
        ],
        loading: [
          'load',
          '正在加载…',
          '正在加载',
          '正在准备本次演出。',
          '静态细边与进行中文案，防止重复点击',
        ],
        stopping: [
          'close',
          '正在关闭…',
          '正在关闭',
          '正在关闭当前演出。',
          '静态红色细边，防止重复点击',
        ],
        restarting: [
          'reopen',
          '重新打开中…',
          '正在重新打开',
          '正在关闭旧运行并应用新配置。',
          '连续反馈，完成后变为关闭',
        ],
      }
      const state = {
        theme: themes.includes(params.get('theme'))
          ? params.get('theme')
          : 'pond',
        language: params.get('lang') === 'en' ? 'en' : 'zh-CN',
        scene: Object.hasOwn(scenes, params.get('scene'))
          ? params.get('scene')
          : 'selected',
        paused: params.get('motion') === 'off',
        glow: params.get('glow') !== 'off',
        enlarged: params.get('detail') === 'large',
      }
      const translations = JSON.parse($('prototype-translations').textContent)
      const t = key =>
        state.language === 'en' ? (translations[key] ?? key) : key
      let timers = []
      let lenses = []
      function stopTimers() {
        timers.forEach(clearTimeout)
        timers = []
      }
      function busy() {
        return ['loading', 'stopping', 'restarting'].includes(state.scene)
      }
      function syncUrl() {
        const q = new URLSearchParams({
          theme: state.theme,
          lang: state.language,
          scene: state.scene,
        })
        if (state.paused) q.set('motion', 'off')
        if (!state.glow) q.set('glow', 'off')
        if (state.enlarged) q.set('detail', 'large')
        history.replaceState(null, '', `${location.pathname}?${q}`)
      }
      function render() {
        root.lang = state.language
        root.dataset.colorTheme = state.theme
        root.dataset.paused = String(state.paused)
        root.dataset.glow = String(state.glow)
        root.dataset.enlarged = String(state.enlarged)
        document.title = `PNDS · ${t('动作色环核对')}`
        document.querySelectorAll('[data-i18n]').forEach(node => {
          node.textContent = t(node.dataset.i18n)
        })
        const labels = ['色环对照', '底栏交互演示', '原型控制']
        document
          .querySelectorAll('section[aria-label], aside[aria-label]')
          .forEach((node, index) => {
            node.setAttribute('aria-label', t(labels[index]))
          })
        for (const id of ['load-swatches', 'reopen-swatches']) {
          $(id).replaceChildren(
            ...[
              '#ff285b',
              '#ff8a13',
              '#ffe52b',
              '#1de68a',
              '#00c8ff',
              '#5965ff',
              '#ca3cff',
            ].map(color => {
              const swatch = document.createElement('i')
              swatch.style.setProperty('--swatch', color)
              return swatch
            })
          )
        }
        $('theme').value = state.theme
        $('language').value = state.language
        $('scene').value = state.scene
        $('pause-motion').checked = state.paused
        $('glow').checked = state.glow
        $('enlarge').checked = state.enlarged
        const [action, label, name, description, detail] = scenes[state.scene]
        const button = $('session-action')
        button.dataset.action = action
        button.dataset.busy = String(busy())
        button.disabled = busy() || state.scene === 'empty'
        button.setAttribute('aria-busy', String(busy()))
        button.querySelector('.button-label').textContent = t(label)
        $('scene-description').textContent = t(description)
        $('state-name').textContent = t(name)
        $('state-detail').textContent = t(detail)
        $('select-project').disabled = busy()
        $('select-project').setAttribute(
          'aria-pressed',
          String(state.scene !== 'empty')
        )
        $('simulate-change').disabled = !['running', 'pending'].includes(
          state.scene
        )
        syncUrl()
      }
      function scene(next) {
        stopTimers()
        state.scene = next
        render()
      }
      function transition(next, finish) {
        scene(next)
        timers.push(setTimeout(() => scene(finish), 1500))
      }
      $('session-action').addEventListener('click', () => {
        if (busy()) return
        if (state.scene === 'selected') transition('loading', 'running')
        else if (state.scene === 'running') transition('stopping', 'empty')
        else if (state.scene === 'pending') transition('restarting', 'running')
        else if (state.scene === 'node') scene('selected')
      })
      $('select-project').addEventListener('click', () => {
        if (!busy() && !['running', 'pending'].includes(state.scene))
          scene('selected')
      })
      document.querySelectorAll('[data-scene]').forEach(button => {
        button.addEventListener('click', () => scene(button.dataset.scene))
      })
      $('scene').addEventListener('change', event => scene(event.target.value))
      $('simulate-change').addEventListener('click', () => {
        if (['running', 'pending'].includes(state.scene)) scene('pending')
      })
      $('reset').addEventListener('click', () => scene('selected'))
      $('language').addEventListener('change', event => {
        state.language = event.target.value
        render()
      })
      $('theme').addEventListener('change', event => {
        state.theme = event.target.value
        render()
        syncOptics()
      })
      for (const [id, key] of [
        ['pause-motion', 'paused'],
        ['glow', 'glow'],
        ['enlarge', 'enlarged'],
      ]) {
        $(id).addEventListener('change', event => {
          state[key] = event.target.checked
          render()
        })
      }
      document.querySelectorAll('.prototype-action').forEach(button => {
        const glass = document.createElement('span')
        glass.className = 'desktop-action-glass'
        glass.setAttribute('aria-hidden', 'true')
        glass.innerHTML =
          '<span class="desktop-action-glow"><span class="desktop-action-rim"><span class="desktop-action-orbit"></span></span></span><span class="desktop-action-rim"><span class="desktop-action-spectrum"><span class="desktop-action-orbit"></span></span></span><span class="desktop-action-lens"></span><span class="desktop-action-static-rim"></span>'
        button.prepend(glass)
      })
      const plain = window.matchMedia(
        '(prefers-reduced-motion: reduce), (prefers-reduced-transparency: reduce), (prefers-contrast: more), (forced-colors: active)'
      )
      function destroyLenses() {
        lenses.forEach(lens => lens.destroy())
        lenses = []
      }
      function syncOptics() {
        destroyLenses()
        if (plain.matches || state.theme === 'brutal') return
        lenses = Array.from(
          document.querySelectorAll('.desktop-action-spectrum'),
          target => createRimLens(target)
        )
      }
      plain.addEventListener('change', syncOptics)
      window.addEventListener('pagehide', () => {
        stopTimers()
        destroyLenses()
        plain.removeEventListener('change', syncOptics)
      })
      render()
      syncOptics()
    </script>
  </body>
</html>
