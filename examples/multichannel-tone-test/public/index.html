<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multichannel Tone Test — 16 test tones</title>
  <style>
    :root {
      --bg: #f4f5fa;
      --card: #ffffff;
      --text: #1c1e2b;
      --muted: #8a8fa3;
      --accent: #5a4ff3;
      --accent-soft: #e8eafd;
      --danger: #e11d48;
      --track: #e8ebf7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }
    header {
      text-align: center;
    }
    header h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
    header .sub { font-size: 12px; color: var(--muted); }

    /* Master volume row (always visible, above the grid) */
    .master {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 1px 3px rgba(23, 26, 43, 0.08);
    }
    .master label { font-size: 12px; color: var(--muted); }
    .master input[type='range'] {
      width: 220px;
      accent-color: var(--accent);
    }
    .master .value {
      min-width: 52px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      text-align: right;
    }

    /* 16 toggle buttons, centered */
    #rack {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      width: min(720px, 100%);
    }
    .tone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--track);
      border-radius: 10px;
      padding: 8px 4px 10px;
      box-shadow: 0 1px 3px rgba(23, 26, 43, 0.06);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .tone:hover { border-color: var(--accent); }
    .tone.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .tone .channel {
      font-size: 13px;
      font-weight: 600;
    }
    .tone .freq {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    .tone .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--track);
      transition: background 0.12s;
    }
    .tone.active .dot { background: var(--danger); }

    @media (max-width: 640px) {
      #rack { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Multichannel Tone Test</h1>
    <span class="sub" id="meta">16 test tones — all muted by default</span>
  </header>

  <div class="master">
    <label for="master">Master</label>
    <input id="master" type="range" min="0" max="1000" step="1" value="900" aria-label="Master volume" />
    <span class="value" id="master-value">-6.0 dBFS</span>
  </div>

  <div id="rack" role="group" aria-label="16 test-tone toggles"></div>

  <script>
    'use strict'
    const CHANNELS = 16
    const BASE_FREQUENCY = 440
    const MIN_DB = -60
    const MAX_DB = 0

    function toneFrequency(index) {
      return BASE_FREQUENCY * Math.pow(2, index / 12) // index 0-based here
    }

    /** Master fader position 0..1 -> dBFS label. */
    function valueToDb(value) {
      if (value === 0) return 'Mute'
      return (MIN_DB + value * (MAX_DB - MIN_DB)).toFixed(1) + ' dBFS'
    }

    async function postJson(url, body) {
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        })
        if (!response.ok) {
          const errorBody = await response.json().catch(() => ({}))
          console.error('request rejected:', errorBody.error || response.status)
        }
      } catch (error) {
        console.error('request failed:', error)
      }
    }

    /** Toggles one tone on/off and pushes it to the engine. */
    function setTone(channel, on) {
      void postJson('/api/tone', { channel, on })
    }

    /** Pushes the master fader to the engine. */
    function setMaster(value) {
      void postJson('/api/master', { value })
    }

    function buildTone(channel) {
      const freq = toneFrequency(channel - 1)
      const tone = document.createElement('button')
      tone.type = 'button'
      tone.className = 'tone'
      tone.setAttribute('aria-label', 'Channel ' + channel + ' tone')
      tone.setAttribute('aria-pressed', 'false')

      const ch = document.createElement('span')
      ch.className = 'channel'
      ch.textContent = 'CH ' + channel.toString().padStart(2, '0')

      const freqEl = document.createElement('span')
      freqEl.className = 'freq'
      freqEl.textContent = freq.toFixed(1) + ' Hz'

      const dot = document.createElement('span')
      dot.className = 'dot'

      tone.append(ch, freqEl, dot)
      tone.addEventListener('click', () => {
        const on = !tone.classList.contains('active')
        tone.classList.toggle('active', on)
        tone.setAttribute('aria-pressed', String(on))
        setTone(channel, on)
      })
      return tone
    }

    const rack = document.getElementById('rack')
    for (let i = 1; i <= CHANNELS; i += 1) {
      rack.appendChild(buildTone(i))
    }

    const master = document.getElementById('master')
    const masterValue = document.getElementById('master-value')
    master.addEventListener('input', () => {
      const value = Number(master.value) / 1000
      masterValue.textContent = valueToDb(value)
      setMaster(value)
    })

    // Reflect the host-declared channel count in the header when it differs
    // from this page's 16 (e.g. a degraded 16ch -> 2ch bridge).
    fetch('/api/state')
      .then(response => response.json())
      .then(state => {
        if (state.outputChannels && state.outputChannels !== CHANNELS) {
          document.getElementById('meta').textContent =
            '16 tones, host declares ' + state.outputChannels + ' output channels'
        }
      })
      .catch(() => undefined)
  </script>
</body>
</html>
