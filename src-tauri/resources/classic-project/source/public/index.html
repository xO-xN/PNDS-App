<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>PNDS Template</title>

    <link rel="stylesheet" type="text/css" href="style.css" />

    <script src="__config.js"></script>
    <script src="shared.js"></script>
    <script src="client.js"></script>
    <script>
      // Single page, two roles: the performer port serves the touch UI,
      // the monitor port serves the operator view. The SERVER says which
      // one it served (__config.js role, #138) — under the App's HTTPS
      // entry the browser's port is the entry's, not the manifest's, so
      // a port comparison would be unreliable.
      window.PNDS_IS_MONITOR = window.PNDS.role === "monitor";

      // Socket.IO is served by the performer server. The performer page
      // loads it SAME-ORIGIN — whatever origin served the page (the LAN
      // performer port in HTTP mode, the App's HTTPS entry behind it)
      // also serves its socket. The monitor page loads it cross-port via
      // its internal connection. No CDN: performances run offline.
      document.write(
        '\x3Cscript src="' +
          (window.PNDS_IS_MONITOR
            ? window.PNDSClient.socketOrigin({
                hostname: location.hostname,
                port: window.PNDS.performerPort,
              })
            : location.origin) +
          '/__pnds/shared/socket.io.js"\x3E\x3C/script\x3E',
      );

      // Both roles (performer touch UI and monitor) draw with p5.
      document.write(
        '\x3Cscript src="/__pnds/shared/p5.js"\x3E\x3C/script\x3E',
      );
    </script>
  </head>

  <body>
    <div id="rotate-overlay" class="hidden">
      <p>请旋转设备至横屏</p>
      <p>Rotate your device to landscape</p>
    </div>

    <main id="stage"></main>

    <script>
      if (window.PNDS_IS_MONITOR) {
        // Theme following (spec §5.3): the monitor page follows the App's
        // pushed theme. This page draws with p5 (no CSS variables), so it
        // consumes the palette through the onTheme callback instead —
        // monitor.js defines window.applyPndsTheme and reads the THEME
        // values every frame. The options global must exist before the
        // module loads.
        window.PNDS_THEME_OPTIONS = {
          applyVariables: false,
          onTheme: function (name, palette) {
            window.PNDS_LAST_THEME = { name: name, palette: palette };
            if (typeof window.applyPndsTheme === 'function') {
              window.applyPndsTheme(name, palette);
            }
          },
        };
        document.write(
          '\x3Cscript src="/__pnds/theme-follow.js"\x3E\x3C/script\x3E',
        );

        // Locale following (App ≥ v1.3.0): the same push mechanism as
        // the theme bridge, carrying the App's resolved language code.
        // The default <html lang> write stays on; monitor.js swaps its
        // string table through the onLocale callback below. The options
        // global must exist before the module loads.
        window.PNDS_LOCALE_OPTIONS = {
          onLocale: function (locale) {
            window.PNDS_LAST_LOCALE = locale;
            if (typeof window.applyPndsLocale === 'function') {
              window.applyPndsLocale(locale);
            }
          },
        };
        document.write(
          '\x3Cscript src="/__pnds/locale-follow.js"\x3E\x3C/script\x3E',
        );
        document.write('\x3Cscript src="monitor.js"\x3E\x3C/script\x3E');
      } else {
        document.write('\x3Cscript src="performer.js"\x3E\x3C/script\x3E');
      }
    </script>
  </body>
</html>
