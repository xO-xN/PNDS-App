<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{name}}</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(80%, 42rem);
        padding-block: 5rem;
        text-align: center;
        overflow-wrap: anywhere;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 5rem);
        font-weight: 500;
        line-height: 1.15;
      }
      p {
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{name}}</h1>
      <p>{{message}}</p>
    </main>
  </body>
</html>
