<div class="pnds-slingshot">
  <svg class="pnds-sling-svg" viewBox="0 0 240 260" aria-hidden="true">
    <path data-pnds-band d="M80,110a40,40 0 1,0 80,0a40,40 0 1,0 -80,0Z" />
  </svg>
  <button
    type="submit"
    data-pnds-ball
    aria-label="{{GESTURE_LABEL}}"
    aria-describedby="pnds-entry-instruction pnds-entry-status"
  >
    <svg
      data-pnds-arrow
      class="pnds-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="M12 19V5m-6 6 6-6 6 6" />
    </svg>
  </button>
  <div
    data-pnds-loader
    role="status"
    aria-label="{{LOADING}}"
    aria-hidden="true"
  >
    <span data-pnds-spinner hidden></span>
  </div>
</div>
