[package]
name = "pnds-app"
version = "1.3.4"
description = "在演出现场运行 PNDS 数字乐谱工程的 macOS 桌面 Host 应用"
authors = ["xO-xN"]
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pnds_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "test"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
log = "0.4"
ureq = { version = "3", default-features = false }
if-addrs = "0.13"
rosc = "0.11"
cpal = "0.18"
# v1.2.0 (issue #16): .pnds bundles are zip(deflate) archives; plain flate2
# deflate keeps packing fast even for large node_modules trees.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
# v1.2.0 (issue #16): sha256 of the packed .pnds for out-of-band verification.
sha2 = "0.10"
# v1.2.0 (issue #16): staging dir for read-only .pnds packing (also used by tests).
tempfile = "3"

# Type-safe Tauri command bindings
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta-typescript = "=0.0.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# NSWindow.alphaValue for the §7.4 whole-window fade (Tauri v2 removed
# set_opacity; we drive AppKit directly through the NSWindow pointer).
# v1.2.0 (issue #16): NSOpenPanel powers the ⌘O picker that accepts both
# project directories and .pnds bundle files.
# v1.3.3 (#79): NSMenu/NSMenuItem power the native context-menu guard
# (the willOpenMenu hook empties non-text web menus at the NSMenu level).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow", "NSOpenPanel", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSProcessInfo"] }

[dev-dependencies]

# Optimize for smaller binary size in release builds
[profile.release]
codegen-units = 1        # Better LLVM optimization (slower build, smaller binary)
lto = true               # Link-time optimizations
opt-level = "s"          # Optimize for size over speed
panic = "abort"          # Don't include panic unwinding code
strip = true             # Remove debug symbols

