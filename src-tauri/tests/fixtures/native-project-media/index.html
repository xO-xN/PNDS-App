<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PNDS</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.5 system-ui;
      background: #102129;
      color: #f0f7fa;
    }
    body {
      max-width: 58rem;
      margin: auto;
      padding: 1.5rem;
    }
    label {
      display: block;
      margin-block: 1rem 0.25rem;
    }
    button,
    select {
      font: inherit;
      padding: 0.7rem;
      margin: 0.25rem;
      max-width: 100%;
    }
    button:focus-visible,
    select:focus-visible {
      outline: 3px solid #7de3d1;
    }
    video {
      width: min(100%, 24rem);
      display: block;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    [hidden] {
      display: none !important;
    }
  </style>
  <body data-role="">
    <h1 id="title"></h1>
    <p id="context"></p>
    <p id="identity"></p>
    <div id="inputs">
      <label id="camera-label" for="camera"></label>
      <select id="camera"></select>
      <button id="start-camera" type="button"></button>
      <label id="microphone-label" for="microphone"></label>
      <select id="microphone"></select>
      <button id="start-microphone" type="button"></button>
      <button id="stop" type="button"></button>
      <video id="video" muted playsinline></video>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="observations"></p>
    <pre id="results"></pre>
    <script type="module" src="/page.mjs"></script>
  </body>
</html>
